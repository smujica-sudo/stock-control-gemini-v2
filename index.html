<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Kawas Stock · Material 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --primary: #355f9f;
      --on-primary: #ffffff;
      --primary-container: #d8e2ff;
      --on-primary-container: #001b3f;
      --secondary: #535f70;
      --secondary-container: #d7e3f7;
      --on-secondary-container: #101c2b;
      --surface: #f8f9ff;
      --surface-2: #eef1f9;
      --surface-3: #e7ebf4;
      --surface-card: rgba(255, 255, 255, 0.82);
      --on-surface: #191c20;
      --on-surface-variant: #44474f;
      --outline: #c4c7cf;
      --error: #ba1a1a;
      --error-container: #ffdad6;
      --warning: #a25f00;
      --warning-container: #ffdfb2;
      --success: #137333;
      --success-container: #d6f5db;
      --info: #00639a;
      --info-container: #cfe5ff;
      --shadow-1: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.1);
      --shadow-2: 0 8px 24px rgba(16, 24, 40, 0.1), 0 4px 10px rgba(16, 24, 40, 0.08);
      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 20px;
      --radius-sm: 16px;
      --content-width: 560px;
      --bottom-nav-height: 92px;
      --font-sans: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #fef7ff 0%, #f7f8ff 100%);
      color: var(--on-surface);
      font-family: var(--font-sans);
    }

    body {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    input,
    textarea {
      border: 0;
      outline: 0;
      background: transparent;
    }

    .material-symbols-rounded {
      font-family: "Material Symbols Rounded";
      font-weight: normal;
      font-style: normal;
      font-size: 22px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
      user-select: none;
    }

    .app-shell {
      height: 100%;
      width: 100%;
      max-width: var(--content-width);
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at top center, rgba(53, 95, 159, 0.11), transparent 36%),
        linear-gradient(180deg, #fef7ff 0%, #f8f9ff 38%, #f4f7fc 100%);
    }

    .page {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: max(18px, env(safe-area-inset-top)) 18px 10px;
      background: linear-gradient(180deg, rgba(248, 249, 255, 0.96), rgba(248, 249, 255, 0.78));
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      min-height: 56px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .topbar-title {
      min-width: 0;
    }

    .eyebrow {
      margin-bottom: 3px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
    }

    .headline {
      font-size: 20px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subhead {
      margin-top: 2px;
      font-size: 12px;
      color: var(--on-surface-variant);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .content {
      min-height: 0;
      overflow-y: auto;
      padding: 0 16px calc(var(--bottom-nav-height) + env(safe-area-inset-bottom) + 20px);
      scroll-behavior: smooth;
    }

    .content::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .section {
      margin-bottom: 18px;
      animation: enterUp 180ms ease both;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 14px 2px 10px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
    }

    .section-meta {
      font-size: 11px;
      color: var(--on-surface-variant);
    }

    .surface-card,
    .hero,
    .stat-card,
    .category-card,
    .subcat-card,
    .product-card,
    .alert-card,
    .history-card,
    .detail-hero,
    .projection-card,
    .report-card,
    .empty-card,
    .login-card,
    .sheet-panel,
    .supporting-row,
    .mini-stat,
    .action-tile {
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(247, 249, 255, 0.92));
      box-shadow: var(--shadow-1);
    }

    .hero,
    .detail-hero,
    .projection-card,
    .report-card,
    .login-card,
    .sheet-panel,
    .empty-card {
      border-radius: var(--radius-xl);
    }

    .stat-card,
    .category-card,
    .subcat-card,
    .product-card,
    .alert-card,
    .history-card,
    .action-tile,
    .mini-stat,
    .supporting-row {
      border-radius: var(--radius-lg);
    }

    .hero {
      padding: 18px;
      background: linear-gradient(135deg, rgba(216, 226, 255, 0.95), rgba(255, 255, 255, 0.95));
      box-shadow: var(--shadow-2);
    }

    .hero-title {
      margin-bottom: 6px;
      font-size: 24px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #17325f;
    }

    .hero-text {
      max-width: 38ch;
      font-size: 13px;
      line-height: 1.55;
      color: #314355;
    }

    .hero-actions,
    .utility-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .hero-actions {
      margin-top: 16px;
    }

    .nav-icon-btn,
    .icon-btn,
    .filled-btn,
    .tonal-btn,
    .text-btn,
    .tab-btn,
    .chip,
    .segmented-btn,
    .card-btn {
      border: 0;
      cursor: pointer;
      user-select: none;
      transition: transform 140ms ease, background-color 140ms ease, opacity 140ms ease;
    }

    .nav-icon-btn:active,
    .icon-btn:active,
    .filled-btn:active,
    .tonal-btn:active,
    .text-btn:active,
    .tab-btn:active,
    .chip:active,
    .segmented-btn:active,
    .card-btn:active {
      transform: scale(0.985);
    }

    .nav-icon-btn,
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--surface-3) 72%, white 28%);
      color: var(--on-surface-variant);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.52);
    }

    .filled-btn,
    .tonal-btn,
    .text-btn {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .filled-btn {
      background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 92%, white 8%), var(--primary));
      color: var(--on-primary);
      box-shadow: 0 10px 22px rgba(53, 95, 159, 0.26);
    }

    .tonal-btn {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .text-btn {
      background: transparent;
      color: var(--primary);
      padding-inline: 8px;
    }

    .stats-grid,
    .category-grid,
    .action-grid,
    .projection-grid,
    .report-kpis {
      display: grid;
      gap: 10px;
    }

    .stats-grid,
    .category-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .action-grid,
    .projection-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .report-kpis {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 12px;
    }

    .stat-card {
      min-height: 104px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      inset: auto -12px -40px auto;
      width: 88px;
      height: 88px;
      border-radius: 999px;
      background: color-mix(in srgb, currentColor 12%, transparent 88%);
      opacity: 0.9;
    }

    .stat-label {
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
    }

    .stat-value {
      font-size: 28px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .stat-foot {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--on-surface-variant);
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .category-card,
    .subcat-card,
    .product-card,
    .alert-card,
    .history-card,
    .card-btn {
      width: 100%;
      text-align: left;
      padding: 14px;
      display: block;
    }

    .category-card {
      min-height: 126px;
      padding: 16px;
    }

    .category-icon-wrap,
    .supporting-icon,
    .alert-icon,
    .history-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .category-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      margin-bottom: 14px;
      background: color-mix(in srgb, currentColor 16%, white 84%);
    }

    .category-title,
    .product-title,
    .row-title {
      font-size: 14px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--on-surface);
    }

    .category-title {
      font-size: 15px;
    }

    .category-meta,
    .row-subtitle,
    .helper {
      font-size: 11px;
      line-height: 1.45;
      color: var(--on-surface-variant);
    }

    .category-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      margin-top: 5px;
    }

    .badge {
      min-width: 22px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      background: var(--error);
      color: white;
      box-shadow: 0 4px 12px rgba(186, 26, 26, 0.2);
    }

    .search-shell {
      position: sticky;
      top: 0;
      z-index: 12;
      padding-top: 2px;
      background: linear-gradient(180deg, rgba(248, 249, 255, 0.95), rgba(248, 249, 255, 0.72));
      backdrop-filter: blur(14px);
    }

    .search-bar {
      min-height: 56px;
      padding: 0 14px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: color-mix(in srgb, var(--surface-3) 72%, white 28%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.66);
    }

    .search-bar input {
      width: 100%;
      min-width: 0;
      font-size: 15px;
      color: var(--on-surface);
    }

    .chips-row,
    .segmented {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 2px 0;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar,
    .segmented::-webkit-scrollbar {
      display: none;
    }

    .chip,
    .segmented-btn {
      min-height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.72);
      color: var(--on-surface-variant);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow-1);
      font-size: 13px;
      font-weight: 600;
    }

    .chip.is-active,
    .segmented-btn.is-active {
      background: var(--secondary-container);
      color: var(--on-secondary-container);
      border-color: transparent;
    }

    .bottom-nav {
      position: sticky;
      bottom: 0;
      z-index: 40;
      padding: 10px 12px calc(max(12px, env(safe-area-inset-bottom)));
      background: linear-gradient(180deg, rgba(248, 249, 255, 0), rgba(248, 249, 255, 0.82) 12%, rgba(248, 249, 255, 0.96));
      backdrop-filter: blur(18px);
    }

    .bottom-nav-inner {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding: 10px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: var(--shadow-2);
    }

    .tab-btn {
      min-height: 56px;
      border-radius: 18px;
      background: transparent;
      color: var(--on-surface-variant);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      position: relative;
    }

    .tab-btn.is-active {
      background: var(--secondary-container);
      color: var(--on-secondary-container);
    }

    .tab-btn-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .tab-badge-dot {
      position: absolute;
      top: 8px;
      right: 12px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--error);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.84);
    }

    .status-pill {
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .status-pill.ok {
      background: var(--success-container);
      color: var(--success);
    }

    .status-pill.low {
      background: var(--warning-container);
      color: var(--warning);
    }

    .status-pill.crit,
    .status-pill.zero {
      background: var(--error-container);
      color: var(--error);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(68, 71, 79, 0.12);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      transition: width 180ms ease;
    }

    .stock-figure {
      font-size: 24px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .alert-card,
    .history-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 78px;
    }

    .alert-icon,
    .history-icon {
      width: 42px;
      height: 42px;
      border-radius: 16px;
    }

    .alert-stock,
    .history-diff {
      text-align: right;
      min-width: 58px;
    }

    .detail-hero,
    .projection-card,
    .report-card {
      padding: 16px;
    }

    .detail-stock {
      margin-top: 10px;
      font-size: 56px;
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: -0.05em;
      font-family: var(--font-mono);
    }

    .mini-stat {
      padding: 12px 10px;
      text-align: center;
    }

    .mini-stat-value {
      margin-bottom: 5px;
      font-size: 18px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .mini-stat-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
    }

    .action-tile {
      min-height: 88px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      cursor: pointer;
    }

    .form-shell {
      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: var(--shadow-1);
    }

    .field {
      min-height: 60px;
      padding: 12px 14px;
      border-radius: 20px;
      display: grid;
      gap: 4px;
      background: color-mix(in srgb, var(--surface-3) 74%, white 26%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.56);
    }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
    }

    .field input,
    .field textarea {
      width: 100%;
      font-size: 15px;
      color: var(--on-surface);
      resize: vertical;
    }

    .field input[type="number"] {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-family: var(--font-mono);
    }

    .timeline {
      margin-top: 12px;
    }

    .timeline-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
    }

    .timeline-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(68, 71, 79, 0.1);
      overflow: hidden;
    }

    .timeline-fill {
      height: 100%;
      border-radius: inherit;
    }

    .supporting-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .supporting-row {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .supporting-icon {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .empty-card,
    .login-shell {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
    }

    .empty-card {
      padding: 28px 24px;
    }

    .login-shell {
      background:
        radial-gradient(circle at 50% 0%, rgba(53, 95, 159, 0.18), transparent 28%),
        radial-gradient(circle at 10% 100%, rgba(107, 87, 120, 0.1), transparent 26%),
        linear-gradient(180deg, #fef7ff 0%, #f8f9ff 50%, #f5f7fc 100%);
    }

    .brand-orb {
      width: 88px;
      height: 88px;
      margin-bottom: 20px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #5d8bd2, #355f9f);
      color: white;
      box-shadow: 0 18px 44px rgba(53, 95, 159, 0.3);
    }

    .brand-title {
      margin-bottom: 8px;
      font-size: 32px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #17325f;
    }

    .brand-text {
      max-width: 30ch;
      margin-bottom: 28px;
      font-size: 14px;
      line-height: 1.6;
      color: #4d5f73;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      padding: 18px;
      text-align: left;
      box-shadow: var(--shadow-2);
    }

    .login-pin {
      min-height: 72px;
      margin-top: 12px;
      padding: 16px 18px;
      border-radius: 24px;
      display: grid;
      gap: 6px;
      background: color-mix(in srgb, var(--surface-3) 75%, white 25%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.62);
    }

    .login-pin input {
      width: 100%;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.35em;
      text-align: center;
      color: var(--on-surface);
      font-family: var(--font-mono);
    }

    .login-hints {
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
      color: var(--on-surface-variant);
    }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 80;

      const utils = {
        escape(value) {
          return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#039;");
        },
        status(item) {
          if (item.stock <= 0) return "zero";
          if (item.stock < item.min * 0.3) return "crit";
          if (item.stock < item.min) return "low";
          return "ok";

            zero: { label: "Agotado", tone: "zero", color: "var(--error)", bg: "var(--error-container)", icon: "block" },
            crit: { label: "Crítico", tone: "crit", color: "var(--error)", bg: "var(--error-container)", icon: "warning" },
            low: { label: "Bajo", tone: "low", color: "var(--warning)", bg: "var(--warning-container)", icon: "error" },
            ok: { label: "OK", tone: "ok", color: "var(--success)", bg: "var(--success-container)", icon: "check_circle" }
          };
          return map[status] || map.ok;
        },
        pct(item) {
          if (!item.min) return 100;

          const now = new Date();

          return `${pad(now.getDate())}/${pad(now.getMonth() + 1)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
        },
        parseFlexibleDate(value) {
          if (!value) return null;
          const direct = new Date(value);
          if (!Number.isNaN(direct.getTime())) return direct;
          const [datePart, timePart = "00:00"] = String(value).split(" ");
          if (!datePart || !datePart.includes("/")) return null;
          const [dd, mm, yy] = datePart.split("/").map(Number);
          const [hh = 0, mi = 0] = timePart.split(":").map(Number);
          const fullYear = yy ? (yy < 100 ? yy + 2000 : yy) : new Date().getFullYear();
          const parsed = new Date(fullYear, (mm || 1) - 1, dd || 1, hh || 0, mi || 0);
          return Number.isNaN(parsed.getTime()) ? null : parsed;
        },

              title: "Sin stock disponible",
              subtitle: "No hay unidades para cubrir demanda.",
              daysLeft: 0,
              dailyUse: 0,
              dateOut: "—",
              color: "var(--error)",
              icon: "dangerous"
            };

          const consumptions = state.data.history
            .filter((entry) => entry.id === item.id && Number(entry.ns) < Number(entry.os))
            .map((entry) => ({
              amount: Number(entry.os) - Number(entry.ns),
              date: utils.parseFlexibleDate(entry.ts),
              type: entry.tp
            }));

          if (!consumptions.length) {
            const fallbackUse = Math.max(1, Math.round((item.min || 14) / 14));
            const fallbackDays = Math.max(1, Math.round(item.stock / fallbackUse));
            return projectionTone(fallbackDays, {
              title: "Estimación inicial",
              subtitle: "Aún no hay suficiente histórico de consumo.",
              daysLeft: fallbackDays,
              dailyUse: fallbackUse,
              dateOut: shortDate(addDays(new Date(), fallbackDays))
            });
          }

          const dated = consumptions.filter((entry) => entry.date);
          let spanDays = 1;
          if (dated.length >= 2) {
            dated.sort((a, b) => a.date - b.date);
            spanDays = Math.max(1, Math.round(Math.abs(dated[dated.length - 1].date - dated[0].date) / 86400000));
          } else if (dated.length === 1) {
            spanDays = Math.max(1, Math.round(Math.abs(new Date() - dated[0].date) / 86400000));
          } else {
            spanDays = Math.max(1, consumptions.length * 3);
          }

          const totalConsumed = consumptions.reduce((sum, entry) => sum + entry.amount, 0);
          const dailyUse = Math.max(0.1, totalConsumed / spanDays);
          const daysLeft = Math.max(0, Math.round(item.stock / dailyUse));
          return projectionTone(daysLeft, {
            title: "Cobertura estimada",
            subtitle: `Basado en ${consumptions.length} movimiento${consumptions.length > 1 ? "s" : ""} durante ${spanDays} día${spanDays > 1 ? "s" : ""}.`,
            daysLeft,
            dailyUse: dailyUse < 1 ? Number(dailyUse.toFixed(1)) : Math.round(dailyUse),
            dateOut: shortDate(addDays(new Date(), daysLeft))
          });
        }

      function projectionTone(daysLeft, payload) {
        if (daysLeft <= 7) return { ...payload, color: "var(--error)", icon: "emergency_home" };
        if (daysLeft <= 21) return { ...payload, color: "var(--warning)", icon: "schedule" };
        if (daysLeft <= 45) return { ...payload, color: "var(--info)", icon: "event_upcoming" };
        return { ...payload, color: "var(--success)", icon: "verified" };

        const next = new Date(date);
        next.setDate(next.getDate() + amount);
        return next;
      }

      function shortDate(date) {
        const pad = (n) => String(n).padStart(2, "0");

        },
        historyForItem(id) {
          return state.data.history.filter((entry) => entry.id === id);
        },
        alerts() {
          return selectors.items()
            .filter((item) => utils.status(item) !== "ok")
            .sort((a, b) => statusOrder(utils.status(a)) - statusOrder(utils.status(b)) || a.stock - b.stock);
        },
        criticals() {
          return selectors.alerts().filter((item) => ["zero", "crit"].includes(utils.status(item)));
        },
        categories() {
          const map = new Map();
          selectors.items().forEach((item) => {
            if (!map.has(item.cat)) map.set(item.cat, []);
            map.get(item.cat).push(item);
          });
          return Array.from(map.entries()).map(([name, items]) => ({ name, items }));
        },
        subcategories(catName) {
          const map = new Map();
          selectors.items().filter((item) => item.cat === catName).forEach((item) => {
            const sub = item.subcat || "General";
            if (!map.has(sub)) map.set(sub, []);
            map.get(sub).push(item);
          });
          return Array.from(map.entries()).map(([name, items]) => ({ name, items }));
        },
        currentItems() {
          const category = state.navigation.category;
          const subcategory = state.navigation.subcategory;
          if (!category) return selectors.items();
          return selectors.items().filter((item) => {
            const sameCat = item.cat === category;
            const sameSub = !subcategory || (item.subcat || "General") === subcategory;
            return sameCat && sameSub;
          });
        },
        searchResults() {
          const q = state.ui.query.trim().toLowerCase();
          if (!q) return [];
          const statusFilter = state.ui.searchStatus;
          return selectors.items()
            .filter((item) => {
              const haystack = [item.name, item.cat, item.subcat, item.alert].filter(Boolean).join(" ").toLowerCase();
              const matchesText = haystack.includes(q);
              const matchesStatus = statusFilter === "all" || utils.status(item) === statusFilter;
              return matchesText && matchesStatus;
            })
            .sort((a, b) => statusOrder(utils.status(a)) - statusOrder(utils.status(b)) || a.name.localeCompare(b.name));
        },
        metrics() {
          const items = selectors.items();
          const totalUnits = items.reduce((sum, item) => sum + Number(item.stock || 0), 0);
          return {
            totalItems: items.length,
            totalUnits,
            low: items.filter((item) => utils.status(item) === "low").length,
            crit: items.filter((item) => utils.status(item) === "crit").length,
            zero: items.filter((item) => utils.status(item) === "zero").length,
            ok: items.filter((item) => utils.status(item) === "ok").length
          };
        }
      };

      function statusOrder(status) {
        return ({ zero: 0, crit: 1, low: 2, ok: 3 })[status] ?? 99;
      }

      function categoryMeta(catName) {
        return CATEGORY_META[catName] || { icon: "category", color: "#355f9f" };
      }

      function persist() {
        try {
          localStorage.setItem(CONFIG.storageKey, JSON.stringify({
            session: state.session,
            data: {
              items: state.data.items,
              history: state.data.history,
              lastSyncAt: state.data.lastSyncAt
            }
          }));
        } catch (error) {
          console.warn("No se pudo persistir el estado", error);
        }
      }

      function hydrate() {
        try {
          const raw = localStorage.getItem(CONFIG.storageKey);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (parsed?.data?.items?.length) state.data.items = parsed.data.items;
          if (Array.isArray(parsed?.data?.history)) state.data.history = parsed.data.history;
          if (parsed?.data?.lastSyncAt) state.data.lastSyncAt = parsed.data.lastSyncAt;
          if (parsed?.session?.user) state.session.user = parsed.session.user;
        } catch (error) {
          console.warn("No se pudo hidratar el estado", error);
        }
      }

      function isOnlineMode() {
        const url = CONFIG.apiUrl;
        return Boolean(url && url !== "DEMO" && url !== "TU_URL_AQUI");
      }

      function toast(message, tone = "ok") {
        if (state.ui.toastTimer) clearTimeout(state.ui.toastTimer);
        state.ui.toast = { message, tone };
        render();
        state.ui.toastTimer = setTimeout(() => {
          state.ui.toast = null;
          render();
        }, 2400);
      }

      async function syncAll() {
        if (!isOnlineMode() || state.data.syncing) return;
        state.data.syncing = true;
        render();
        try {
          const [itemsRes, historyRes] = await Promise.all([
            fetch(`${CONFIG.apiUrl}?action=getAll`),
            fetch(`${CONFIG.apiUrl}?action=getHistory&limit=120`)
          ]);
          const itemsData = await itemsRes.json();
          const historyData = await historyRes.json();

          if (itemsData?.success && Array.isArray(itemsData.items)) {
            state.data.items = itemsData.items.map((row) => ({
              id: String(row.id),
              cat: String(row.categoria),
              subcat: String(row.subcategoria || ""),
              name: String(row.nombre),
              stock: Number(row.stock) || 0,
              min: Number(row.minimo) || 0,
              unit: String(row.unidad || "uds"),
              alert: String(row.alerta || "")
            }));
          }

          if (historyData?.success && Array.isArray(historyData.entries)) {
            state.data.history = historyData.entries.map((row) => ({
              id: String(row.itemId),
              nm: String(row.itemNombre || ""),
              cat: String(row.categoria || ""),
              tp: String(row.tipo || "ajuste"),
              os: Number(row.stockAnterior) || 0,
              ns: Number(row.stockNuevo) || 0,
              nt: String(row.nota || ""),
              u: String(row.usuario || "?"),
              ts: row.timestamp ? String(row.timestamp).replace("T", " ").slice(0, 16) : utils.nowStamp()
            }));
          }

          state.data.lastSyncAt = new Date().toISOString();
          persist();
          toast("Sincronización completada");
        } catch (error) {
          console.error(error);
          toast("Error de sincronización. Se conserva copia local.", "warn");
        } finally {
          state.data.syncing = false;
          render();
        }
      }

      async function pushUpdate(item, oldStock, newStock, type, note) {
        if (!isOnlineMode()) return;
        try {
          const response = await fetch(CONFIG.apiUrl, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "updateStock",
              itemId: item.id,
              oldStock,
              newStock,
              tipo: type,
              usuario: state.session.user?.name || "?",
              nota: note || ""
            })
          });
          const data = await response.json();
          if (!data?.success) {
            toast(`No se pudo guardar en Sheets${data?.error ? `: ${data.error}` : ""}`, "warn");
          }
        } catch (error) {
          console.error(error);
          toast("Cambio guardado localmente. Falló envío remoto.", "warn");
        }
      }

      function authenticate(pin) {
        const user = USERS.find((entry) => entry.pin === pin);
        if (!user) {
          toast("PIN incorrecto", "err");
          return false;
        }
        state.session.user = { name: user.name, role: user.role };
        persist();
        render();
        toast(`Hola, ${user.name}`);
        syncAll();
        return true;
      }

      function logout() {
        state.session.user = null;
        state.navigation.category = null;
        state.navigation.subcategory = null;
        state.navigation.itemId = null;
        state.ui.tab = "home";
        state.ui.query = "";
        closeSheet(false);
        persist();
        render();
      }

      function openItem(id) {
        state.navigation.itemId = id;
        render();
      }

      function closeItem() {
        state.navigation.itemId = null;
        closeSheet(false);
        render();
      }

      function openCategory(category) {
        state.navigation.category = category;
        state.navigation.subcategory = null;
        state.navigation.itemId = null;
        render();
      }

      function openSubcategory(subcategory) {
        state.navigation.subcategory = subcategory;
        state.navigation.itemId = null;
        render();
      }

      function navigateHome() {
        state.navigation.category = null;
        state.navigation.subcategory = null;
        state.navigation.itemId = null;
        state.ui.tab = "home";
        closeSheet(false);
        render();
      }

      function goBack() {
        if (state.navigation.itemId) {
          closeItem();
          return;
        }
        if (state.navigation.subcategory) {
          state.navigation.subcategory = null;
          render();
          return;
        }
        if (state.navigation.category) {
          state.navigation.category = null;
          render();
        }
      }

      function changeTab(tab) {
        state.ui.tab = tab;
        state.navigation.category = null;
        state.navigation.subcategory = null;
        state.navigation.itemId = null;
        if (tab !== "search") state.ui.query = "";
        closeSheet(false);
        render();
      }

      function updateSearch(query) {
        state.ui.query = query;
        render();
      }

      function openSheet(mode, itemId) {
        state.ui.sheet = { open: true, mode, itemId };
        render();
      }

      function closeSheet(shouldRender = true) {
        state.ui.sheet = { open: false, mode: null, itemId: null };
        if (shouldRender) render();
      }

      function applyAdjustment(mode, itemId, value, note) {
        const numeric = Number(value);
        if (Number.isNaN(numeric) || numeric < 0) {
          toast("Ingresa un valor válido", "err");
          return;
        }
        const item = selectors.itemById(itemId);
        if (!item) return;

        const oldStock = Number(item.stock);
        const nextStock = mode === "in"
          ? oldStock + numeric
          : mode === "out"
            ? Math.max(0, oldStock - numeric)
            : numeric;

        state.data.items = state.data.items.map((entry) => entry.id === itemId ? { ...entry, stock: nextStock } : entry);
        state.data.history.unshift({
          id: item.id,
          nm: item.name,
          cat: item.cat,
          tp: mode === "in" ? "ingreso" : mode === "out" ? "salida" : "ajuste",
          os: oldStock,
          ns: nextStock,
          nt: note || "",
          u: state.session.user?.name || "?",
          ts: utils.nowStamp()
        });

        persist();
        closeSheet(false);
        render();
        pushUpdate(item, oldStock, nextStock, mode === "in" ? "ingreso" : mode === "out" ? "salida" : "ajuste", note);
        toast(`${item.name}: ${oldStock} → ${nextStock}`);
      }

            <div style="min-width:0">
              <div class="row-title">${utils.escape(item.name)}</div>
              <div class="row-subtitle">${utils.escape(item.cat)}${item.alert ? ` · ${utils.escape(item.alert)}` : ""}</div>
            </div>
            <div class="alert-stock">
              <div class="stock-figure" style="font-size:22px;color:${meta.color}">${utils.escape(String(item.stock))}</div>
              <div class="status-pill ${meta.tone}">${utils.escape(meta.label)}</div>
            </div>
          </button>
        `;
      }

      function renderCategoryCard(group) {
        const meta = categoryMeta(group.name);
        const alertCount = group.items.filter((item) => utils.status(item) !== "ok").length;
        const subCount = selectors.subcategories(group.name).length;
        return `
          <button class="category-card card-btn" data-category="${utils.escape(group.name)}">
            <div class="category-icon-wrap" style="color:${meta.color}">${icon(meta.icon)}</div>
            <div class="category-title">${utils.escape(group.name)}</div>
            <div class="category-meta">
              <span>${group.items.length} ítems</span>
              <span>·</span>
              <span>${subCount} subgrupos</span>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;">
              <span class="row-subtitle">Entrar</span>
              ${alertCount ? `<span class="badge">${alertCount}</span>` : icon("arrow_forward")}
            </div>
          </button>
        `;
      }

      function renderSubcategoryCard(group) {
        const alertCount = group.items.filter((item) => utils.status(item) !== "ok").length;
        const totalStock = group.items.reduce((sum, item) => sum + item.stock, 0);
        return `
          <button class="subcat-card card-btn" data-subcategory="${utils.escape(group.name)}">
            <div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;">
              <div>
                <div class="row-title">${utils.escape(group.name)}</div>
                <div class="row-subtitle">${group.items.length} productos</div>
              </div>
              <div style="text-align:right;">
                <div class="stock-figure" style="font-size:22px;color:var(--primary)">${utils.escape(String(totalStock))}</div>
                <div class="row-subtitle">stock total</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;">
              <span class="row-subtitle">Abrir grupo</span>
              ${alertCount ? `<span class="badge">${alertCount}</span>` : icon("arrow_forward")}
            </div>
          </button>
        `;
      }

      function renderProductCard(item) {
        const status = utils.status(item);
        const meta = utils.statusMeta(status);
        const pct = utils.pct(item);
        return `
          <button class="product-card card-btn" data-item-id="${utils.escape(item.id)}">
            <div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;">
              <div style="min-width:0">
                <div class="product-title">${utils.escape(item.name)}</div>
                <div class="row-subtitle">${utils.escape(item.cat)}${item.subcat ? ` · ${utils.escape(item.subcat)}` : ""}${item.alert ? ` · ${utils.escape(item.alert)}` : ""}</div>
              </div>
              <div style="text-align:right;min-width:74px;">
                <div class="stock-figure" style="color:${meta.color}">${utils.escape(String(item.stock))}</div>
                <div class="row-subtitle">${utils.escape(item.unit)}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;margin-bottom:8px;">
              <span class="status-pill ${meta.tone}">${icon(meta.icon)} ${utils.escape(meta.label)}</span>
              <span class="row-subtitle">Mín. ${utils.escape(String(item.min))}</span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${utils.progressColor(item)}"></div></div>
          </button>
        `;
      }

      function renderHistoryCard(entry) {
        const diff = Number(entry.ns) - Number(entry.os);
        const color = entry.tp === "ingreso" ? "var(--success)" : entry.tp === "salida" ? "var(--error)" : "var(--primary)";
        const bg = entry.tp === "ingreso" ? "var(--success-container)" : entry.tp === "salida" ? "var(--error-container)" : "var(--primary-container)";
        const symbol = entry.tp === "ingreso" ? "south" : entry.tp === "salida" ? "north" : "edit";
        return `
          <div class="history-card">
            <div class="history-icon" style="background:${bg};color:${color};">${icon(symbol)}</div>
            <div style="min-width:0">
              <div class="row-title">${utils.escape(entry.nm)}</div>
              <div class="row-subtitle">${utils.escape(entry.cat)} · ${utils.escape(entry.ts)} · ${utils.escape(entry.u)}${entry.nt ? ` · ${utils.escape(entry.nt)}` : ""}</div>
            </div>
            <div class="history-diff">
              <div class="row-subtitle">${utils.escape(String(entry.os))} → ${utils.escape(String(entry.ns))}</div>
              <div class="stock-figure" style="font-size:18px;color:${color}">${diff > 0 ? "+" : ""}${utils.escape(String(diff))}</div>
            </div>
          </div>
        `;
      }

      function renderMiniStat(value, label) {
        return `
          <div class="mini-stat">
            <div class="mini-stat-value">${utils.escape(String(value))}</div>
            <div class="mini-stat-label">${utils.escape(label)}</div>
          </div>
        `;
      }

      function renderActionTile(label, iconName, color, mode, itemId) {
        return `
          <button class="action-tile card-btn" data-sheet-mode="${mode}" data-sheet-item="${utils.escape(itemId)}">
            <div style="width:42px;height:42px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, ${color} 14%, white 86%);color:${color};">${icon(iconName)}</div>
            <div>
              <div class="row-title">${utils.escape(label)}</div>
              <div class="row-subtitle">Abrir acción</div>
            </div>
          </button>
        `;
      }

      function renderEmpty(iconName, title, text) {
        return `
          <div class="empty-card">
            <div class="brand-orb" style="width:64px;height:64px;border-radius:22px;margin-bottom:16px;box-shadow:none;background:linear-gradient(180deg,#d8e2ff,#c6d7ff);color:#17325f;">${icon(iconName)}</div>
            <div class="headline" style="white-space:normal;text-align:center;">${utils.escape(title)}</div>
            <div class="brand-text" style="margin:10px 0 0;max-width:28ch;">${utils.escape(text)}</div>
          </div>
        `;
      }

      function formatSyncLabel(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return "hace un momento";
        return date.toLocaleString("es-CL", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function renderMainShell() {
        const metrics = selectors.metrics();
        const alerts = selectors.alerts();
        const categories = selectors.categories();

        appEl.innerHTML = `
          <div class="page">
            ${renderTopbar({
              eyebrow: CONFIG.appName,
              title: state.ui.tab === "home" ? "Vista general" : state.ui.tab === "search" ? "Búsqueda inteligente" : state.ui.tab === "alerts" ? "Alertas activas" : state.ui.tab === "history" ? "Historial reciente" : "Reporte ejecutivo",
              subtitle: state.data.syncing ? "Sincronizando datos…" : state.data.lastSyncAt ? `Última sincronización ${formatSyncLabel(state.data.lastSyncAt)}` : state.session.user.role,
              leading: `<button class="nav-icon-btn" data-action="go-home">${icon("home")}</button>`,
              trailing: `<div class="utility-row" style="justify-content:flex-end"><button class="icon-btn" data-action="sync">${icon(state.data.syncing ? "progress_activity" : "sync")}</button><button class="icon-btn" data-action="logout">${icon("logout")}</button></div>`
            })}
            <main class="content">${renderMainContent(metrics, alerts, categories)}</main>
            ${renderBottomNav()}
          </div>
        `;

        const searchInput = document.getElementById("search-input");
        if (searchInput) {
          searchInput.value = state.ui.query;
          searchInput.addEventListener("input", (event) => updateSearch(event.target.value));
        }
      }

      function renderMainContent(metrics, alerts, categories) {
        switch (state.ui.tab) {
          case "search":
            return renderSearchView();
          case "alerts":
            return renderAlertsView(alerts);
          case "history":
            return renderHistoryView();
          case "report":
            return renderReportView(metrics, alerts);
          case "home":
          default:
            return `
              <section class="section hero">
                <div class="eyebrow">Panel operativo</div>
                <div class="hero-title">Inventario claro, rápido y accionable.</div>
                <div class="hero-text">Rediseño completo con Material Design 3, navegación limpia y foco absoluto en lectura, velocidad y operación móvil.</div>
                <div class="hero-actions">
                  <button class="filled-btn" data-tab="alerts">${icon("priority_high")} Ver críticos</button>
                  <button class="tonal-btn" data-action="sync">${icon("sync")} Sincronizar</button>
                </div>
              </section>

              <section class="section">
                <div class="section-title-row">
                  <div class="section-title">Resumen</div>
                  <div class="section-meta">${utils.escape(state.session.user.name)} · ${utils.escape(state.session.user.role)}</div>
                </div>
                <div class="stats-grid">
                  ${renderStatCard("Productos", metrics.totalItems, "inventory_2", "var(--primary)")}
                  ${renderStatCard("Bajo mínimo", metrics.low, "trending_down", "var(--warning)")}
                  ${renderStatCard("Críticos", metrics.crit, "warning", "var(--error)")}
                  ${renderStatCard("Agotados", metrics.zero, "block", "var(--error)")}
                </div>
              </section>

              <section class="section">
                <div class="section-title-row">
                  <div class="section-title">Acción inmediata</div>
                  <button class="text-btn" data-tab="alerts">Ver todo</button>
                </div>
                ${alerts.length ? `<div class="list">${alerts.slice(0, 6).map(renderAlertCard).join("")}</div>` : renderEmpty("task_alt", "No hay alertas activas", "Todo el portafolio está dentro de los parámetros definidos.")}
              </section>

              <section class="section">
                <div class="section-title-row">
                  <div class="section-title">Categorías</div>
                  <div class="section-meta">${categories.length} grupos</div>
                </div>
                <div class="category-grid">${categories.map(renderCategoryCard).join("")}</div>
              </section>
            `;
        }
      }

      function renderSearchView() {
        const results = selectors.searchResults();
        const hasQuery = Boolean(state.ui.query.trim());
        const statusChips = [
          { id: "all", label: "Todos" },
          { id: "zero", label: "Agotados" },
          { id: "crit", label: "Críticos" },
          { id: "low", label: "Bajo mínimo" }
        ];

        return `
          <section class="section search-shell">
            <div class="search-bar">
              ${icon("search")}
              <input id="search-input" placeholder="Buscar por producto, categoría o alerta" value="${utils.escape(state.ui.query)}" />
              ${hasQuery ? `<button class="icon-btn" data-action="clear-search">${icon("close")}</button>` : `<span style="width:44px"></span>`}
            </div>
          </section>

          <section class="section">
            <div class="segmented">
              ${statusChips.map((chip) => `<button class="segmented-btn ${state.ui.searchStatus === chip.id ? "is-active" : ""}" data-search-status="${chip.id}">${utils.escape(chip.label)}</button>`).join("")}
            </div>
          </section>

          <section class="section">
            <div class="section-title-row">
              <div class="section-title">Resultados</div>
              <div class="section-meta">${hasQuery ? `${results.length} coincidencias` : "Escribe para comenzar"}</div>
            </div>
            ${!hasQuery ? renderEmpty("pageview", "Empieza con una búsqueda", "La búsqueda cruza producto, categoría, subcategoría y alertas.") : results.length ? `<div class="list">${results.map(renderProductCard).join("")}</div>` : renderEmpty("search_off", "Sin resultados", "Prueba con otro nombre, categoría o estado.")}
          </section>
        `;
      }

      function renderAlertsView(alerts) {
        return `
          <section class="section">
            <div class="chips-row">
              <div class="chip is-active">${icon("warning")} ${alerts.length} activas</div>
              <div class="chip">${icon("priority_high")} ${selectors.criticals().length} críticas</div>
            </div>
          </section>
          <section class="section">
            ${alerts.length ? `<div class="list">${alerts.map(renderAlertCard).join("")}</div>` : renderEmpty("task_alt", "Todo en orden", "No hay productos fuera de umbral en este momento.")}
          </section>
        `;
      }

      function renderHistoryView() {
        const entries = state.data.history.slice(0, 80);
        return `
          <section class="section">
            <div class="chips-row">
              <div class="chip is-active">${icon("history")} ${entries.length} movimientos</div>
              <div class="chip">${icon("person")} ${utils.escape(state.session.user.name)}</div>
            </div>
          </section>
          <section class="section">
            ${entries.length ? `<div class="list">${entries.map(renderHistoryCard).join("")}</div>` : renderEmpty("inbox", "Aún no hay movimientos", "Cuando registres ingresos, salidas o ajustes, aparecerán aquí.")}
          </section>
        `;
      }

      function renderReportView(metrics, alerts) {
        const topItems = alerts.slice(0, 5).map((item) => {
          const projection = utils.projection(item);
          return `
            <div class="supporting-row">
              <div class="supporting-icon">${icon("insights")}</div>
              <div style="flex:1;min-width:0;">
                <div class="row-title">${utils.escape(item.name)}</div>
                <div class="row-subtitle">${utils.escape(item.cat)} · ${projection.daysLeft} días · ${utils.escape(projection.dateOut)}</div>
              </div>
            </div>
          `;
        }).join("");

        return `
          <section class="section report-card">
            <div class="eyebrow">Reporte</div>
            <div class="headline" style="white-space:normal;">Resumen listo para impresión o revisión ejecutiva.</div>
            <div class="subhead" style="white-space:normal;margin-top:8px;">Genera una vista clara con productos críticos, cobertura estimada y stock consolidado por categoría.</div>
            <div class="report-kpis">
              ${renderMiniStat(metrics.totalItems, "Productos")}
              ${renderMiniStat(metrics.totalUnits.toLocaleString("es-CL"), "Unidades")}
              ${renderMiniStat(metrics.crit + metrics.zero, "Críticos")}
              ${renderMiniStat(metrics.low, "Bajo mínimo")}
            </div>
            <div class="utility-row" style="margin-top:16px;">
              <button class="filled-btn" data-action="generate-report">${icon("picture_as_pdf")} Abrir reporte</button>
              <button class="tonal-btn" data-action="open-sheet-url">${icon("table_view")} Abrir base</button>
            </div>
            <div class="supporting-list">
              ${topItems || `<div class="supporting-row"><div class="supporting-icon">${icon("check_circle")}</div><div><div class="row-title">Sin urgencias</div><div class="row-subtitle">No hay productos bajo el mínimo en este momento.</div></div></div>`}
            </div>
          </section>
        `;
      }

      function renderCategoryView() {
        const groups = selectors.subcategories(state.navigation.category);
        const total = groups.reduce((sum, entry) => sum + entry.items.length, 0);
        appEl.innerHTML = `
          <div class="page">
            ${renderTopbar({
              eyebrow: state.navigation.category,
              title: "Subcategorías",
              subtitle: `${total} productos distribuidos`,
              leading: `<button class="nav-icon-btn" data-action="back">${icon("arrow_back")}</button>`,
              trailing: `<button class="icon-btn" data-action="go-home">${icon("home")}</button>`
            })}
            <main class="content">
              <section class="section"><div class="list">${groups.map(renderSubcategoryCard).join("")}</div></section>
            </main>
            ${renderBottomNav()}
          </div>
        `;
      }

      function renderSubcategoryView() {
        const items = selectors.currentItems().sort((a, b) => statusOrder(utils.status(a)) - statusOrder(utils.status(b)) || a.name.localeCompare(b.name));
        appEl.innerHTML = `
          <div class="page">
            ${renderTopbar({
              eyebrow: state.navigation.category,
              title: state.navigation.subcategory,
              subtitle: `${items.length} ítems en esta vista`,
              leading: `<button class="nav-icon-btn" data-action="back">${icon("arrow_back")}</button>`,
              trailing: `<button class="icon-btn" data-action="go-home">${icon("home")}</button>`
            })}
            <main class="content">
              <section class="section"><div class="list">${items.map(renderProductCard).join("")}</div></section>
            </main>
            ${renderBottomNav()}
          </div>
        `;
      }

      function renderItemDetail(item) {
        const status = utils.status(item);
        const meta = utils.statusMeta(status);
        const projection = utils.projection(item);
        const history = selectors.historyForItem(item.id).slice(0, 16);
        const pct = utils.pct(item);

        appEl.innerHTML = `
          <div class="page">
            ${renderTopbar({
              eyebrow: `${item.cat}${item.subcat ? ` · ${item.subcat}` : ""}`,
              title: item.name,
              subtitle: item.alert || meta.label,
              leading: `<button class="nav-icon-btn" data-action="back">${icon("arrow_back")}</button>`,
              trailing: `<button class="icon-btn" data-action="go-home">${icon("home")}</button>`
            })}
            <main class="content">
              <section class="section detail-hero">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
                  <div>
                    <div class="eyebrow">Stock actual</div>
                    <div class="detail-stock" style="color:${meta.color}">${utils.escape(String(item.stock))}</div>
                    <div class="subhead" style="margin-top:6px;">${utils.escape(item.unit)} · mínimo ${utils.escape(String(item.min))}</div>
                  </div>
                  <div class="status-pill ${meta.tone}">${icon(meta.icon)} ${utils.escape(meta.label)}</div>
                </div>
                <div style="margin-top:16px;">
                  <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${utils.progressColor(item)}"></div></div>
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:10px;">
                    <div class="row-subtitle">Cobertura sobre mínimo</div>
                    <div class="row-subtitle"><strong>${pct}%</strong></div>
                  </div>
                </div>
                ${item.alert ? `<div class="supporting-row" style="margin-top:14px;"><div class="supporting-icon" style="background:var(--warning-container);color:var(--warning)">${icon("bolt")}</div><div><div class="row-title">Observación</div><div class="row-subtitle">${utils.escape(item.alert)}</div></div></div>` : ""}
              </section>

              <section class="section projection-card" style="border-color:color-mix(in srgb, ${projection.color} 18%, white 82%);">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
                  <div class="supporting-icon" style="background:color-mix(in srgb, ${projection.color} 18%, white 82%);color:${projection.color}">${icon(projection.icon)}</div>
                  <div>
                    <div class="row-title" style="color:${projection.color}">${utils.escape(projection.title)}</div>
                    <div class="row-subtitle">${utils.escape(projection.subtitle)}</div>
                  </div>
                </div>
                <div class="projection-grid">
                  ${renderMiniStat(projection.daysLeft, "Días")}
                  ${renderMiniStat(projection.dailyUse, "Uso diario")}
                  ${renderMiniStat(projection.dateOut, "Fecha estimada")}
                </div>
                <div class="timeline">
                  <div class="timeline-meta"><span>Hoy</span><span>${utils.escape(projection.dateOut)}</span></div>
                  <div class="timeline-track"><div class="timeline-fill" style="width:${Math.min(100, Math.max(4, Math.round((projection.daysLeft / 90) * 100)))}%;background:${projection.color}"></div></div>
                </div>
              </section>

              <section class="section">
                <div class="section-title-row"><div class="section-title">Acciones rápidas</div></div>
                <div class="action-grid">
                  ${renderActionTile("Registrar ingreso", "south", "var(--success)", "in", item.id)}
                  ${renderActionTile("Registrar salida", "north", "var(--error)", "out", item.id)}
                  ${renderActionTile("Ajustar stock", "tune", "var(--primary)", "set", item.id)}
                </div>
              </section>

              <section class="section">
                <div class="section-title-row">
                  <div class="section-title">Historial del producto</div>
                  <div class="section-meta">${history.length} registros</div>
                </div>
                ${history.length ? `<div class="list">${history.map(renderHistoryCard).join("")}</div>` : renderEmpty("inbox", "Sin movimientos aún", "Este producto todavía no tiene registros en el historial.")}
              </section>
            </main>
            ${renderBottomNav()}
          </div>
        `;
      }

      function render() {
        if (!state.session.user) {
          renderLogin();
          renderSheet();
          renderToast();
          attachGlobalEvents();
          return;
        }

        const item = selectors.itemById(state.navigation.itemId);
        if (item) {
          renderItemDetail(item);
        } else if (state.navigation.category && !state.navigation.subcategory) {
          renderCategoryView();
        } else if (state.navigation.category && state.navigation.subcategory) {
          renderSubcategoryView();
        } else {
          renderMainShell();
        }

        renderSheet();
        renderToast();
        attachGlobalEvents();
      }

      function attachGlobalEvents() {
        appEl.querySelectorAll("[data-tab]").forEach((btn) => {
          btn.onclick = () => changeTab(btn.dataset.tab);
        });

        appEl.querySelectorAll("[data-item-id]").forEach((btn) => {
          btn.onclick = () => openItem(btn.dataset.itemId);
        });

        appEl.querySelectorAll("[data-category]").forEach((btn) => {
          btn.onclick = () => openCategory(btn.dataset.category);
        });

        appEl.querySelectorAll("[data-subcategory]").forEach((btn) => {
          btn.onclick = () => openSubcategory(btn.dataset.subcategory);
        });

        appEl.querySelectorAll("[data-search-status]").forEach((btn) => {
          btn.onclick = () => {
            state.ui.searchStatus = btn.dataset.searchStatus;
            render();
          };
        });

        appEl.querySelectorAll("[data-sheet-mode][data-sheet-item]").forEach((btn) => {
          btn.onclick = () => openSheet(btn.dataset.sheetMode, btn.dataset.sheetItem);
        });

        appEl.querySelectorAll("[data-action]").forEach((btn) => {
          btn.onclick = () => dispatchAction(btn.dataset.action);
        });

        scrimEl.onclick = () => closeSheet();
        sheetEl.querySelectorAll("[data-action='close-sheet']").forEach((btn) => {
          btn.onclick = () => closeSheet();
        });
      }

      function dispatchAction(action) {
        switch (action) {
          case "sync":
            syncAll();
            break;
          case "logout":
            logout();
            break;
          case "go-home":
            navigateHome();
            break;
          case "back":
            goBack();
            break;
          case "generate-report":
            exportPrintableReport();
            break;
          case "open-sheet-url":
            window.open(CONFIG.sheetUrl, "_blank");
            break;
          case "clear-search":
            state.ui.query = "";
            render();
            break;
          case "close-sheet":
            closeSheet();
            break;
          default:
            break;
        }
      }

      function attachSwipeBack() {
        let startX = 0;
        let startY = 0;
        document.addEventListener("touchstart", (event) => {
          if (!event.touches[0]) return;
          startX = event.touches[0].clientX;
          startY = event.touches[0].clientY;
        }, { passive: true });
        document.addEventListener("touchend", (event) => {
          if (!event.changedTouches[0]) return;
          const dx = event.changedTouches[0].clientX - startX;
          const dy = Math.abs(event.changedTouches[0].clientY - startY);
          if (dx > 82 && dy < 80) goBack();
        }, { passive: true });
      }

      addTest("status zero", () => {
        assert(utils.status({ stock: 0, min: 10 }) === "zero", "Debe detectar agotado");
      });

      addTest("status crit", () => {
        assert(utils.status({ stock: 2, min: 10 }) === "crit", "Debe detectar crítico");
      });

      addTest("status low", () => {
        assert(utils.status({ stock: 7, min: 10 }) === "low", "Debe detectar bajo mínimo");
      });

      addTest("status ok", () => {
        assert(utils.status({ stock: 14, min: 10 }) === "ok", "Debe detectar stock OK");
      });

      addTest("search finds item by name", () => {
        state.ui.query = "espresso original";
        state.ui.searchStatus = "all";
        assert(selectors.searchResults().length >= 1, "Debe encontrar Espresso Original");
        state.ui.query = "";
      });

      addTest("bottom nav html has joined tabs", () => {
        const html = renderBottomNav();
        assert(!html.includes("tabs.map((tab) =>"), "No debe renderizar código fuente en pantalla");
      });

      hydrate();
      attachSwipeBack();
      runTests();
      render();
      if (state.session.user) syncAll();
    })();
  </script>
</body>
</html>
