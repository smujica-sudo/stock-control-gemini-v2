<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawas Coffee - Control de Stock</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons (Versión Fija y Segura) -->
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            margin: 0;
            overflow-x: hidden;
            color: #202124;
            -webkit-tap-highlight-color: transparent;
        }

        /* 🚀 Optimizaciones de Renderizado GPU */
        .gpu-accelerated {
            transform: translateZ(0);
            will-change: transform, opacity;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animaciones Interfaz Suave */
        .nav-card:active { transform: scale(0.96); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        .action-button:active { transform: scale(0.88); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .glass-red { background: rgba(220, 38, 38, 0.95); backdrop-filter: blur(12px); }

        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translate3d(0, 15px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }

        /* ESTILOS DE IMPRESIÓN (Para los reportes PDF) */
        @media print {
            @page { margin: 10mm; size: auto; }
            body { background-color: white !important; }
            .no-print, aside, header, nav, .action-button { display: none !important; }
            main { margin: 0 !important; padding: 0 !important; }
            .report-container { box-shadow: none !important; border: none !important; border-radius: 0 !important; padding: 0 !important; }
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
            
            .print-badge-red { background-color: #fce8e6 !important; color: #d93025 !important; border: 1px solid #d93025; }
            .print-badge-amber { background-color: #fef7e0 !important; color: #e37400 !important; border: 1px solid #e37400; }
            .print-badge-green { background-color: #e6f4ea !important; color: #1e8e3e !important; }
            .print-table th { background-color: #f1f3f4 !important; color: #202124 !important; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#1a73e8;font-family:sans-serif;">
            <div style="width:40px;height:40px;border:4px solid #E8F0FE;border-top:4px solid #1a73e8;border-radius:50%;animation:spin 1s linear infinite;"></div>
            <p style="margin-top:20px;font-weight:700;font-size:1.1rem;">Sincronizando con Kawas...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useDeferredValue, memo } = React;

        // 1. Componente Icono Robusto (Garantiza que nunca falle si la CDN tarda un milisegundo extra)
        const Icon = memo(({ name, size = 24, className = "", spin = false }) => {
            const LucideIcon = window.lucideReact?.[name];
            if (!LucideIcon) {
                return <span className={`inline-block bg-gray-200 rounded-full animate-pulse ${className}`} style={{ width: size, height: size }} />;
            }
            return <LucideIcon size={size} className={`${className} ${spin ? 'animate-spin-custom' : ''} gpu-accelerated`} />;
        });

        // URL Integrada
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbye0BCOskWfd-jep9i605zmPGM0VLS3XYphKeHiYkKOSAWK8Jzwx0U7LnCLeVqJgjqohg/exec";

        // 2. Componente Memoizado de Tarjeta de Inventario (Ultra velocidad al filtrar)
        const InventoryItemCard = memo(({ item, onSelect, onAction, daysLeft, delayIdx }) => {
            const stock = parseFloat(item.stock) || 0;
            const isOutOfStock = stock <= 0;
            const isCritical = stock <= parseFloat(item.minimo) && stock > 0;
            
            return (
                <div onClick={() => onSelect(item)} className={`gpu-accelerated fade-in-up bg-white p-5 md:p-6 rounded-[32px] md:rounded-[40px] border flex flex-col md:flex-row md:items-center justify-between gap-4 transition-all cursor-pointer hover:shadow-xl group nav-card ${isOutOfStock ? 'border-red-300 bg-red-50/10' : isCritical ? 'border-amber-300' : 'border-[#E0E0E0]'}`} style={{ animationDelay: `${delayIdx * 40}ms` }}>
                    <div className="flex items-center gap-5">
                        <div className={`shrink-0 w-14 h-14 md:w-16 md:h-16 rounded-2xl flex items-center justify-center transition-transform group-hover:scale-105 ${isOutOfStock ? 'bg-red-600 text-white shadow-lg shadow-red-200' : isCritical ? 'bg-amber-100 text-amber-600' : 'bg-green-50 text-green-600'}`}>
                            <Icon name="Package" size={28} />
                        </div>
                        <div>
                            <p className="text-[10px] font-black text-[#5F6368] uppercase tracking-widest mb-0.5 line-clamp-1">{item.subcategoria || 'General'}</p>
                            <h4 className={`text-lg md:text-xl font-bold tracking-tight line-clamp-1 ${isOutOfStock ? 'text-red-700' : 'text-[#202124]'}`}>{item.nombre}</h4>
                            <p className="text-[11px] text-[#1a73e8] font-bold mt-0.5">Ver ficha detallada &rarr;</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-6 px-2 border-t md:border-t-0 pt-4 md:pt-0 border-[#F1F3F4] justify-between md:justify-end w-full md:w-auto">
                        <div className="text-left md:text-center">
                            <p className="text-[9px] font-black text-[#5F6368] uppercase tracking-widest mb-1">Stock</p>
                            <p className={`text-2xl md:text-3xl font-black tracking-tighter ${isOutOfStock ? 'text-red-600 animate-pulse' : isCritical ? 'text-amber-600' : 'text-[#202124]'}`}>{stock.toLocaleString()}</p>
                        </div>
                        <div className="text-right md:text-center">
                            <p className="text-[9px] font-black text-[#5F6368] uppercase tracking-widest mb-1">Alcance</p>
                            <p className="text-xl md:text-2xl font-black text-[#1a73e8]">{daysLeft}</p>
                        </div>
                        <div className="hidden lg:flex gap-2 ml-4">
                            <button onClick={(e) => { e.stopPropagation(); onAction(item, 'IN'); }} className="action-button p-4 bg-blue-50 text-blue-600 rounded-2xl hover:bg-blue-600 hover:text-white transition-colors"><Icon name="Plus" size={24} /></button>
                            <button disabled={isOutOfStock} onClick={(e) => { e.stopPropagation(); onAction(item, 'OUT'); }} className={`action-button p-4 rounded-2xl transition-colors ${isOutOfStock ? 'bg-gray-100 text-gray-300 cursor-not-allowed' : 'bg-red-50 text-red-600 hover:bg-red-600 hover:text-white'}`}><Icon name="Minus" size={24} /></button>
                        </div>
                    </div>
                </div>
            );
        });

        // 3. APLICACIÓN PRINCIPAL
        const App = () => {
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(null);
            const [pin, setPin] = useState('');
            const [data, setData] = useState({ materiales: [], movimientos: [], usuarios: [] });
            
            const [searchTerm, setSearchTerm] = useState('');
            const deferredSearchTerm = useDeferredValue(searchTerm);

            const [isSyncing, setIsSyncing] = useState(false);
            const [isSaving, setIsSaving] = useState(false); 
            const [modalType, setModalType] = useState(null); 
            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [navPath, setNavPath] = useState({ category: null, subcategory: null, itemId: null });

            const triggerHaptic = useCallback(() => { if ('vibrate' in navigator) navigator.vibrate([15, 30, 15]); }, []);

            const fetchData = useCallback(async () => {
                if (!SCRIPT_URL) return;
                setIsSyncing(true);
                try {
                    const response = await fetch(SCRIPT_URL, { redirect: "follow" });
                    const json = JSON.parse(await response.text());
                    if (json && json.materiales) setData(json);
                } catch (e) { console.error("Error sync:", e); } 
                finally { setIsSyncing(false); }
            }, []);

            useEffect(() => { fetchData(); }, [fetchData]);

            const attemptLogin = useCallback((currentPin) => {
                if (data.materiales.length === 0) return; 
                const validUser = (data.usuarios || []).find(u => u.pin == currentPin) || (currentPin === "1234" ? { nombre: "Admin Kawas", rol: "Administrador" } : null);
                if (validUser) { setUser(validUser); setView('dashboard'); triggerHaptic(); } 
                else if (currentPin.length === 4) { setPin(''); alert("PIN incorrecto."); triggerHaptic(); }
            }, [data, triggerHaptic]);

            const handlePinChange = (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                setPin(val);
                if (val.length === 4) setTimeout(() => attemptLogin(val), 100);
            };

            const handleTransaction = async (e) => {
                e.preventDefault();
                const qty = parseFloat(e.target.cantidad.value);
                const nota = e.target.nota.value;
                const matId = selectedMaterial.id;

                setModalType(null); triggerHaptic(); setIsSaving(true); 

                let nuevoStock = parseFloat(selectedMaterial.stock) || 0;
                if (modalType === 'IN') nuevoStock += qty;
                if (modalType === 'OUT') nuevoStock -= qty;
                if (modalType === 'ADJUST') nuevoStock = qty;

                setData(prev => {
                    return { 
                        ...prev, 
                        materiales: prev.materiales.map(m => m.id === matId ? { ...m, stock: nuevoStock } : m),
                        movimientos: [...prev.movimientos, {
                            timestamp: new Date().toISOString(), usuario: user.nombre, tipo: modalType,
                            item_id: matId, item_nombre: selectedMaterial.nombre, cantidad: qty,
                            stock_nuevo: nuevoStock, diferencia: modalType === 'IN' ? qty : modalType === 'OUT' ? -qty : (nuevoStock - (parseFloat(selectedMaterial.stock) || 0))
                        }]
                    };
                });

                try {
                    await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'movimiento', usuario: user.nombre, tipo: modalType, materialId: matId, cantidad: qty, nota: nota }) });
                } catch (err) { console.error("Error guardando:", err); } 
                finally { setIsSaving(false); }
            };

            const stats = useMemo(() => {
                const materiales = data.materiales || [];
                const movimientos = data.movimientos || [];
                
                const getDaysLeft = (materialId, currentStock) => {
                    const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                    const recentOuts = movimientos.filter(mov => mov.item_id == materialId && mov.tipo === 'OUT' && new Date(mov.timestamp) >= sevenDaysAgo);
                    const totalConsumed = recentOuts.reduce((acc, curr) => acc + Math.abs(parseFloat(curr.cantidad || 0)), 0);
                    return totalConsumed <= 0 ? '---' : Math.round(parseFloat(currentStock) / (totalConsumed / 7));
                };

                const outOfStockList = materiales.filter(m => (parseFloat(m.stock) || 0) <= 0);
                const criticalList = materiales.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0);

                const groupedInventory = {};
                materiales.forEach(m => {
                    const cat = m.categoria || 'Sin Categoría'; const subcat = m.subcategoria || 'General';
                    if(!groupedInventory[cat]) groupedInventory[cat] = {};
                    if(!groupedInventory[cat][subcat]) groupedInventory[cat][subcat] = [];
                    groupedInventory[cat][subcat].push(m);
                });

                return { totalItems: materiales.length, criticalItems: criticalList.length, criticalList, outOfStock: outOfStockList.length, outOfStockList, getDaysLeft, groupedInventory };
            }, [data]);

            const navigationData = useMemo(() => {
                const materiales = data.materiales || [];
                if (deferredSearchTerm) return { level: 'search', items: materiales.filter(m => (m.nombre || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()) || (m.categoria || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()))};
                
                if (!navPath.category) return { level: 'categories', items: [...new Set(materiales.map(m => m.categoria).filter(Boolean))].map(name => ({ name, count: materiales.filter(m => m.categoria === name).length, out: materiales.filter(m => m.categoria === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.subcategory) return { level: 'subcategories', items: [...new Set(materiales.filter(m => m.categoria === navPath.category).map(m => m.subcategoria || 'General'))].map(name => ({ name, count: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name).length, out: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.itemId) return { level: 'items', items: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === navPath.subcategory) };
                
                return { level: 'detail', item: materiales.find(m => m.id == navPath.itemId), movements: (data.movimientos || []).filter(mov => mov.item_id == navPath.itemId) };
            }, [data.materiales, navPath, deferredSearchTerm]);

            const resetNav = useCallback(() => setNavPath({ category: null, subcategory: null, itemId: null }), []);
            const openActionModal = useCallback((item, type) => { setSelectedMaterial(item); setModalType(type); triggerHaptic(); }, [triggerHaptic]);

            // VISTA LOGIN
            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#F8F9FA]">
                        <div className="w-full max-w-sm bg-white rounded-[40px] p-10 shadow-xl border border-[#E0E0E0] text-center gpu-accelerated">
                            <div className="w-20 h-20 bg-[#1a73e8] rounded-3xl mx-auto mb-8 flex items-center justify-center text-white shadow-lg shadow-blue-200 rotate-3"><Icon name="PackageCheck" size={40} /></div>
                            <h1 className="text-3xl font-bold mb-2 tracking-tight text-[#202124]">Kawas Coffee</h1>
                            <p className="text-[#5F6368] text-sm mb-10 font-medium">Gestión Inteligente de Insumos</p>
                            
                            <form onSubmit={(e)=>e.preventDefault()} className="space-y-6">
                                <input type="password" inputMode="numeric" maxLength={4} placeholder="PIN" value={pin} onChange={handlePinChange} autoFocus className="w-full py-5 bg-[#F1F3F4] rounded-2xl text-center text-4xl tracking-[0.5em] font-black text-[#1a73e8] focus:ring-4 focus:ring-blue-100 outline-none border-2 border-transparent focus:border-blue-200 transition-all" />
                                <div className="h-4 flex items-center justify-center">
                                    {isSyncing && data.materiales.length === 0 && <span className="text-xs font-bold text-blue-600 flex items-center gap-2"><Icon name="RefreshCcw" size={14} spin /> Conectando Servidor...</span>}
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#F8F9FA] relative flex font-sans">
                    
                    {/* SIDEBAR (Solo Desktop - w-64) */}
                    <aside className={`no-print hidden lg:flex fixed inset-y-0 left-0 z-50 flex-col bg-white border-r border-[#E0E0E0] w-64`}>
                        <div className="p-8 flex items-center gap-4 h-24 shrink-0">
                            <div className="w-10 h-10 bg-[#1a73e8] rounded-xl flex items-center justify-center text-white shrink-0 shadow-lg shadow-blue-100"><Icon name="PackageCheck" size={24} /></div>
                            <span className="font-bold text-xl tracking-tight text-[#1a73e8]">Kawas Stock</span>
                        </div>
                        <nav className="flex-1 px-4 space-y-2 pt-2">
                            {[
                                { id: 'dashboard', label: 'Inicio', icon: 'LayoutDashboard' },
                                { id: 'inventory', label: 'Bodega', icon: 'Package' },
                                { id: 'history', label: 'Bitácora', icon: 'History' },
                                { id: 'reports', label: 'Reportes', icon: 'BarChart3' },
                            ].map(item => (
                                <button key={item.id} onClick={() => { setView(item.id); resetNav(); setSearchTerm(''); triggerHaptic(); }} className={`w-full flex items-center h-14 rounded-2xl transition-all relative group ${view === item.id ? 'bg-[#E8F0FE] text-[#1a73e8]' : 'text-[#5F6368] hover:bg-[#F1F3F4]'}`}>
                                    <div className="w-14 shrink-0 flex items-center justify-center"><Icon name={item.icon} size={22} /></div>
                                    <span className="text-sm font-bold absolute left-14 whitespace-nowrap">{item.label}</span>
                                </button>
                            ))}
                        </nav>
                        <div className="p-6 border-t border-[#F1F3F4] shrink-0">
                            <div className="flex items-center gap-3 p-3 bg-[#F8F9FA] rounded-2xl">
                                <div className="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-sm shrink-0 uppercase">{user?.nombre?.charAt(0)}</div>
                                <div className="overflow-hidden whitespace-nowrap w-full"><p className="text-xs font-bold text-[#202124]">{user?.nombre}</p><p className="text-[10px] text-[#5F6368] font-bold uppercase tracking-wider">{user?.rol}</p></div>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT (Margen ajustado solo para desktop) */}
                    <main className="flex-1 min-h-screen pb-28 lg:pb-10 lg:ml-64 w-full">
                        
                        {/* Header Superior Móvil & Desktop */}
                        <header className="no-print h-20 flex items-center justify-between px-6 md:px-10 sticky top-0 glass-panel z-20 border-b border-[#E0E0E0]/50">
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold text-[#202124] tracking-tight">
                                    {view === 'dashboard' ? 'Panel de Control' : view === 'inventory' ? 'Bodega Kawas' : view === 'history' ? 'Bitácora Global' : 'Auditoría & Reportes'}
                                </h1>
                            </div>
                            <div className="flex items-center gap-3">
                                {isSaving && <span className="bg-blue-100 text-blue-700 px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2 fade-in-up"><Icon name="CloudUpload" size={16} spin /> Guardando</span>}
                                {isSyncing && !isSaving && <span className="bg-[#F1F3F4] text-[#5F6368] px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2"><Icon name="RefreshCcw" size={16} spin /> Sync</span>}
                            </div>
                        </header>

                        <div className="px-5 md:px-10 max-w-[1600px] mx-auto mt-6">
                            
                            {/* DASHBOARD */}
                            {view === 'dashboard' && (
                                <div className="space-y-8 fade-in-up">
                                    <div className="flex justify-between items-end">
                                        <div><h2 className="text-3xl font-bold tracking-tight text-[#202124]">Resumen</h2><p className="text-[#5F6368] font-medium mt-1">Estado general de insumos.</p></div>
                                        <button onClick={() => { fetchData(); triggerHaptic(); }} className="action-button flex items-center gap-2 px-5 py-3 bg-white border border-[#E0E0E0] rounded-2xl shadow-sm text-[#202124] font-bold text-sm hover:shadow-md transition-all"><Icon name="RefreshCcw" size={20} className={isSyncing ? 'animate-spin-custom' : ''} /><span className="hidden md:inline">Actualizar</span></button>
                                    </div>

                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                                        {[
                                            { label: 'Ítems Totales', val: stats.totalItems, icon: 'Package', color: 'text-blue-600', bg: 'bg-blue-50' },
                                            { label: 'Stock Crítico', val: stats.criticalItems, icon: 'AlertTriangle', color: 'text-amber-600', bg: 'bg-amber-50' },
                                            { label: 'Agotados', val: stats.outOfStock, icon: 'TrendingDown', color: 'text-red-600', bg: 'bg-red-50' },
                                            { label: 'Salud Bodega', val: `${Math.round(((stats.totalItems - stats.outOfStock) / stats.totalItems) * 100 || 0)}%`, icon: 'CheckCircle2', color: 'text-green-600', bg: 'bg-green-50' },
                                        ].map((kpi, i) => (
                                            <div key={i} className="bg-white p-6 md:p-8 rounded-[32px] md:rounded-[40px] border border-[#E0E0E0] shadow-sm gpu-accelerated fade-in-up" style={{ animationDelay: `${i * 50}ms` }}><div className={`w-14 h-14 ${kpi.bg} ${kpi.color} rounded-2xl flex items-center justify-center mb-4 md:mb-5`}><Icon name={kpi.icon} size={28} /></div><p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest">{kpi.label}</p><p className="text-3xl md:text-4xl font-black mt-2 text-[#202124] tracking-tighter">{kpi.val}</p></div>
                                        ))}
                                    </div>

                                    {stats.outOfStock > 0 && (
                                        <div className="glass-red text-white p-8 md:p-10 rounded-[40px] shadow-xl shadow-red-200/50 fade-in-up" style={{ animationDelay: '200ms' }}>
                                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                                                <div className="flex items-start gap-5">
                                                    <div className="bg-white/20 p-4 rounded-[24px] shrink-0 animate-pulse"><Icon name="XCircle" size={40} /></div>
                                                    <div><h4 className="text-2xl md:text-3xl font-bold uppercase tracking-tight">Acción Crítica</h4><p className="text-red-100 text-sm mb-4">Materiales totalmente agotados (Stock 0):</p>
                                                        <div className="flex flex-wrap gap-2">{stats.outOfStockList.map(item => (<button key={item.id} onClick={() => { setView('inventory'); setNavPath({category: item.categoria, subcategory: item.subcategoria || 'General', itemId: item.id}); }} className="bg-white/10 border border-white/20 px-4 py-2 rounded-xl text-xs font-bold hover:bg-white/20 transition-colors">{item.nombre}</button>))}</div>
                                                    </div>
                                                </div>
                                                <button onClick={() => { setView('inventory'); resetNav(); }} className="action-button bg-white text-red-600 px-8 py-4 rounded-full font-black text-sm shadow-lg shrink-0">Resolver Ahora</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* INVENTARIO Y NAVEGACIÓN */}
                            {view === 'inventory' && (
                                <div className="space-y-6 pb-6">
                                    <div className="sticky top-20 z-10 glass-panel pb-6 pt-4 -mx-5 px-5 md:-mx-10 md:px-10 border-b border-[#E0E0E0]/50">
                                        <div className="relative mb-4">
                                            <Icon name="Search" className="absolute left-6 top-1/2 -translate-y-1/2 text-[#5F6368]" size={24} />

                            { id: 'reports', icon: 'BarChart3', label: 'Reportes' },
                        ].map(item => (
                            <button key={item.id} onClick={() => { setView(item.id); resetNav(); setSearchTerm(''); triggerHaptic(); }} className={`flex flex-col items-center gap-1.5 p-2 transition-transform active:scale-90 ${view === item.id ? 'text-[#1a73e8]' : 'text-[#BDC1C6]'}`}>
                                <div className={`p-3 px-6 rounded-[20px] transition-colors ${view === item.id ? 'bg-[#E8F0FE]' : ''}`}><Icon name={item.icon} size={24} /></div>
                                <span className="text-[10px] font-black uppercase tracking-widest">{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* MODAL TRANSACCIONES (Lucide Original) */}
                    {modalType && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-[#202124]/40 backdrop-blur-md fade-in-up" style={{animationDuration: '0.2s'}} onClick={() => setModalType(null)}></div>
                            <div className="bg-white w-full max-w-sm rounded-[40px] shadow-2xl z-10 overflow-hidden fade-in-up gpu-accelerated" style={{animationDuration: '0.3s'}}>
                                <div className={`p-8 text-white ${modalType === 'IN' ? 'bg-green-600' : modalType === 'OUT' ? 'bg-red-600' : 'bg-gray-800'}`}>
                                    <div className="flex justify-between items-start">
                                        <div><p className="text-[10px] font-black uppercase tracking-widest opacity-80 mb-1">Registrar {modalType}</p><h3 className="text-2xl font-bold leading-tight">{selectedMaterial?.nombre}</h3></div>
                                        <div className="p-3 bg-white/20 rounded-2xl"><Icon name={modalType === 'IN' ? 'ArrowUpCircle' : modalType === 'OUT' ? 'ArrowDownCircle' : 'SlidersHorizontal'} size={32} /></div>
                                    </div>
                                </div>
                                <form className="p-8 space-y-6" onSubmit={handleTransaction}>
                                    <div className="space-y-2"><label className="text-xs font-bold text-[#5F6368] uppercase ml-1">Cantidad ({selectedMaterial?.unidad})</label><input required name="cantidad" type="number" step="0.01" className="w-full px-6 py-5 bg-[#F1F3F4] rounded-3xl outline-none text-2xl font-black text-[#202124] focus:ring-4 focus:ring-blue-100 transition-all" placeholder="0" autoFocus /></div>
                                    <div className="space-y-2"><label className="text-xs font-bold text-[#5F6368] uppercase ml-1">Comentario</label><input name="nota" className="w-full px-6 py-4 bg-[#F1F3F4] rounded-2xl outline-none text-sm font-medium text-[#202124] focus:ring-4 focus:ring-blue-100 transition-all" placeholder="Ej: Nueva recepción" /></div>
                                    <div className="flex gap-4 pt-4"><button type="button" onClick={() => setModalType(null)} className="action-button flex-1 py-4 font-bold text-[#5F6368] bg-[#F8F9FA] hover:bg-[#E0E0E0] rounded-2xl transition-colors">Cancelar</button><button className="action-button flex-[2] py-4 bg-[#1a73e8] text-white rounded-3xl font-bold shadow-xl shadow-blue-100 flex items-center justify-center gap-2 hover:bg-[#1557b0] transition-colors">Confirmar</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
