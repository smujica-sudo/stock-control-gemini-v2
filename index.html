<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawas Coffee - Control de Stock</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            margin: 0;
            overflow-x: hidden;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #1a73e8;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #E8F0FE;
            border-top: 5px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .shadow-google {
            box-shadow: 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
        }
        
        .nav-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loader-container">
            <div class="spinner"></div>
            <p style="margin-top: 24px; font-weight: 700; font-size: 1.1rem; color: #1a73e8;">Sincronizando con Kawas...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        
        // Acceso global a iconos Lucide
        const LucideIcons = window.LucideReact || {};
        const { 
            LayoutDashboard, Search, History, FileText, ChevronRight, 
            ArrowUpCircle, ArrowDownCircle, SlidersHorizontal, RefreshCcw, 
            Package, AlertTriangle, CheckCircle2, User, Lock, Plus, 
            Download, ExternalLink, Loader2, PackageCheck, TrendingDown, 
            Clock, Info, Filter, Home, AlertCircle, XCircle, ChevronLeft, Boxes
        } = LucideIcons;

        const Icon = ({ name: IconComponent, ...props }) => {
            if (!IconComponent) return <span>📦</span>;
            return <IconComponent {...props} />;
        };

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBj6qSh5Pq0C-NZA2CQ54KRwwVdDhBwFQLTObYterxQJ0DY67Jcdc-VzfnRiYwICGiBw/exec";

        const App = () => {
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(null);
            const [pin, setPin] = useState('');
            const [data, setData] = useState({ materiales: [], movimientos: [], usuarios: [] });
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [isSyncing, setIsSyncing] = useState(false);
            const [modalType, setModalType] = useState(null); 
            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [isLoading, setIsLoading] = useState(false);

            // Estados de navegación jerárquica
            const [navPath, setNavPath] = useState({ category: null, subcategory: null });

            const fetchData = async () => {
                if (!SCRIPT_URL) return;
                setIsSyncing(true);
                try {
                    const response = await fetch(SCRIPT_URL);
                    const json = await response.json();
                    if (json && json.materiales) {
                        setData(json);
                        setError(null);
                    }
                } catch (e) {
                    console.error("Error sync:", e);
                    setError("Error de conexión");
                } finally {
                    setIsSyncing(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                const validUser = (data.usuarios || []).find(u => u.pin == pin) || 
                                 (pin === "1234" ? { nombre: "Admin Kawas", rol: "Administrador" } : null);
                if (validUser) {
                    setUser(validUser);
                    setView('dashboard');
                } else {
                    setPin('');
                    alert("PIN incorrecto");
                }
            };

            const stats = useMemo(() => {
                const materiales = data.materiales || [];
                const movimientos = data.movimientos || [];
                
                const getDaysLeft = (materialId, currentStock) => {
                    const sevenDaysAgo = new Date();
                    sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                    const recentOuts = movimientos.filter(mov => 
                        mov.item_id == materialId && mov.tipo === 'OUT' && new Date(mov.timestamp) >= sevenDaysAgo
                    );
                    const totalConsumed = recentOuts.reduce((acc, curr) => acc + Math.abs(parseFloat(curr.cantidad || 0)), 0);
                    const avgDaily = totalConsumed / 7;
                    return avgDaily <= 0 ? '---' : Math.round(parseFloat(currentStock) / avgDaily);
                };

                const outOfStockList = materiales.filter(m => (parseFloat(m.stock) || 0) <= 0);
                const criticalItemsCount = materiales.filter(m => {
                    const s = parseFloat(m.stock) || 0;
                    const mn = parseFloat(m.minimo) || 0;
                    return s <= mn && s > 0;
                }).length;

                return { 
                    totalItems: materiales.length, 
                    criticalItems: criticalItemsCount, 
                    outOfStock: outOfStockList.length, 
                    outOfStockList, 
                    getDaysLeft 
                };
            }, [data]);

            // Lógica de filtrado jerárquico
            const navigationData = useMemo(() => {
                const materiales = data.materiales || [];
                
                // Si hay búsqueda, ignorar jerarquía y mostrar todo lo que coincida
                if (searchTerm) {
                    return { level: 'search', items: materiales.filter(m => 
                        (m.nombre || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (m.categoria || "").toLowerCase().includes(searchTerm.toLowerCase())
                    )};
                }

                if (!navPath.category) {
                    // Nivel 1: Categorías
                    const cats = [...new Set(materiales.map(m => m.categoria).filter(Boolean))];
                    const items = cats.map(name => {
                        const count = materiales.filter(m => m.categoria === name).length;
                        const out = materiales.filter(m => m.categoria === name && (parseFloat(m.stock) || 0) <= 0).length;
                        return { name, count, out, type: 'category' };
                    });
                    return { level: 'categories', items };
                }

                if (!navPath.subcategory) {
                    // Nivel 2: Subcategorías
                    const subcats = [...new Set(materiales
                        .filter(m => m.categoria === navPath.category)
                        .map(m => m.subcategoria || 'General')
                    )];
                    const items = subcats.map(name => {
                        const count = materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name).length;
                        const out = materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name && (parseFloat(m.stock) || 0) <= 0).length;
                        return { name, count, out, type: 'subcategory' };
                    });
                    return { level: 'subcategories', items };
                }

                // Nivel 3: Ítems finales
                const items = materiales.filter(m => 
                    m.categoria === navPath.category && 
                    (m.subcategoria || 'General') === navPath.subcategory
                );
                return { level: 'items', items };

            }, [data.materiales, navPath, searchTerm]);

            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#F8F9FA]">
                        <div className="w-full max-w-sm bg-white rounded-[40px] p-10 shadow-xl border border-[#E0E0E0] text-center">
                            <div className="w-20 h-20 bg-[#1a73e8] rounded-3xl mx-auto mb-8 flex items-center justify-center text-white shadow-lg rotate-3">
                                <Icon name={PackageCheck} size={40} />
                            </div>
                            <h1 className="text-2xl font-bold mb-2">Kawas Coffee</h1>
                            <p className="text-[#5F6368] text-sm mb-10">Bodega e Inventario</p>
                            <form onSubmit={handleLogin} className="space-y-6">
                                <input 
                                    type="password" 
                                    maxLength={4}
                                    placeholder="PIN"
                                    value={pin}
                                    onChange={e => setPin(e.target.value)}
                                    className="w-full py-5 bg-[#F1F3F4] rounded-2xl text-center text-3xl tracking-[1em] focus:ring-4 focus:ring-blue-100 outline-none border-2 border-transparent focus:border-blue-200"
                                />
                                <button disabled={isSyncing} className="w-full bg-[#1a73e8] text-white py-5 rounded-full font-bold shadow-xl shadow-blue-100 hover:bg-[#1557b0] transition-all active:scale-95 disabled:opacity-50">
                                    {isSyncing ? "Entrando..." : "Ingresar"}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col lg:flex-row min-h-screen pb-24 lg:pb-0 bg-[#F8F9FA]">
                    {/* Sidebar Desktop */}
                    <aside className="hidden lg:flex flex-col w-64 bg-white border-r border-[#E0E0E0] fixed h-full z-20">
                        <div className="p-8">
                            <div className="flex items-center gap-3 text-[#1a73e8]">
                                <Icon name={PackageCheck} size={32} />
                                <span className="font-bold text-xl tracking-tight">Kawas Stock</span>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-2">
                            {[
                                { id: 'dashboard', label: 'Inicio', icon: Home },
                                { id: 'inventory', label: 'Bodega', icon: Boxes },
                                { id: 'history', label: 'Historial', icon: History },
                                { id: 'reports', label: 'Reportes', icon: FileText },
                            ].map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => { setView(item.id); setNavPath({category:null, subcategory:null}); setSearchTerm(''); }}
                                    className={`w-full flex items-center gap-4 px-4 py-3 rounded-2xl transition-all ${view === item.id ? 'bg-[#E8F0FE] text-[#1a73e8] font-bold' : 'text-[#5F6368] hover:bg-[#F1F3F4]'}`}
                                >
                                    <Icon name={item.icon} size={20} /> {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-6 border-t border-[#F1F3F4]">
                            <div className="flex items-center gap-3 p-3 bg-[#F8F9FA] rounded-2xl">
                                <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs uppercase">
                                    {user?.nombre?.charAt(0)}
                                </div>
                                <div className="overflow-hidden">
                                    <p className="text-xs font-bold truncate">{user?.nombre}</p>
                                    <p className="text-[10px] text-[#5F6368] uppercase">{user?.rol}</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 lg:ml-64 p-4 lg:p-10">
                        {view === 'dashboard' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-3xl font-bold tracking-tight">Panel de Control</h2>
                                        <p className="text-[#5F6368]">Estado general de suministros Kawas.</p>
                                    </div>
                                    <button 
                                        onClick={fetchData} 
                                        disabled={isSyncing}
                                        className="flex items-center gap-2 px-4 py-2 bg-white border border-[#E0E0E0] rounded-xl shadow-sm hover:shadow-md transition-all active:scale-95"
                                    >
                                        <Icon name={RefreshCcw} size={18} className={isSyncing ? 'animate-spin text-blue-600' : ''} />
                                        <span className="text-sm font-bold">Sincronizar</span>
                                    </button>
                                </div>

                                {stats.outOfStock > 0 && (
                                    <div className="bg-red-600 text-white p-6 rounded-[32px] shadow-xl shadow-red-100">
                                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                                            <div className="flex items-start gap-4">
                                                <div className="bg-white/20 p-3 rounded-2xl shrink-0">
                                                    <Icon name={XCircle} size={32} />
                                                </div>
                                                <div>
                                                    <h4 className="text-xl font-black uppercase tracking-tight">Acción Requerida</h4>
                                                    <p className="text-red-100 text-sm mb-3">Hay {stats.outOfStock} materiales agotados:</p>
                                                    <div className="flex flex-wrap gap-2">
                                                        {stats.outOfStockList.map(item => (
                                                            <span key={item.id} className="bg-white/10 border border-white/20 px-3 py-1 rounded-lg text-xs font-bold">
                                                                {item.nombre}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => { setView('inventory'); setNavPath({category:null, subcategory:null}); }}
                                                className="bg-white text-red-600 px-8 py-4 rounded-full font-black text-sm hover:bg-red-50 transition-all active:scale-95 shadow-lg shrink-0"
                                            >
                                                Ver en Bodega
                                            </button>
                                        </div>
                                    </div>
                                )}

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    {[
                                        { label: 'Ítems Totales', val: stats.totalItems, icon: Package, color: 'text-blue-600', bg: 'bg-blue-50' },
                                        { label: 'Stock Crítico', val: stats.criticalItems, icon: AlertTriangle, color: 'text-amber-600', bg: 'bg-amber-50' },
                                        { label: 'Agotados', val: stats.outOfStock, icon: TrendingDown, color: 'text-red-600', bg: 'bg-red-50' },
                                        { label: 'Disponibilidad', val: `${Math.round(((stats.totalItems - stats.outOfStock) / stats.totalItems) * 100 || 0)}%`, icon: CheckCircle2, color: 'text-green-600', bg: 'bg-green-50' },
                                    ].map((kpi, i) => (
                                        <div key={i} className="bg-white p-5 rounded-[28px] border border-[#E0E0E0] shadow-sm">
                                            <div className={`w-10 h-10 ${kpi.bg} ${kpi.color} rounded-xl flex items-center justify-center mb-3`}>
                                                <Icon name={kpi.icon} size={24} />
                                            </div>
                                            <p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest">{kpi.label}</p>
                                            <p className="text-2xl font-black mt-1">{kpi.val}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'inventory' && (
                            <div className="space-y-6 animate-in slide-in-from-bottom-4 duration-500">
                                {/* Buscador y Breadcrumbs */}
                                <div className="sticky top-0 z-10 bg-[#F8F9FA]/90 backdrop-blur-md pb-4 pt-2">
                                    <div className="relative mb-4">
                                        <Icon name={Search} className="absolute left-5 top-1/2 -translate-y-1/2 text-[#5F6368]" size={24} />
                                        <input 
                                            type="text" 
                                            placeholder="¿Qué buscas? (Búsqueda global instantánea)"
                                            value={searchTerm}
                                            onChange={e => setSearchTerm(e.target.value)}
                                            className="w-full pl-14 pr-6 py-5 bg-white border border-[#E0E0E0] rounded-[30px] shadow-sm focus:ring-4 focus:ring-blue-100 outline-none text-lg font-medium transition-all"
                                        />
                                    </div>

                                    {!searchTerm && (
                                        <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                                            <button 
                                                onClick={() => setNavPath({category:null, subcategory:null})}
                                                className={`px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-all ${!navPath.category ? 'bg-[#1a73e8] text-white' : 'bg-white border border-[#E0E0E0] text-[#5F6368]'}`}
                                            >
                                                Bodega
                                            </button>
                                            {navPath.category && (
                                                <>
                                                    <Icon name={ChevronRight} size={16} className="text-[#BDC1C6] shrink-0" />
                                                    <button 
                                                        onClick={() => setNavPath({...navPath, subcategory:null})}
                                                        className={`px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-all ${navPath.category && !navPath.subcategory ? 'bg-[#1a73e8] text-white' : 'bg-white border border-[#E0E0E0] text-[#5F6368]'}`}
                                                    >
                                                        {navPath.category}
                                                    </button>
                                                </>
                                            )}
                                            {navPath.subcategory && (
                                                <>
                                                    <Icon name={ChevronRight} size={16} className="text-[#BDC1C6] shrink-0" />
                                                    <button className="px-4 py-2 bg-[#1a73e8] text-white rounded-full text-sm font-bold whitespace-nowrap">
                                                        {navPath.subcategory}
                                                    </button>
                                                </>
                                            )}
                                        </div>
                                    )}
                                </div>

                                {/* Grid Navegable */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {/* Caso de Categorías o Subcategorías */}
                                    {(navigationData.level === 'categories' || navigationData.level === 'subcategories') && (
                                        navigationData.items.map((item, idx) => (
                                            <div 
                                                key={idx}
                                                onClick={() => {
                                                    if (navigationData.level === 'categories') setNavPath({...navPath, category: item.name});
                                                    else setNavPath({...navPath, subcategory: item.name});
                                                }}
                                                className="bg-white p-6 rounded-[32px] border border-[#E0E0E0] hover:border-[#1a73e8] hover:shadow-xl transition-all cursor-pointer group nav-card"
                                            >
                                                <div className="flex justify-between items-start mb-6">
                                                    <div className={`w-14 h-14 rounded-2xl flex items-center justify-center transition-colors ${item.out > 0 ? 'bg-red-50 text-red-600' : 'bg-[#F1F3F4] text-[#1a73e8] group-hover:bg-[#1a73e8] group-hover:text-white'}`}>
                                                        <Icon name={Package} size={28} />
                                                    </div>
                                                    {item.out > 0 && <span className="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] font-black animate-pulse">{item.out} AGOTADOS</span>}
                                                </div>
                                                <h4 className="text-xl font-bold mb-1 group-hover:text-[#1a73e8] transition-colors">{item.name}</h4>
                                                <p className="text-sm text-[#5F6368]">{item.count} materiales registrados</p>
                                                <div className="mt-6 flex items-center gap-1 text-[#1a73e8] font-bold text-xs">
                                                    Entrar <Icon name={ChevronRight} size={14} />
                                                </div>
                                            </div>
                                        ))
                                    )}

                                    {/* Caso de Ítems (Nivel final o búsqueda) */}
                                    {(navigationData.level === 'items' || navigationData.level === 'search') && (
                                        <div className="col-span-full grid grid-cols-1 gap-4">
                                            {navigationData.items.map(m => {
                                                const days = stats.getDaysLeft(m.id, m.stock);
                                                const isCritical = m.stock <= m.minimo && m.stock > 0;
                                                const isOutOfStock = (parseFloat(m.stock) || 0) <= 0;
                                                return (
                                                    <div key={m.id} className={`bg-white p-6 rounded-[32px] border flex flex-col md:flex-row md:items-center justify-between gap-6 transition-all ${isOutOfStock ? 'border-red-400 bg-red-50/10 shadow-lg' : isCritical ? 'border-amber-300' : 'border-[#E0E0E0]'}`}>
                                                        <div className="flex items-center gap-5">
                                                            <div className={`relative w-16 h-16 rounded-2xl flex items-center justify-center ${isOutOfStock ? 'bg-red-600 text-white' : isCritical ? 'bg-amber-100 text-amber-600' : 'bg-green-50 text-green-600'}`}>
                                                                <Icon name={Package} size={32} />
                                                            </div>
                                                            <div>
                                                                <p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest">{m.subcategoria || 'General'} {isOutOfStock && '• AGOTADO'}</p>
                                                                <h4 className={`text-xl font-bold ${isOutOfStock ? 'text-red-700' : 'text-[#202124]'}`}>{m.nombre}</h4>
                                                                <p className="text-xs text-[#5F6368] font-medium mt-1">Ref: {m.id} • Min: {m.minimo} {m.unidad}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-8 px-4 text-center">
                                                            <div>
                                                                <p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-tighter">Stock</p>
                                                                <p className={`text-2xl font-black ${isOutOfStock ? 'text-red-600 animate-pulse' : isCritical ? 'text-amber-600' : 'text-[#202124]'}`}>{parseFloat(m.stock).toLocaleString()}</p>
                                                            </div>
                                                            <div>
                                                                <p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-tighter">Alcance</p>
                                                                <p className="text-2xl font-black text-[#1a73e8]">{isOutOfStock ? '0' : days} <span className="text-[10px]">días</span></p>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => { setSelectedMaterial(m); setModalType('IN'); }} className="flex-1 md:flex-none p-4 bg-blue-50 text-blue-600 rounded-2xl hover:bg-blue-600 hover:text-white transition-all"><Icon name={Plus} size={24}/></button>
                                                            <button disabled={isOutOfStock} onClick={() => { setSelectedMaterial(m); setModalType('OUT'); }} className={`flex-1 md:flex-none p-4 rounded-2xl transition-all ${isOutOfStock ? 'bg-gray-100 text-gray-300' : 'bg-red-50 text-red-600 hover:bg-red-600 hover:text-white'}`}><Icon name={TrendingDown} size={24}/></button>
                                                            <button onClick={() => { setSelectedMaterial(m); setModalType('ADJUST'); }} className="flex-1 md:flex-none p-4 bg-gray-100 text-gray-600 rounded-2xl hover:bg-gray-700 hover:text-white transition-all"><Icon name={SlidersHorizontal} size={24}/></button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="bg-white rounded-[32px] border border-[#E0E0E0] overflow-hidden shadow-sm animate-in fade-in duration-500">
                                <div className="p-8 border-b border-[#F1F3F4] flex items-center justify-between">
                                    <div className="flex items-center gap-3"><Icon name={History} className="text-blue-600" size={24}/><h3 className="text-xl font-bold tracking-tight">Bitácora de Movimientos</h3></div>
                                    <button onClick={fetchData} className="p-2 hover:bg-[#F1F3F4] rounded-full transition-colors"><Icon name={RefreshCcw} size={20}/></button>
                                </div>
                                <div className="overflow-x-auto no-scrollbar">
                                    <table className="w-full text-left">
                                        <thead className="bg-[#F8F9FA] text-[#5F6368] text-[10px] uppercase font-black tracking-widest">
                                            <tr><th className="px-8 py-5">Fecha</th><th className="px-8 py-5">Tipo</th><th className="px-8 py-5">Material</th><th className="px-8 py-5 text-right">Saldo</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-[#F1F3F4]">
                                            {(data.movimientos || []).slice().reverse().map((m, i) => (
                                                <tr key={i} className="hover:bg-[#F8F9FA] transition-colors">
                                                    <td className="px-8 py-5">
                                                        <p className="text-sm font-bold">{new Date(m.timestamp).toLocaleDateString()}</p>
                                                        <p className="text-[9px] uppercase text-[#5F6368]">{m.usuario}</p>
                                                    </td>
                                                    <td className="px-8 py-5"><span className={`px-3 py-1 rounded-full text-[9px] font-black ${m.tipo === 'IN' ? 'bg-green-100 text-green-700' : m.tipo === 'OUT' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>{m.tipo}</span></td>
                                                    <td className="px-8 py-5 text-sm font-bold">{m.item_nombre}</td>
                                                    <td className="px-8 py-5 text-right"><p className={`text-sm font-black ${parseFloat(m.diferencia) < 0 ? 'text-red-600' : 'text-green-600'}`}>{parseFloat(m.diferencia) > 0 ? '+' : ''}{m.diferencia}</p><p className="text-[10px] font-bold text-[#5F6368]">Final: {m.stock_nuevo}</p></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {view === 'reports' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 animate-in fade-in duration-500">
                                <div className="bg-white p-10 rounded-[40px] border border-[#E0E0E0] text-center group hover:shadow-xl transition-all">
                                    <div className="w-20 h-20 bg-red-50 text-red-600 rounded-3xl flex items-center justify-center mx-auto mb-6"><Icon name={FileText} size={40} /></div>
                                    <h3 className="text-2xl font-bold mb-4 tracking-tight">Stock PDF</h3>
                                    <button onClick={() => window.print()} className="w-full py-5 bg-[#F1F3F4] text-[#202124] rounded-full font-bold hover:bg-[#E0E0E0] transition-all flex items-center justify-center gap-2">Descargar PDF</button>
                                </div>
                                <div className="bg-white p-10 rounded-[40px] border border-[#E0E0E0] text-center group hover:shadow-xl transition-all">
                                    <div className="w-20 h-20 bg-green-50 text-green-600 rounded-3xl flex items-center justify-center mx-auto mb-6"><Icon name={ExternalLink} size={40} /></div>
                                    <h3 className="text-2xl font-bold mb-4 tracking-tight">Excel Google Drive</h3>
                                    <button onClick={() => window.open('https://docs.google.com/spreadsheets/d/1oZiefz32aCVb0iBGnfQ5drzZKvk94HVCbWcgZleIKlg/edit', '_blank')} className="w-full py-5 bg-[#1a73e8] text-white rounded-full font-bold shadow-xl hover:bg-[#1557b0] transition-all flex items-center justify-center gap-2">Abrir Planilla</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer Nav Mobile */}
                    <nav className="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-[#E0E0E0] px-4 py-4 z-40 flex justify-around items-center rounded-t-[30px] shadow-2xl">
                        {[
                            { id: 'dashboard', icon: LayoutDashboard, label: 'Inicio' },
                            { id: 'inventory', icon: Boxes, label: 'Bodega' },
                            { id: 'history', icon: History, label: 'Bitácora' },
                            { id: 'reports', icon: FileText, label: 'Reportes' },
                        ].map(item => (
                            <button 
                                key={item.id} 
                                onClick={() => { setView(item.id); setNavPath({category:null, subcategory:null}); setSearchTerm(''); }} 
                                className={`flex flex-col items-center gap-1 p-2 transition-all ${view === item.id ? 'text-blue-600' : 'text-[#BDC1C6]'}`}
                            >
                                <div className={`p-2 px-6 rounded-full ${view === item.id ? 'bg-blue-50' : ''}`}><Icon name={item.icon} size={24} /></div>
                                <span className="text-[10px] font-black uppercase tracking-widest">{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* Modal Movimientos */}
                    {modalType && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-[#202124]/40 backdrop-blur-sm animate-in fade-in" onClick={() => !isLoading && setModalType(null)}></div>
                            <div className="bg-white w-full max-w-sm rounded-[40px] shadow-2xl z-10 overflow-hidden animate-in zoom-in-95 border border-[#E0E0E0]">
                                <div className={`p-8 text-white ${modalType === 'IN' ? 'bg-green-600' : modalType === 'OUT' ? 'bg-red-600' : 'bg-gray-800'}`}>
                                    <p className="text-[10px] font-black uppercase tracking-widest opacity-80">Registrar {modalType}</p>
                                    <h3 className="text-2xl font-bold leading-tight">{selectedMaterial?.nombre}</h3>
                                </div>
                                <form className="p-8 space-y-6" onSubmit={async (e) => {
                                    e.preventDefault();
                                    setIsLoading(true);
                                    try {
                                        await fetch(SCRIPT_URL, {
                                            method: 'POST',
                                            mode: 'no-cors',
                                            body: JSON.stringify({
                                                action: 'movimiento',
                                                usuario: user.nombre,
                                                tipo: modalType,
                                                materialId: selectedMaterial.id,
                                                cantidad: e.target.cantidad.value,
                                                nota: e.target.nota.value
                                            })
                                        });
                                        setModalType(null);
                                        setTimeout(fetchData, 1500);
                                    } catch (err) { console.error(err); } finally { setIsLoading(false); }
                                }}>
                                    <div className="space-y-1">
                                        <label className="text-xs font-black text-[#5F6368] uppercase ml-1">Cantidad ({selectedMaterial?.unidad || 'unidades'})</label>
                                        <input required name="cantidad" type="number" step="0.01" className="w-full px-6 py-5 bg-[#F1F3F4] rounded-3xl outline-none text-2xl font-black focus:ring-4 focus:ring-blue-100 transition-all" placeholder="0.00" autoFocus />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-xs font-black text-[#5F6368] uppercase ml-1">Comentario</label>
                                        <input name="nota" className="w-full px-6 py-4 bg-[#F1F3F4] rounded-2xl outline-none text-sm font-medium focus:ring-4 focus:ring-blue-100 transition-all" placeholder="Opcional..." />
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <button type="button" onClick={() => setModalType(null)} className="flex-1 py-4 font-bold text-[#5F6368]">Cancelar</button>
                                        <button disabled={isLoading} className="flex-[2] py-4 bg-[#1a73e8] text-white rounded-3xl font-bold shadow-xl flex items-center justify-center gap-2 hover:bg-[#1557b0] transition-all disabled:opacity-50">
                                            {isLoading ? <Icon name={Loader2} className="animate-spin" /> : 'Confirmar'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
