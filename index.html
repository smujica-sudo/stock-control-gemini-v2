<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawas Coffee - Control de Stock</title>
    
    <!-- ☕ FAVICON: Imagen K de Kawas -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            margin: 0;
            overflow-x: hidden;
            color: #202124;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Aceleración de GPU para fluidez móvil */
        .gpu-accelerated { transform: translateZ(0); will-change: transform, opacity; }
        
        /* Animaciones Interfaz Suave */
        .nav-card:active { transform: scale(0.96); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        .action-button:active { transform: scale(0.88); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translate3d(0, 15px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }

        /* ESTILOS DE IMPRESIÓN (Para los reportes PDF) */
        @media print {
            @page { margin: 10mm; size: auto; }
            body { background-color: white !important; }
            .no-print, aside, header, nav, .action-button { display: none !important; }
            main { margin: 0 !important; padding: 0 !important; }
            .report-container { box-shadow: none !important; border: none !important; border-radius: 0 !important; padding: 0 !important; }
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#1a73e8;font-family:sans-serif;">
            <div style="width:40px;height:40px;border:4px solid #E8F0FE;border-top:4px solid #1a73e8;border-radius:50%;animation:spin 1s linear infinite;"></div>
            <p style="margin-top:20px;font-weight:700;font-size:1.1rem;">Iniciando Kawas Stock...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useDeferredValue, memo } = React;

        // --- COMPONENTE ICONO INTELIGENTE (A prueba de fallos) ---
        const Icon = memo(({ name, size = 24, className = "", spin = false }) => {
            const lib = window.lucideReact || window.LucideReact || {};
            const LucideIcon = lib[name];
            
            // Si la librería no ha cargado ese ícono aún, muestra un círculo de carga estético
            if (!LucideIcon) {
                return <span className={`inline-block bg-gray-200 rounded-full animate-pulse ${className}`} style={{ width: size, height: size }} />;
            }
            return <LucideIcon size={size} className={`${className} ${spin ? 'animate-spin-custom' : ''} gpu-accelerated`} />;
        });

        // --- CONFIGURACIÓN ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbye0BCOskWfd-jep9i605zmPGM0VLS3XYphKeHiYkKOSAWK8Jzwx0U7LnCLeVqJgjqohg/exec";

        const App = () => {
            // --- ESTADOS ---
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(null);
            const [pin, setPin] = useState('');
            const [data, setData] = useState({ materiales: [], movimientos: [], usuarios: [] });
            
            const [searchTerm, setSearchTerm] = useState('');
            const deferredSearchTerm = useDeferredValue(searchTerm); // Búsqueda ultra-rápida
            
            const [isSyncing, setIsSyncing] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [syncError, setSyncError] = useState(null);
            
            const [modalType, setModalType] = useState(null); 
            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [navPath, setNavPath] = useState({ category: null, subcategory: null, itemId: null });

            const triggerHaptic = useCallback(() => {
                if ('vibrate' in navigator) navigator.vibrate([15, 30, 15]);
            }, []);

            // --- LÓGICA DE RED ---
            const fetchData = useCallback(async () => {
                if (!SCRIPT_URL) return;
                setIsSyncing(true);
                setSyncError(null);
                try {
                    const response = await fetch(SCRIPT_URL, { redirect: "follow" });
                    if (!response.ok) throw new Error("Google Apps Script rechazó la conexión.");
                    const textResponse = await response.text();
                    try {
                        const json = JSON.parse(textResponse);
                        if (json && json.materiales) setData(json);
                    } catch (err) { throw new Error("Error procesando los datos de la hoja de cálculo."); }
                } catch (e) {
                    console.error("Error en sincronización:", e);
                    setSyncError(e.message);
                } finally {
                    setIsSyncing(false);
                }
            }, []);

            useEffect(() => {
                fetchData();
            }, [fetchData]);

            // --- LÓGICA DE LOGIN AUTOMÁTICO ---
            const attemptLogin = useCallback((currentPin) => {
                if (data.materiales.length === 0) return; // Ignora si la BD aún no carga
                const validUser = (data.usuarios || []).find(u => u.pin == currentPin) || (currentPin === "1234" ? { nombre: "Admin Kawas", rol: "Administrador" } : null);
                
                if (validUser) {
                    setUser(validUser);
                    setView('dashboard');
                    triggerHaptic();
                } else if (currentPin.length === 4) {
                    setPin('');
                    alert("PIN incorrecto. Intente nuevamente.");
                    triggerHaptic();
                }
            }, [data, triggerHaptic]);

            const handlePinChange = (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                setPin(val);
                if (val.length === 4) {
                    setTimeout(() => attemptLogin(val), 100);
                }
            };

            // --- LÓGICA DE MOVIMIENTOS (OPTIMISTIC UI) ---
            const handleTransaction = async (e) => {
                e.preventDefault();
                const qty = parseFloat(e.target.cantidad.value);
                const nota = e.target.nota.value;
                const matId = selectedMaterial.id;

                setModalType(null);
                triggerHaptic();
                setIsSaving(true);

                let nuevoStock = parseFloat(selectedMaterial.stock) || 0;
                if (modalType === 'IN') nuevoStock += qty;
                if (modalType === 'OUT') nuevoStock -= qty;
                if (modalType === 'ADJUST') nuevoStock = qty;

                // Actualizar UI instantáneamente
                setData(prev => ({
                    ...prev,
                    materiales: prev.materiales.map(m => m.id === matId ? { ...m, stock: nuevoStock } : m),
                    movimientos: [...prev.movimientos, {
                        timestamp: new Date().toISOString(), usuario: user.nombre, tipo: modalType,
                        item_id: matId, item_nombre: selectedMaterial.nombre, cantidad: qty,
                        stock_nuevo: nuevoStock, diferencia: modalType === 'IN' ? qty : modalType === 'OUT' ? -qty : (nuevoStock - (parseFloat(selectedMaterial.stock) || 0))
                    }]
                }));

                try {
                    await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'movimiento', usuario: user.nombre, tipo: modalType, materialId: matId, cantidad: qty, nota: nota }) });
                } catch (err) { console.error("Error guardando:", err); } 
                finally { setIsSaving(false); }
            };

            // --- ESTADÍSTICAS Y AGRUPACIONES ---
            const stats = useMemo(() => {
                const materiales = data.materiales || [];
                const movimientos = data.movimientos || [];
                
                const totalItems = materiales.length;
                const criticalList = materiales.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0);
                const criticalItems = criticalList.length;
                
                const outOfStockList = materiales.filter(m => (parseFloat(m.stock) || 0) <= 0);
                const outOfStock = outOfStockList.length;

                const getDaysLeft = (materialId, currentStock) => {
                    const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                    const recentOuts = movimientos.filter(mov => mov.item_id == materialId && mov.tipo === 'OUT' && new Date(mov.timestamp) >= sevenDaysAgo);
                    const totalConsumed = recentOuts.reduce((acc, curr) => acc + Math.abs(parseFloat(curr.cantidad || 0)), 0);
                    return totalConsumed <= 0 ? '---' : Math.round(parseFloat(currentStock) / (totalConsumed / 7));
                };

                const groupedInventory = {};
                materiales.forEach(m => {
                    const cat = m.categoria || 'Sin Categoría'; const subcat = m.subcategoria || 'General';
                    if(!groupedInventory[cat]) groupedInventory[cat] = {};
                    if(!groupedInventory[cat][subcat]) groupedInventory[cat][subcat] = [];
                    groupedInventory[cat][subcat].push(m);
                });

                return { totalItems, criticalItems, criticalList, outOfStock, outOfStockList, getDaysLeft, groupedInventory };
            }, [data]);

            const navigationData = useMemo(() => {
                const materiales = data.materiales || [];
                if (deferredSearchTerm) return { level: 'search', items: materiales.filter(m => (m.nombre || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()) || (m.categoria || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()))};
                
                if (!navPath.category) return { level: 'categories', items: [...new Set(materiales.map(m => m.categoria).filter(Boolean))].map(name => ({ name, count: materiales.filter(m => m.categoria === name).length, out: materiales.filter(m => m.categoria === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.subcategory) return { level: 'subcategories', items: [...new Set(materiales.filter(m => m.categoria === navPath.category).map(m => m.subcategoria || 'General'))].map(name => ({ name, count: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name).length, out: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.itemId) return { level: 'items', items: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === navPath.subcategory) };
                
                return { level: 'detail', item: materiales.find(m => m.id == navPath.itemId), movements: (data.movimientos || []).filter(mov => mov.item_id == navPath.itemId) };
            }, [data.materiales, navPath, deferredSearchTerm]);

            const resetNav = useCallback(() => setNavPath({ category: null, subcategory: null, itemId: null }), []);
            const openActionModal = useCallback((item, type) => { setSelectedMaterial(item); setModalType(type); triggerHaptic(); }, [triggerHaptic]);

            // --- VISTA DE LOGIN (Sin botón ingresar) ---
            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#F8F9FA]">
                        <div className="w-full max-w-sm bg-white rounded-[40px] p-10 shadow-xl border border-[#E0E0E0] text-center gpu-accelerated">
                            <div className="w-20 h-20 bg-[#1a73e8] rounded-3xl mx-auto mb-8 flex items-center justify-center text-white shadow-lg shadow-blue-200 rotate-3">
                                <Icon name="PackageCheck" size={40} />
                            </div>
                            <h1 className="text-2xl font-bold mb-2 text-[#202124]">Kawas Coffee</h1>
                            <p className="text-[#5F6368] text-sm mb-6">Bodega e Inventario</p>

                            {syncError && (
                                <div className="bg-red-50 text-red-600 p-4 rounded-2xl text-left font-medium mb-6 text-xs">
                                    <strong>Fallo de conexión:</strong> {syncError}
                                    <button onClick={fetchData} className="mt-2 block bg-red-100 px-3 py-1.5 rounded-lg w-full text-center">Reintentar</button>
                                </div>
                            )}

                            <div className="space-y-6">
                                <input 
                                    type="password" 
                                    inputMode="numeric"
                                    maxLength={4}
                                    placeholder="PIN"
                                    value={pin}
                                    onChange={handlePinChange}
                                    className="w-full py-5 bg-[#F1F3F4] rounded-2xl text-center text-3xl tracking-[1em] focus:ring-4 focus:ring-blue-100 outline-none transition-all border-2 border-transparent focus:border-blue-200"
                                />
                                <div className="h-4 flex items-center justify-center">
                                    {isSyncing && data.materiales.length === 0 && <span className="text-xs font-bold text-blue-600 flex items-center gap-2"><Icon name="RefreshCcw" size={14} spin /> Conectando Servidor...</span>}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- INTERFAZ PRINCIPAL ---
            return (
                <div className="min-h-screen bg-[#F8F9FA] text-[#202124] font-sans flex flex-col lg:flex-row">
                    
                    {/* BARRA LATERAL FIJA (SOLO DESKTOP) */}
                    <aside className="no-print hidden lg:flex flex-col w-64 bg-white border-r border-[#E0E0E0] fixed h-full z-20">
                        <div className="p-8">
                            <div className="flex items-center gap-3 text-[#1a73e8]">
                                <Icon name="PackageCheck" size={32} />
                                <span className="font-bold text-xl tracking-tight">Kawas Stock</span>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-2">
                            {[
                                { id: 'dashboard', label: 'Inicio', icon: 'Home' },
                                { id: 'inventory', label: 'Bodega', icon: 'Search' },
                                { id: 'history', label: 'Historial', icon: 'History' },
                                { id: 'reports', label: 'Reportes', icon: 'FileText' },
                            ].map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => { setView(item.id); resetNav(); setSearchTerm(''); triggerHaptic(); }}
                                    className={`w-full flex items-center gap-4 px-4 py-3 rounded-2xl transition-all ${view === item.id ? 'bg-[#E8F0FE] text-[#1a73e8] font-bold' : 'text-[#5F6368] hover:bg-[#F1F3F4]'}`}
                                >
                                    <Icon name={item.icon} size={20} /> {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-6 border-t border-[#F1F3F4]">
                            <div className="flex items-center gap-3 p-3 bg-[#F8F9FA] rounded-2xl">
                                <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs uppercase">
                                    {user?.nombre?.charAt(0)}
                                </div>
                                <div className="overflow-hidden">
                                    <p className="text-xs font-bold truncate">{user?.nombre}</p>
                                    <p className="text-[10px] text-[#5F6368] uppercase tracking-wider">{user?.rol}</p>
                                </div>
                            </div>
                        </div>
                    </aside>
                    
                    {/* CONTENIDO PRINCIPAL */}
                    <main className="flex-1 lg:ml-64 p-4 lg:p-10 pb-28 lg:pb-10 max-w-[1400px] w-full mx-auto">
                        
                        {/* Header Superior Móvil (Para mostrar sync) */}
                        <div className="lg:hidden flex items-center justify-between mb-6">
                            <h2 className="text-lg font-bold tracking-tight">Kawas Coffee</h2>
                            <div className="flex items-center gap-2">
                                {isSaving && <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-[10px] font-bold flex items-center gap-1"><Icon name="CloudUpload" size={14} spin /></span>}
                                {isSyncing && !isSaving && <span className="bg-gray-100 text-gray-500 px-3 py-1 rounded-full text-[10px] font-bold flex items-center gap-1"><Icon name="RefreshCcw" size={14} spin /></span>}
                            </div>
                        </div>

                        {/* DASHBOARD */}
                        {view === 'dashboard' && (
                            <div className="space-y-8 fade-in-up">
                                <div className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-3xl font-bold">Panel de Control</h2>
                                        <p className="text-[#5F6368] mt-1">Estado de insumos críticos para producción.</p>
                                    </div>
                                    <button onClick={() => { fetchData(); triggerHaptic(); }} className="hidden md:flex items-center gap-2 px-4 py-2 bg-white border border-[#E0E0E0] rounded-xl shadow-sm hover:shadow-md transition-all active:scale-95 text-sm font-bold text-[#202124]">
                                        <Icon name="RefreshCcw" size={18} className={isSyncing ? 'animate-spin-custom text-blue-600' : ''} /> Actualizar
                                    </button>
                                </div>

                                {/* Alerta Crítica Global Expandida */}
                                {stats.outOfStock > 0 && (
                                    <div className="bg-red-600 text-white p-6 md:p-8 rounded-[32px] md:rounded-[40px] shadow-xl shadow-red-200 fade-in-up" style={{ animationDelay: '100ms' }}>
                                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                                            <div className="flex items-start gap-5">
                                                <div className="bg-white/20 p-4 rounded-2xl shrink-0 animate-pulse">
                                                    <Icon name="XCircle" size={36} />
                                                </div>
                                                <div>
                                                    <h4 className="text-xl md:text-2xl font-black uppercase tracking-tight">Acción Requerida</h4>
                                                    <p className="text-red-100 text-sm mb-4">Los siguientes materiales requieren reposición inmediata:</p>
                                                    <div className="flex flex-wrap gap-2">
                                                        {stats.outOfStockList.map(item => (
                                                            <span key={item.id} className="bg-white/10 border border-white/20 px-3 py-1.5 rounded-lg text-xs font-bold backdrop-blur-sm">
                                                                {item.nombre}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                            <button onClick={() => { setView('inventory'); setSearchTerm(''); triggerHaptic(); }} className="bg-white text-red-600 px-8 py-4 rounded-full font-black text-sm hover:bg-red-50 transition-all active:scale-95 shadow-lg shrink-0">
                                                Gestionar Stock
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* KPI Row */}
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                                    {[
                                        { label: 'Ítems Totales', val: stats.totalItems, icon: 'Package', color: 'text-blue-600', bg: 'bg-blue-50' },
                                        { label: 'Stock Crítico', val: stats.criticalItems, icon: 'AlertTriangle', color: 'text-amber-600', bg: 'bg-amber-50' },
                                        { label: 'Agotados', val: stats.outOfStock, icon: 'TrendingDown', color: 'text-red-600', bg: 'bg-red-50' },
                                        { label: 'Salud Bodega', val: `${Math.round(((stats.totalItems - stats.outOfStock) / stats.totalItems) * 100 || 0)}%`, icon: 'CheckCircle2', color: 'text-green-600', bg: 'bg-green-50' },
                                    ].map((kpi, i) => (
                                        <div key={i} className={`bg-white p-6 md:p-8 rounded-[32px] md:rounded-[40px] border transition-all fade-in-up ${kpi.label === 'Agotados' && stats.outOfStock > 0 ? 'border-red-300 shadow-lg shadow-red-100' : 'border-[#E0E0E0] shadow-sm'}`} style={{ animationDelay: `${i * 50}ms` }}>
                                            <div className={`w-12 h-12 ${kpi.bg} ${kpi.color} rounded-2xl flex items-center justify-center mb-4`}>
                                                <Icon name={kpi.icon} size={26} />
                                            </div>
                                            <p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest">{kpi.label}</p>
                                            <p className="text-3xl font-black mt-2 text-[#202124] tracking-tighter">{kpi.val}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        
                        {/* INVENTARIO Y NAVEGACIÓN */}
                        {view === 'inventory' && (
                            <div className="space-y-6 fade-in-up pb-6">
                                <div className="sticky top-0 z-10 bg-[#F8F9FA]/90 backdrop-blur-md pb-6 pt-2">
                                    <div className="relative group">
                                        <Icon name="Search" className="absolute left-6 top-1/2 -translate-y-1/2 text-[#5F6368] transition-colors group-focus-within:text-blue-600" size={24} />
                                        <input 
                                            type="text" 
                                            placeholder="Buscar materiales..."
                                            value={searchTerm}
                                            onChange={e => { setSearchTerm(e.target.value); if(e.target.value) resetNav(); }}
                                            className="w-full pl-16 pr-6 py-5 bg-white border border-[#E0E0E0] rounded-[30px] shadow-sm focus:ring-4 focus:ring-blue-100 outline-none transition-all text-lg font-medium text-[#202124]"
                                        />
                                    </div>
                                    
                                    {/* Breadcrumbs */}
                                    {!searchTerm && (
                                        <div className="flex items-center gap-2 overflow-x-auto no-scrollbar py-3 mt-2">
                                            <button onClick={() => { resetNav(); triggerHaptic(); }} className={`px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap transition-colors ${!navPath.category ? 'bg-[#1a73e8] text-white shadow-md shadow-blue-200' : 'bg-white border border-[#E0E0E0] text-[#5F6368]'}`}>Bodega</button>
                                            {navPath.category && <><Icon name="ChevronRight" size={18} className="text-[#BDC1C6] shrink-0" /><button onClick={() => { setNavPath({...navPath, subcategory:null, itemId:null}); triggerHaptic(); }} className={`px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap transition-colors ${navPath.category && !navPath.subcategory ? 'bg-[#1a73e8] text-white shadow-md shadow-blue-200' : 'bg-white border border-[#E0E0E0] text-[#5F6368]'}`}>{navPath.category}</button></>}
                                            {navPath.subcategory && <><Icon name="ChevronRight" size={18} className="text-[#BDC1C6] shrink-0" /><button onClick={() => { setNavPath({...navPath, itemId:null}); triggerHaptic(); }} className={`px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap transition-colors ${navPath.category && navPath.subcategory && !navPath.itemId ? 'bg-[#1a73e8] text-white shadow-md shadow-blue-200' : 'bg-white border border-[#E0E0E0] text-[#5F6368]'}`}>{navPath.subcategory}</button></>}
                                            {navPath.itemId && <><Icon name="ChevronRight" size={18} className="text-[#BDC1C6] shrink-0" /><button className="px-5 py-2.5 bg-[#1a73e8] text-white rounded-full text-xs font-bold uppercase whitespace-nowrap shadow-md shadow-blue-200">Detalle</button></>}
                                        </div>
                                    )}
                                </div>

                                {/* DETALLE DEL PRODUCTO */}
                                {navigationData.level === 'detail' ? (
                                    <div className="space-y-6 fade-in-up">
                                        <div className="bg-white rounded-[40px] border border-[#E0E0E0] p-6 md:p-10 shadow-sm">
                                            <div className="flex flex-col md:flex-row md:items-start justify-between gap-6 md:gap-8">
                                                <div className="flex items-center gap-5 md:gap-6">

                                                    </div>

                                            </div>

                        {[

                        ].map(item => (
                            <button key={item.id} onClick={() => { setView(item.id); resetNav(); setSearchTerm(''); triggerHaptic(); }} className={`flex flex-col items-center gap-1.5 p-2 transition-transform active:scale-90 ${view === item.id ? 'text-[#1a73e8]' : 'text-[#BDC1C6]'}`}>
                                <div className={`p-3 px-6 rounded-[20px] transition-colors ${view === item.id ? 'bg-[#E8F0FE]' : ''}`}><Icon name={item.icon} size={24} /></div>
                                <span className="text-[10px] font-black uppercase tracking-widest">{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* MODAL TRANSACCIONES (Diseño Lucide Original) */}
                    {modalType && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-[#202124]/40 backdrop-blur-md fade-in-up" style={{animationDuration: '0.2s'}} onClick={() => setModalType(null)}></div>
                            <div className="bg-white w-full max-w-sm rounded-[40px] shadow-2xl z-10 overflow-hidden fade-in-up gpu-accelerated" style={{animationDuration: '0.3s'}}>
                                <div className={`p-8 text-white ${modalType === 'IN' ? 'bg-green-600' : modalType === 'OUT' ? 'bg-red-600' : 'bg-gray-800'}`}>
                                    <div className="flex justify-between items-start">
                                        <div><p className="text-[10px] font-black uppercase tracking-widest opacity-80 mb-1">Registrar {modalType}</p><h3 className="text-2xl font-bold leading-tight">{selectedMaterial?.nombre}</h3></div>
                                        <div className="p-3 bg-white/20 rounded-2xl"><Icon name={modalType === 'IN' ? 'ArrowUpCircle' : modalType === 'OUT' ? 'ArrowDownCircle' : 'SlidersHorizontal'} size={32} /></div>
                                    </div>
                                </div>
                                <form className="p-8 space-y-6" onSubmit={handleTransaction}>
                                    <div className="space-y-2"><label className="text-xs font-bold text-[#5F6368] uppercase ml-1">Cantidad ({selectedMaterial?.unidad})</label><input required name="cantidad" type="number" step="0.01" className="w-full px-6 py-5 bg-[#F1F3F4] rounded-3xl outline-none text-2xl font-black text-[#202124] focus:ring-4 focus:ring-blue-100 transition-all" placeholder="0" autoFocus /></div>
                                    <div className="space-y-2"><label className="text-xs font-bold text-[#5F6368] uppercase ml-1">Comentario</label><input name="nota" className="w-full px-6 py-4 bg-[#F1F3F4] rounded-2xl outline-none text-sm font-medium text-[#202124] focus:ring-4 focus:ring-blue-100 transition-all" placeholder="Ej: Nueva recepción" /></div>
                                    <div className="flex gap-4 pt-4"><button type="button" onClick={() => setModalType(null)} className="action-button flex-1 py-4 font-bold text-[#5F6368] bg-[#F8F9FA] hover:bg-[#E0E0E0] rounded-2xl transition-colors">Cancelar</button><button className="action-button flex-[2] py-4 bg-[#1a73e8] text-white rounded-3xl font-bold shadow-xl shadow-blue-100 flex items-center justify-center gap-2 hover:bg-[#1557b0] transition-colors">Confirmar</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
