<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawas Coffee - Control de Stock</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Google Material Symbols (Rounded, Fill, Optical Size) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            margin: 0;
            overflow-x: hidden;
            color: #202124;
            -webkit-tap-highlight-color: transparent;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            line-height: 1; vertical-align: middle; user-select: none;
        }

        /* 🚀 Optimizaciones de Renderizado GPU */
        .gpu-accelerated {
            transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000px;
            will-change: transform, opacity;
        }

        .content-visibility-auto { content-visibility: auto; contain-intrinsic-size: 200px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animaciones Material Design */
        .nav-card:active { transform: scale(0.96); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        .action-button:active { transform: scale(0.88); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .glass-red { background: rgba(220, 38, 38, 0.95); backdrop-filter: blur(12px); }

        /* Loader & Shimmer */
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translate3d(0, 15px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }

        /* Estilos de Impresión Optimizados */
        @media print {
            @page { margin: 10mm; size: auto; }
            body { background-color: white !important; }
            .no-print, aside, header, nav, .action-button { display: none !important; }
            main { margin: 0 !important; padding: 0 !important; }
            .report-container { box-shadow: none !important; border: none !important; border-radius: 0 !important; }
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#1a73e8;font-family:sans-serif;">
            <div style="width:40px;height:40px;border:4px solid #E8F0FE;border-top:4px solid #1a73e8;border-radius:50%;animation:spin 1s linear infinite;"></div>
            <p style="margin-top:20px;font-weight:700;">Iniciando Motor Kawas...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useDeferredValue, memo } = React;

        // 1. Icono Liviano Memoizado (No se re-renderiza innecesariamente)
        const Icon = memo(({ name, size = 24, className = "", spin = false, fill = false }) => (
            <span className={`material-symbols-rounded ${className} ${spin ? 'animate-spin-custom' : ''}`} 
                  style={{ fontSize: size, fontVariationSettings: `'FILL' ${fill ? 1 : 0}, 'wght' 500, 'GRAD' 0, 'opsz' 24` }}>
                {name}
            </span>
        ));

        // URL Integrada
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbye0BCOskWfd-jep9i605zmPGM0VLS3XYphKeHiYkKOSAWK8Jzwx0U7LnCLeVqJgjqohg/exec";

        // 2. Componente de Tarjeta de Ítem Memoizado (Performance Extrema en Listas)
        const InventoryItemCard = memo(({ item, onSelect, onAction, daysLeft }) => {
            const stock = parseFloat(item.stock) || 0;
            const isOutOfStock = stock <= 0;
            const isCritical = stock <= parseFloat(item.minimo) && stock > 0;
            
            return (
                <div onClick={() => onSelect(item)} className={`gpu-accelerated content-visibility-auto bg-white p-5 md:p-6 rounded-[28px] md:rounded-[32px] border flex flex-col md:flex-row md:items-center justify-between gap-4 transition-all cursor-pointer hover:shadow-lg group ${isOutOfStock ? 'border-red-300 bg-red-50/20' : isCritical ? 'border-amber-300' : 'border-gray-200'}`}>
                    <div className="flex items-center gap-4">
                        <div className={`shrink-0 w-14 h-14 rounded-2xl flex items-center justify-center transition-transform group-hover:scale-105 ${isOutOfStock ? 'bg-red-600 text-white shadow-md' : isCritical ? 'bg-amber-100 text-amber-600' : 'bg-green-50 text-green-600'}`}>
                            <Icon name="package_2" size={28} fill />
                        </div>
                        <div>
                            <p className="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-0.5 line-clamp-1">{item.subcategoria || 'General'}</p>
                            <h4 className={`text-lg md:text-xl font-black tracking-tight line-clamp-1 ${isOutOfStock ? 'text-red-700' : 'text-gray-900'}`}>{item.nombre}</h4>
                            <p className="text-[11px] text-blue-600 font-bold mt-0.5">Ver detalles</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-6 px-2 border-t md:border-t-0 pt-3 md:pt-0 border-gray-100 justify-between md:justify-end w-full md:w-auto">
                        <div className="text-left md:text-center">
                            <p className="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-0.5">Stock</p>
                            <p className={`text-2xl md:text-3xl font-black tracking-tighter ${isOutOfStock ? 'text-red-600' : isCritical ? 'text-amber-600' : 'text-gray-900'}`}>{stock.toLocaleString()}</p>
                        </div>
                        <div className="text-right md:text-center">
                            <p className="text-[9px] font-black text-gray-400 uppercase tracking-widest mb-0.5">Días</p>
                            <p className="text-lg md:text-2xl font-black text-blue-600">{daysLeft}</p>
                        </div>
                        {/* Botones de Acción Rápida (Se detiene la propagación del clic para no entrar al detalle) */}
                        <div className="hidden lg:flex gap-2 ml-4">
                            <button onClick={(e) => { e.stopPropagation(); onAction(item, 'IN'); }} className="action-button p-3 bg-blue-50 text-blue-600 rounded-[18px] hover:bg-blue-600 hover:text-white transition-colors"><Icon name="add" size={22} /></button>
                            <button disabled={isOutOfStock} onClick={(e) => { e.stopPropagation(); onAction(item, 'OUT'); }} className={`action-button p-3 rounded-[18px] transition-colors ${isOutOfStock ? 'bg-gray-100 text-gray-300' : 'bg-red-50 text-red-600 hover:bg-red-600 hover:text-white'}`}><Icon name="remove" size={22} /></button>
                        </div>
                    </div>
                </div>
            );
        });

        // 3. APLICACIÓN PRINCIPAL
        const App = () => {
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(null);
            const [pin, setPin] = useState('');
            const [data, setData] = useState({ materiales: [], movimientos: [], usuarios: [] });
            
            // Text input crudo vs Diferido (Para tecleo a la velocidad de la luz)
            const [searchTerm, setSearchTerm] = useState('');
            const deferredSearchTerm = useDeferredValue(searchTerm);

            const [isSyncing, setIsSyncing] = useState(false);
            const [isSaving, setIsSaving] = useState(false); // Feedback no bloqueante
            const [modalType, setModalType] = useState(null); 
            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth > 1024);
            const [navPath, setNavPath] = useState({ category: null, subcategory: null, itemId: null });

            const triggerHaptic = useCallback(() => { if ('vibrate' in navigator) navigator.vibrate([15, 30, 15]); }, []);

            const fetchData = useCallback(async () => {
                if (!SCRIPT_URL) return;
                setIsSyncing(true);
                try {
                    const response = await fetch(SCRIPT_URL, { redirect: "follow" });
                    const json = JSON.parse(await response.text());
                    if (json && json.materiales) setData(json);
                } catch (e) { console.error("Error sync:", e); } 
                finally { setIsSyncing(false); }
            }, []);

            useEffect(() => {
                fetchData();
                const handleResize = () => setIsSidebarOpen(window.innerWidth > 1024);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, [fetchData]);

            // Login automático optimizado
            const attemptLogin = useCallback((currentPin) => {
                if (data.materiales.length === 0) return; // Evita falsos positivos si no ha cargado
                const validUser = (data.usuarios || []).find(u => u.pin == currentPin) || (currentPin === "1234" ? { nombre: "Admin Kawas", rol: "Administrador" } : null);
                if (validUser) { setUser(validUser); setView('dashboard'); triggerHaptic(); } 
                else if (currentPin.length === 4) { setPin(''); alert("PIN incorrecto."); triggerHaptic(); }
            }, [data, triggerHaptic]);

            const handlePinChange = (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                setPin(val);
                if (val.length === 4) setTimeout(() => attemptLogin(val), 100);
            };

            // Lógica de Movimiento: Interfaz Optimista (Cero tiempos de carga para el usuario)
            const handleTransaction = async (e) => {
                e.preventDefault();
                const qty = parseFloat(e.target.cantidad.value);
                const nota = e.target.nota.value;
                const matId = selectedMaterial.id;

                // 1. Cerrar modal al instante y dar feedback físico
                setModalType(null);
                triggerHaptic();
                setIsSaving(true); 

                // 2. Calcular matemáticas localmente
                let nuevoStock = parseFloat(selectedMaterial.stock) || 0;
                if (modalType === 'IN') nuevoStock += qty;
                if (modalType === 'OUT') nuevoStock -= qty;
                if (modalType === 'ADJUST') nuevoStock = qty;

                // 3. Actualizar el estado de React ANTES de que el servidor responda
                setData(prev => {
                    return { 
                        ...prev, 
                        materiales: prev.materiales.map(m => m.id === matId ? { ...m, stock: nuevoStock } : m),
                        movimientos: [...prev.movimientos, {
                            timestamp: new Date().toISOString(), usuario: user.nombre, tipo: modalType,
                            item_id: matId, item_nombre: selectedMaterial.nombre, cantidad: qty,
                            stock_nuevo: nuevoStock, diferencia: modalType === 'IN' ? qty : modalType === 'OUT' ? -qty : (nuevoStock - (parseFloat(selectedMaterial.stock) || 0))
                        }]
                    };
                });

                // 4. Enviar a Google Sheets silenciosamente
                try {
                    await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'movimiento', usuario: user.nombre, tipo: modalType, materialId: matId, cantidad: qty, nota: nota }) });
                } catch (err) { console.error("Error guardando:", err); } 
                finally { setIsSaving(false); }
            };

            // Matemáticas Memoizadas (Se usa deferredSearchTerm)
            const stats = useMemo(() => {
                const materiales = data.materiales || [];
                const movimientos = data.movimientos || [];
                
                const getDaysLeft = (materialId, currentStock) => {
                    const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                    const recentOuts = movimientos.filter(mov => mov.item_id == materialId && mov.tipo === 'OUT' && new Date(mov.timestamp) >= sevenDaysAgo);
                    const totalConsumed = recentOuts.reduce((acc, curr) => acc + Math.abs(parseFloat(curr.cantidad || 0)), 0);
                    return totalConsumed <= 0 ? '---' : Math.round(parseFloat(currentStock) / (totalConsumed / 7));
                };

                const outOfStockList = materiales.filter(m => (parseFloat(m.stock) || 0) <= 0);
                const criticalCount = materiales.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0).length;

                const groupedInventory = {};
                materiales.forEach(m => {
                    const cat = m.categoria || 'Sin Categoría'; const subcat = m.subcategoria || 'General';
                    if(!groupedInventory[cat]) groupedInventory[cat] = {};
                    if(!groupedInventory[cat][subcat]) groupedInventory[cat][subcat] = [];
                    groupedInventory[cat][subcat].push(m);
                });

                return { totalItems: materiales.length, criticalItems: criticalCount, outOfStock: outOfStockList.length, outOfStockList, getDaysLeft, groupedInventory };
            }, [data]);

            const navigationData = useMemo(() => {
                const materiales = data.materiales || [];
                // Usamos deferredSearchTerm para la lógica pesada, no bloquea el input
                if (deferredSearchTerm) return { level: 'search', items: materiales.filter(m => (m.nombre || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()) || (m.categoria || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()))};
                
                if (!navPath.category) return { level: 'categories', items: [...new Set(materiales.map(m => m.categoria).filter(Boolean))].map(name => ({ name, count: materiales.filter(m => m.categoria === name).length, out: materiales.filter(m => m.categoria === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.subcategory) return { level: 'subcategories', items: [...new Set(materiales.filter(m => m.categoria === navPath.category).map(m => m.subcategoria || 'General'))].map(name => ({ name, count: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name).length, out: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.itemId) return { level: 'items', items: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === navPath.subcategory) };
                
                return { level: 'detail', item: materiales.find(m => m.id == navPath.itemId), movements: (data.movimientos || []).filter(mov => mov.item_id == navPath.itemId) };
            }, [data.materiales, navPath, deferredSearchTerm]);

            const openActionModal = useCallback((item, type) => {
                setSelectedMaterial(item); setModalType(type); triggerHaptic();
            }, [triggerHaptic]);

            // VISTA: LOGIN
            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-[#F8F9FA]">
                        <div className="w-full max-w-sm bg-white rounded-[40px] p-8 md:p-10 shadow-2xl border border-gray-100 text-center gpu-accelerated">
                            <div className="w-20 h-20 bg-[#1a73e8] rounded-[28px] mx-auto mb-6 flex items-center justify-center text-white shadow-lg shadow-blue-200 rotate-3"><Icon name="inventory_2" size={40} fill /></div>
                            <h1 className="text-2xl font-black mb-1 tracking-tighter text-gray-900">Kawas Coffee</h1>
                            <p className="text-gray-500 text-[13px] font-bold tracking-wide uppercase mb-8">Stock & Operaciones</p>
                            
                            <form onSubmit={(e)=>e.preventDefault()} className="space-y-6">
                                <input type="password" inputMode="numeric" maxLength={4} placeholder="PIN" value={pin} onChange={handlePinChange} autoFocus className="w-full py-5 bg-gray-50 rounded-2xl text-center text-4xl tracking-[0.5em] font-black text-[#1a73e8] focus:ring-4 focus:ring-blue-100 outline-none border-2 border-transparent focus:border-blue-200 transition-all" />
                                <div className="h-4 flex items-center justify-center">
                                    {isSyncing && data.materiales.length === 0 && <span className="text-xs font-bold text-blue-600 flex items-center gap-2"><Icon name="sync" size={14} spin /> Conectando Servidor...</span>}
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#F8F9FA] relative flex font-sans">
                    
                    {/* DRAWER OVERLAY (MOBILE) - Z-40 */}
                    <div className={`fixed inset-0 bg-black/30 backdrop-blur-sm z-40 lg:hidden transition-opacity duration-300 ${isSidebarOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={() => setIsSidebarOpen(false)}></div>
                    
                    {/* SIDEBAR - Optimizado con Transform en lugar de Width para 60FPS móviles */}
                    <aside className={`no-print fixed inset-y-0 left-0 z-50 flex flex-col bg-white border-r border-gray-200 transition-transform duration-300 ease-[cubic-bezier(0.2,0.8,0.2,1)] w-64 lg:w-64 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0 lg:w-20'}`}>
                        <div className="p-6 flex items-center gap-4 h-20 shrink-0 overflow-hidden">
                            <div className="w-10 h-10 bg-[#1a73e8] rounded-[14px] flex items-center justify-center text-white shrink-0 shadow-md shadow-blue-100"><Icon name="package_2" size={24} fill /></div>
                            <span className={`font-black text-xl tracking-tighter text-[#1a73e8] whitespace-nowrap transition-opacity ${!isSidebarOpen && window.innerWidth > 1024 ? 'lg:opacity-0' : 'opacity-100'}`}>Kawas Stock</span>
                        </div>
                        <nav className="flex-1 px-3 space-y-1.5 pt-4 overflow-hidden">
                            {[
                                { id: 'dashboard', label: 'Inicio', icon: 'dashboard' },
                                { id: 'inventory', label: 'Bodega', icon: 'inventory_2' },
                                { id: 'history', label: 'Bitácora', icon: 'history' },
                                { id: 'reports', label: 'Reportes', icon: 'description' },
                            ].map(item => (
                                <button key={item.id} onClick={() => { setView(item.id); setNavPath({category: null, subcategory: null, itemId: null}); setSearchTerm(''); if(window.innerWidth <= 1024) setIsSidebarOpen(false); triggerHaptic(); }} className={`w-full flex items-center h-12 rounded-2xl transition-all relative group ${view === item.id ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>
                                    <div className="w-14 shrink-0 flex items-center justify-center"><Icon name={item.icon} size={22} fill={view === item.id} /></div>
                                    <span className={`text-sm font-bold absolute left-14 whitespace-nowrap transition-opacity ${!isSidebarOpen && window.innerWidth > 1024 ? 'lg:opacity-0' : 'opacity-100'}`}>{item.label}</span>
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gray-100 shrink-0">
                            <div className={`flex items-center gap-3 p-2 bg-gray-50 rounded-2xl ${!isSidebarOpen && window.innerWidth > 1024 && 'justify-center'}`}>
                                <div className="w-9 h-9 rounded-full bg-[#1a73e8] flex items-center justify-center text-white font-black text-xs shrink-0 uppercase">{user?.nombre?.charAt(0)}</div>
                                <div className={`overflow-hidden whitespace-nowrap transition-all ${!isSidebarOpen && window.innerWidth > 1024 ? 'lg:w-0 lg:opacity-0' : 'w-full opacity-100'}`}><p className="text-xs font-bold text-gray-900">{user?.nombre}</p><p className="text-[9px] text-gray-500 font-black uppercase tracking-wider">{user?.rol}</p></div>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT */}
                    <main className={`flex-1 min-h-screen pb-24 lg:pb-10 transition-all duration-300 ease-[cubic-bezier(0.2,0.8,0.2,1)] ${isSidebarOpen ? 'lg:ml-64' : 'lg:ml-20'}`}>
                        
                        {/* Header Glassmorphism */}
                        <header className="no-print h-16 flex items-center justify-between px-4 md:px-8 sticky top-0 glass-panel z-20 border-b border-gray-200/50">
                            <div className="flex items-center gap-2">
                                <button onClick={() => { setIsSidebarOpen(!isSidebarOpen); triggerHaptic(); }} className="p-2 hover:bg-gray-100 rounded-full transition-colors"><Icon name="menu" size={26} /></button>
                                <h1 className="text-lg font-black text-gray-800 tracking-tight hidden md:block">KAWAS COFFEE</h1>
                            </div>
                            
                            {/* Indicador de Guardado Silencioso */}
                            <div className="flex items-center gap-3">
                                {isSaving && <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-[10px] font-black uppercase flex items-center gap-1.5 fade-in-up"><Icon name="cloud_sync" size={14} spin /> Guardando</span>}
                                {isSyncing && !isSaving && <span className="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-[10px] font-black uppercase flex items-center gap-1.5"><Icon name="sync" size={14} spin /> Sync</span>}
                            </div>
                        </header>

                        <div className="px-4 md:px-10 max-w-[1600px] mx-auto mt-4">
                            
                            {/* VISTA DASHBOARD */}
                            {view === 'dashboard' && (
                                <div className="space-y-6 md:space-y-8 fade-in-up">
                                    <div className="flex justify-between items-end">
                                        <div><h2 className="text-3xl font-black tracking-tight text-gray-900">Resumen</h2><p className="text-gray-500 font-medium mt-1">Estado de la bodega central.</p></div>
                                        <button onClick={() => { fetchData(); triggerHaptic(); }} className="action-button flex items-center gap-2 px-4 py-2.5 bg-white border border-gray-200 rounded-[14px] shadow-sm text-gray-700 font-bold text-sm"><Icon name="refresh" size={20} className={isSyncing ? 'animate-spin-custom' : ''} /><span className="hidden md:inline">Actualizar</span></button>
                                    </div>

                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-5">
                                        {[
                                            { label: 'Ítems Totales', val: stats.totalItems, icon: 'layers', color: 'text-blue-600', bg: 'bg-blue-50' },
                                            { label: 'Stock Crítico', val: stats.criticalItems, icon: 'warning', color: 'text-amber-600', bg: 'bg-amber-50' },
                                            { label: 'Agotados', val: stats.outOfStock, icon: 'error', color: 'text-red-600', bg: 'bg-red-50' },
                                            { label: 'Salud Bodega', val: `${Math.round(((stats.totalItems - stats.outOfStock) / stats.totalItems) * 100 || 0)}%`, icon: 'health_and_safety', color: 'text-green-600', bg: 'bg-green-50' },
                                        ].map((kpi, i) => (
                                            <div key={i} className="bg-white p-5 md:p-6 rounded-[24px] md:rounded-[32px] border border-gray-200 shadow-sm gpu-accelerated fade-in-up" style={{ animationDelay: `${i * 50}ms` }}><div className={`w-10 h-10 md:w-12 md:h-12 ${kpi.bg} ${kpi.color} rounded-[16px] md:rounded-[20px] flex items-center justify-center mb-3 md:mb-4`}><Icon name={kpi.icon} size={24} fill /></div><p className="text-[10px] font-black text-gray-500 uppercase tracking-widest">{kpi.label}</p><p className="text-2xl md:text-3xl font-black mt-1 text-gray-900 tracking-tighter">{kpi.val}</p></div>
                                        ))}
                                    </div>

                                    {stats.outOfStock > 0 && (
                                        <div className="glass-red text-white p-6 md:p-8 rounded-[32px] shadow-xl shadow-red-200/50 fade-in-up" style={{ animationDelay: '200ms' }}>
                                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                                                <div className="flex items-start gap-4">
                                                    <div className="bg-white/20 p-4 rounded-[20px] shrink-0"><Icon name="gpp_maybe" size={36} fill /></div>
                                                    <div><h4 className="text-xl md:text-2xl font-black uppercase tracking-tighter">Acción Crítica</h4><p className="text-red-50 text-sm mb-3">Materiales totalmente agotados (Stock 0):</p>

                            { id: 'inventory', icon: 'inventory_2', label: 'Bodega' },
                            { id: 'history', icon: 'history', label: 'Bitácora' },
                            { id: 'reports', icon: 'analytics', label: 'Reportes' },
                        ].map(item => (
                            <button key={item.id} onClick={() => { setView(item.id); resetNav(); setSearchTerm(''); triggerHaptic(); }} className={`flex flex-col items-center gap-1 p-2 transition-transform active:scale-90 ${view === item.id ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`}>
                                <div className={`p-2 px-6 rounded-[20px] transition-colors ${view === item.id ? 'bg-blue-100' : ''}`}><Icon name={item.icon} size={26} fill={view === item.id} /></div>
                                <span className="text-[9px] font-black uppercase tracking-widest">{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* MODAL TRANSACCIONES (Optimistic UI) */}
                    {modalType && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm fade-in-up" style={{animationDuration: '0.2s'}} onClick={() => setModalType(null)}></div>
                            <div className="bg-white w-full max-w-sm rounded-[40px] shadow-2xl z-10 overflow-hidden fade-in-up gpu-accelerated" style={{animationDuration: '0.3s'}}>
                                <div className={`p-8 text-white ${modalType === 'IN' ? 'bg-green-600' : modalType === 'OUT' ? 'bg-red-600' : 'bg-gray-800'}`}>
                                    <div className="flex justify-between items-start"><div><p className="text-[10px] font-black uppercase tracking-widest opacity-80 mb-1">Registrar {modalType}</p><h3 className="text-2xl font-black leading-tight tracking-tight">{selectedMaterial?.nombre}</h3></div><div className="p-3 bg-white/20 rounded-[20px]"><Icon name={modalType === 'IN' ? 'add' : modalType === 'OUT' ? 'remove' : 'tune'} size={32} fill /></div></div>
                                </div>
                                <form className="p-8 space-y-6" onSubmit={handleTransaction}>
                                    <div className="space-y-2"><label className="text-xs font-black text-gray-500 uppercase ml-1">Cantidad ({selectedMaterial?.unidad || 'unidades'})</label><input required name="cantidad" type="number" step="0.01" className="w-full px-7 py-5 bg-gray-50 rounded-[24px] outline-none text-3xl font-black text-gray-900 focus:ring-4 focus:ring-blue-100 transition-shadow" placeholder="0" autoFocus /></div>
                                    <div className="space-y-2"><label className="text-xs font-black text-gray-500 uppercase ml-1">Comentario</label><input name="nota" className="w-full px-7 py-4 bg-gray-50 rounded-[20px] outline-none text-sm font-bold text-gray-900 focus:ring-4 focus:ring-blue-100 transition-shadow" placeholder="Ej: Nueva recepción" /></div>
                                    <div className="flex gap-3 pt-4"><button type="button" onClick={() => setModalType(null)} className="action-button flex-1 py-4 font-black text-gray-500 bg-gray-50 hover:bg-gray-100 rounded-full transition-colors">Cancelar</button><button className="action-button flex-[2] py-4 bg-blue-600 text-white rounded-full font-black shadow-lg shadow-blue-200 flex items-center justify-center gap-2 hover:bg-blue-700 transition-all">Confirmar Registro</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
