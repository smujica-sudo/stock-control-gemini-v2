<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawas Coffee - Control de Stock</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Material Symbols (Rounded) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            margin: 0;
            overflow-x: hidden;
            color: #202124;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        /* Animaciones */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1.5s linear infinite; }

        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        .stagger-item {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #1a73e8; }
        .spinner { width: 48px; height: 48px; border: 5px solid #E8F0FE; border-top: 5px solid #1a73e8; border-radius: 50%; animation: spin 1s linear infinite; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .nav-card:active { transform: scale(0.97); }
        .action-button:active { transform: scale(0.92); }
        .glass-red { background: rgba(220, 38, 38, 0.95); backdrop-filter: blur(8px); }

        .sidebar-transition { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .main-transition { transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        /* ESTILOS DE IMPRESIÓN PRO */
        @media print {
            @page { margin: 10mm; size: auto; }
            body { background-color: white !important; }
            aside, nav, header, .no-print, .action-button { display: none !important; }
            main { margin-left: 0 !important; padding: 0 !important; }
            
            .report-container { 
                box-shadow: none !important; 
                border: none !important; 
                padding: 0 !important; 
                border-radius: 0 !important;
            }
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
            
            /* Ajustes visuales para ahorrar tinta pero mantener lectura */
            .print-table th { background-color: #f1f3f4 !important; color: #202124 !important; }
            .print-badge-red { background-color: #fce8e6 !important; color: #d93025 !important; border: 1px solid #d93025; }
            .print-badge-amber { background-color: #fef7e0 !important; color: #e37400 !important; border: 1px solid #e37400; }
            .print-badge-green { background-color: #e6f4ea !important; color: #1e8e3e !important; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loader-container">
            <div class="spinner"></div>
            <p style="margin-top: 24px; font-weight: 700; font-size: 1.1rem; color: #1a73e8;">Sincronizando con Kawas...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 24, className = "", spin = false, fill = false }) => (
            <span 
                className={`material-symbols-rounded ${className} ${spin ? 'animate-spin-custom' : ''}`} 
                style={{ fontSize: size, fontVariationSettings: `'FILL' ${fill ? 1 : 0}, 'wght' 400, 'GRAD' 0, 'opsz' 24`, verticalAlign: 'middle' }}
            >{name}</span>
        );

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBj6qSh5Pq0C-NZA2CQ54KRwwVdDhBwFQLTObYterxQJ0DY67Jcdc-VzfnRiYwICGiBw/exec";

        const App = () => {
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(null);
            const [pin, setPin] = useState('');
            const [data, setData] = useState({ materiales: [], movimientos: [], usuarios: [] });
            const [searchTerm, setSearchTerm] = useState('');
            const [isSyncing, setIsSyncing] = useState(false);
            const [modalType, setModalType] = useState(null); 
            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth > 1024);
            const [navPath, setNavPath] = useState({ category: null, subcategory: null, itemId: null });

            const triggerHaptic = () => { if ('vibrate' in navigator) navigator.vibrate([15, 30, 15]); };

            const fetchData = async () => {
                if (!SCRIPT_URL) return;
                setIsSyncing(true);
                try {
                    const response = await fetch(SCRIPT_URL, { redirect: "follow" });
                    const textData = await response.text();
                    const json = JSON.parse(textData);
                    if (json && json.materiales) setData(json);
                } catch (e) {
                    console.error("Error sync:", e);
                } finally {
                    setIsSyncing(false);
                }
            };

            useEffect(() => {
                fetchData();
                const handleResize = () => { if (window.innerWidth <= 1024) setIsSidebarOpen(false); else setIsSidebarOpen(true); };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if (data.materiales.length === 0) { alert("No hay datos cargados. Por favor recarga la página."); return; }
                const validUser = (data.usuarios || []).find(u => u.pin == pin) || (pin === "1234" ? { nombre: "Admin Kawas", rol: "Administrador" } : null);
                if (validUser) { setUser(validUser); setView('dashboard'); triggerHaptic(); } 
                else { setPin(''); alert("PIN incorrecto."); }
            };

            const stats = useMemo(() => {
                const materiales = data.materiales || [];
                const movimientos = data.movimientos || [];
                
                const getDaysLeft = (materialId, currentStock) => {
                    const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                    const recentOuts = movimientos.filter(mov => mov.item_id == materialId && mov.tipo === 'OUT' && new Date(mov.timestamp) >= sevenDaysAgo);
                    const totalConsumed = recentOuts.reduce((acc, curr) => acc + Math.abs(parseFloat(curr.cantidad || 0)), 0);
                    const avgDaily = totalConsumed / 7;
                    return avgDaily <= 0 ? '---' : Math.round(parseFloat(currentStock) / avgDaily);
                };

                const outOfStockList = materiales.filter(m => (parseFloat(m.stock) || 0) <= 0);
                const criticalList = materiales.filter(m => {
                    const s = parseFloat(m.stock) || 0; const mn = parseFloat(m.minimo) || 0;
                    return s <= mn && s > 0;
                });

                // Agrupación para el Reporte
                const groupedInventory = {};
                materiales.forEach(m => {
                    const cat = m.categoria || 'Sin Categoría';
                    const subcat = m.subcategoria || 'General';
                    if(!groupedInventory[cat]) groupedInventory[cat] = {};
                    if(!groupedInventory[cat][subcat]) groupedInventory[cat][subcat] = [];
                    groupedInventory[cat][subcat].push(m);
                });

                return { 
                    totalItems: materiales.length, 
                    criticalItems: criticalList.length, 
                    criticalList,
                    outOfStock: outOfStockList.length, 
                    outOfStockList, 
                    getDaysLeft,
                    groupedInventory
                };
            }, [data]);

            // ... (navigationData memo omitted for brevity, exact same as before) ...
            const navigationData = useMemo(() => {
                const materiales = data.materiales || [];
                if (searchTerm) return { level: 'search', items: materiales.filter(m => (m.nombre || "").toLowerCase().includes(searchTerm.toLowerCase()) || (m.categoria || "").toLowerCase().includes(searchTerm.toLowerCase()))};
                if (!navPath.category) return { level: 'categories', items: [...new Set(materiales.map(m => m.categoria).filter(Boolean))].map(name => ({ name, count: materiales.filter(m => m.categoria === name).length, out: materiales.filter(m => m.categoria === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.subcategory) return { level: 'subcategories', items: [...new Set(materiales.filter(m => m.categoria === navPath.category).map(m => m.subcategoria || 'General'))].map(name => ({ name, count: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name).length, out: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.itemId) return { level: 'items', items: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === navPath.subcategory) };
                return { level: 'detail', item: materiales.find(m => m.id == navPath.itemId), movements: (data.movimientos || []).filter(mov => mov.item_id == navPath.itemId) };
            }, [data.materiales, data.movimientos, navPath, searchTerm]);

            const resetNav = () => setNavPath({ category: null, subcategory: null, itemId: null });

            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#F8F9FA]">
                        <div className="w-full max-w-sm bg-white rounded-[40px] p-10 shadow-xl border border-[#E0E0E0] text-center">
                            <div className="w-20 h-20 bg-[#1a73e8] rounded-3xl mx-auto mb-8 flex items-center justify-center text-white shadow-lg rotate-3"><Icon name="inventory" size={40} fill /></div>
                            <h1 className="text-2xl font-bold mb-2 tracking-tight text-[#202124]">Kawas Coffee</h1>
                            <p className="text-[#5F6368] text-sm mb-6 font-medium">Gestión Inteligente de Insumos</p>
                            <form onSubmit={handleLogin} className="space-y-6">
                                <input type="password" maxLength={4} placeholder="PIN Acceso" value={pin} onChange={e => setPin(e.target.value)} className="w-full py-5 bg-[#F1F3F4] rounded-2xl text-center text-3xl tracking-[1em] focus:ring-4 focus:ring-blue-100 outline-none border-2 border-transparent focus:border-blue-200 transition-all" />
                                <button disabled={isSyncing} className="w-full bg-[#1a73e8] text-white py-5 rounded-full font-bold shadow-xl shadow-blue-100 hover:bg-[#1557b0] transition-all active:scale-95 disabled:opacity-50">{isSyncing ? "Conectando..." : "Ingresar"}</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#F8F9FA] relative flex">
                    {/* Drawer y Sidebar ... */}
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/20 backdrop-blur-[1px] z-30 lg:hidden" onClick={() => setIsSidebarOpen(false)}></div>}
                    <aside className={`no-print sidebar-transition fixed top-0 left-0 h-full bg-white border-r border-[#E0E0E0] z-40 flex flex-col ${isSidebarOpen ? 'w-64 translate-x-0' : 'w-0 lg:w-20 translate-x-[-100%] lg:translate-x-0'}`}>
                        <div className="p-6 flex items-center gap-4 h-20 shrink-0"><div className="w-10 h-10 bg-[#1a73e8] rounded-xl flex items-center justify-center text-white shrink-0 shadow-lg"><Icon name="package_2" size={24} fill /></div><span className={`font-black text-xl tracking-tighter text-[#1a73e8] whitespace-nowrap transition-opacity ${isSidebarOpen ? 'opacity-100' : 'opacity-0'}`}>Kawas Stock</span></div>
                        <nav className="flex-1 px-3 space-y-1 pt-4">
                            {[
                                { id: 'dashboard', label: 'Inicio', icon: 'dashboard' },
                                { id: 'inventory', label: 'Bodega', icon: 'inventory' },
                                { id: 'history', label: 'Historial', icon: 'history' },
                                { id: 'reports', label: 'Reportes', icon: 'analytics' },
                            ].map(item => (
                                <button key={item.id} onClick={() => { setView(item.id); resetNav(); setSearchTerm(''); if(window.innerWidth <= 1024) setIsSidebarOpen(false); triggerHaptic(); }} className={`w-full flex items-center h-12 rounded-2xl transition-all relative group ${view === item.id ? 'bg-[#E8F0FE] text-[#1a73e8]' : 'text-[#5F6368] hover:bg-[#F1F3F4]'}`}>
                                    <div className="w-14 shrink-0 flex items-center justify-center"><Icon name={item.icon} size={22} fill={view === item.id} /></div>
                                    <span className={`text-sm font-bold absolute left-14 whitespace-nowrap transition-opacity duration-200 ${isSidebarOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>{item.label}</span>
                                    {view === item.id && !isSidebarOpen && <div className="absolute right-0 w-1.5 h-6 bg-[#1a73e8] rounded-l-full"></div>}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-[#F1F3F4]"><div className={`flex items-center gap-3 p-2 bg-[#F8F9FA] rounded-2xl ${!isSidebarOpen && 'justify-center'}`}><div className="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-xs shrink-0 uppercase">{user?.nombre?.charAt(0)}</div><div className={`overflow-hidden transition-all duration-200 ${isSidebarOpen ? 'w-full opacity-100' : 'w-0 opacity-0'}`}><p className="text-xs font-bold truncate leading-none">{user?.nombre}</p><p className="text-[9px] text-[#5F6368] uppercase mt-1 tracking-wider">{user?.rol}</p></div></div></div>
                    </aside>

                    <main className={`main-transition flex-1 min-h-screen pb-24 lg:pb-10 ${isSidebarOpen ? 'lg:ml-64' : 'lg:ml-20'}`}>
                        <header className="no-print h-16 flex items-center px-4 md:px-8 sticky top-0 bg-[#F8F9FA]/80 backdrop-blur-md z-20">
                            <button onClick={() => { setIsSidebarOpen(!isSidebarOpen); triggerHaptic(); }} className="p-3 hover:bg-[#E8EAED] rounded-full mr-4"><Icon name="menu" size={24} /></button>
                            <h1 className="text-lg font-bold text-[#5F6368] uppercase tracking-widest text-[10px]">Kawas Stock Control</h1>
                        </header>

                        <div className="px-4 md:px-10">
                            {/* VISTAS ANTERIORES: Dashboard, Inventory, History (Omitidas/Condensadas para foco en Reports) */}
                            {view === 'dashboard' && (
                                <div className="space-y-8 animate-in fade-in">
                                    <div className="flex justify-between items-end mt-4">
                                        <div><h2 className="text-3xl font-black tracking-tight text-[#202124]">Bienvenido, {user.nombre.split(' ')[0]}</h2><p className="text-[#5F6368] font-medium">Estado global de los suministros.</p></div>
                                        <button onClick={fetchData} className="flex items-center gap-2 px-4 py-2.5 bg-white border border-[#E0E0E0] rounded-xl shadow-sm hover:shadow-md transition-all active:scale-95"><Icon name="sync" size={20} className={isSyncing ? 'animate-spin-custom text-blue-600' : ''} /><span className="text-sm font-bold">Sincronizar</span></button>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        {[
                                            { label: 'Ítems Totales', val: stats.totalItems, icon: 'inventory_2', color: 'text-blue-600', bg: 'bg-blue-50' },
                                            { label: 'Stock Crítico', val: stats.criticalItems, icon: 'warning', color: 'text-amber-600', bg: 'bg-amber-50' },
                                            { label: 'Agotados', val: stats.outOfStock, icon: 'trending_down', color: 'text-red-600', bg: 'bg-red-50' },
                                            { label: 'Disponibilidad', val: `${Math.round(((stats.totalItems - stats.outOfStock) / stats.totalItems) * 100 || 0)}%`, icon: 'check_circle', color: 'text-green-600', bg: 'bg-green-50' },
                                        ].map((kpi, i) => (
                                            <div key={i} className="bg-white p-6 rounded-[32px] border border-[#E0E0E0] shadow-sm"><div className={`w-12 h-12 ${kpi.bg} ${kpi.color} rounded-2xl flex items-center justify-center mb-4`}><Icon name={kpi.icon} size={26} fill /></div><p className="text-[10px] font-black text-[#5F6368] uppercase tracking-widest">{kpi.label}</p><p className="text-2xl font-black mt-1 text-[#202124]">{kpi.val}</p></div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {view === 'inventory' && (
                                <div className="text-center py-20"><Icon name="construction" size={64} className="text-[#BDC1C6] mb-4" /><h3 className="text-xl font-bold text-[#5F6368]">Navega usando el menú</h3></div>
                            )}
                            
                            {view === 'history' && (
                                <div className="text-center py-20"><Icon name="history" size={64} className="text-[#BDC1C6] mb-4" /><h3 className="text-xl font-bold text-[#5F6368]">Ve al menú para ver Bitácora</h3></div>
                            )}

                            {/* NUEVA VISTA DE REPORTES AVANZADA */}
                            {view === 'reports' && (
                                <div className="space-y-6 pb-10 animate-in fade-in">
                                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mt-4 no-print">
                                        <div>
                                            <h2 className="text-3xl font-black tracking-tight text-[#202124]">Reportes y Exportación</h2>
                                            <p className="text-[#5F6368] font-medium">Documentos formales de auditoría de inventario.</p>
                                        </div>
                                        <div className="flex gap-3">
                                            <button onClick={() => window.open('https://docs.google.com/spreadsheets/d/1oZiefz32aCVb0iBGnfQ5drzZKvk94HVCbWcgZleIKlg/edit', '_blank')} className="flex items-center gap-2 px-5 py-3 bg-white border border-[#E0E0E0] text-[#1a73e8] rounded-full font-bold shadow-sm hover:bg-[#F8F9FA] transition-all">
                                                <Icon name="table_view" size={20} fill /> Google Sheets
                                            </button>
                                            <button onClick={() => { triggerHaptic(); window.print(); }} className="flex items-center gap-2 px-6 py-3 bg-[#1a73e8] text-white rounded-full font-bold shadow-xl shadow-blue-100 hover:bg-[#1557b0] transition-all">
                                                <Icon name="print" size={20} fill /> Imprimir PDF
                                            </button>
                                        </div>
                                    </div>

                                    {/* CONTENEDOR DEL REPORTE IMPRIMIBLE */}
                                    <div className="bg-white p-8 md:p-12 rounded-[40px] border border-[#E0E0E0] shadow-sm report-container">
                                        
                                        {/* Cabecera del Reporte */}
                                        <div className="border-b-4 border-[#1a73e8] pb-6 mb-8 flex justify-between items-end">
                                            <div>
                                                <h1 className="text-4xl font-black text-[#202124] tracking-tighter uppercase mb-1">Kawas Coffee</h1>
                                                <h2 className="text-xl font-bold text-[#5F6368] uppercase tracking-widest">Reporte de Estado de Bodega</h2>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-sm font-bold text-[#202124]">Fecha: {new Date().toLocaleDateString()}</p>
                                                <p className="text-xs text-[#5F6368]">Generado por: {user.nombre}</p>
                                            </div>
                                        </div>

                                        {/* KPIs Resumen para Reporte */}
                                        <div className="grid grid-cols-4 gap-4 mb-10">
                                            <div className="p-4 bg-[#F8F9FA] rounded-2xl border border-[#F1F3F4]">
                                                <p className="text-[10px] font-black text-[#5F6368] uppercase tracking-widest">Ítems Totales</p>
                                                <p className="text-3xl font-black mt-1">{stats.totalItems}</p>
                                            </div>
                                            <div className="p-4 bg-[#F8F9FA] rounded-2xl border border-[#F1F3F4]">
                                                <p className="text-[10px] font-black text-[#5F6368] uppercase tracking-widest">Disponibilidad</p>
                                                <p className="text-3xl font-black mt-1 text-green-600">{Math.round(((stats.totalItems - stats.outOfStock) / stats.totalItems) * 100 || 0)}%</p>
                                            </div>
                                            <div className="p-4 bg-[#fef7e0] rounded-2xl border border-[#fce8e6]">
                                                <p className="text-[10px] font-black text-[#e37400] uppercase tracking-widest">Stock Crítico</p>
                                                <p className="text-3xl font-black mt-1 text-[#e37400]">{stats.criticalItems}</p>
                                            </div>
                                            <div className="p-4 bg-[#fce8e6] rounded-2xl border border-[#fad2cf]">
                                                <p className="text-[10px] font-black text-[#d93025] uppercase tracking-widest">Agotados</p>
                                                <p className="text-3xl font-black mt-1 text-[#d93025]">{stats.outOfStock}</p>
                                            </div>
                                        </div>

                                        {/* SECCIÓN 1: ALERTAS Y QUÍEBRES DE STOCK */}
                                        {(stats.outOfStock > 0 || stats.criticalItems > 0) && (
                                            <div className="mb-10 avoid-break">
                                                <div className="flex items-center gap-2 mb-4">
                                                    <Icon name="warning" className="text-red-600" fill />
                                                    <h3 className="text-xl font-black uppercase tracking-tight text-[#202124]">Atención Inmediata Requerida</h3>
                                                </div>
                                                <table className="w-full text-left print-table border-collapse border border-[#E0E0E0]">
                                                    <thead className="bg-[#F8F9FA]">
                                                        <tr>
                                                            <th className="px-4 py-3 text-[10px] font-black text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0]">Material / Ref</th>
                                                            <th className="px-4 py-3 text-[10px] font-black text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0]">Categoría</th>
                                                            <th className="px-4 py-3 text-[10px] font-black text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0] text-center">Stock Actual</th>
                                                            <th className="px-4 py-3 text-[10px] font-black text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0] text-center">Estado</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {[...stats.outOfStockList, ...stats.criticalList].map((m, i) => (
                                                            <tr key={i} className="border-b border-[#F1F3F4]">
                                                                <td className="px-4 py-3">
                                                                    <p className="font-bold text-sm text-[#202124]">{m.nombre}</p>
                                                                    <p className="text-[10px] text-[#5F6368]">ID: {m.id}</p>
                                                                </td>
                                                                <td className="px-4 py-3 text-xs font-medium text-[#5F6368]">{m.categoria}</td>
                                                                <td className="px-4 py-3 text-center font-black text-sm">{parseFloat(m.stock).toLocaleString()} <span className="text-[9px] font-normal">{m.unidad}</span></td>
                                                                <td className="px-4 py-3 text-center">
                                                                    {parseFloat(m.stock) <= 0 
                                                                        ? <span className="print-badge-red bg-red-100 text-red-700 px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-wider">Agotado</span>
                                                                        : <span className="print-badge-amber bg-amber-100 text-amber-700 px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-wider">Crítico</span>
                                                                    }
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}

                                        {/* SECCIÓN 2: DESGLOSE POR CATEGORÍAS (Tablas Standard de Gestión) */}
                                        <div className="page-break">
                                            <div className="flex items-center gap-2 mb-6 border-b-2 border-[#202124] pb-2">
                                                <Icon name="inventory_2" className="text-[#202124]" fill />
                                                <h3 className="text-xl font-black uppercase tracking-tight text-[#202124]">Detalle de Inventario por Categorías</h3>
                                            </div>

                                            {Object.keys(stats.groupedInventory).sort().map((categoria, idx) => (
                                                <div key={idx} className="mb-10 avoid-break">
                                                    <h4 className="text-lg font-black text-[#1a73e8] uppercase mb-4 tracking-tight bg-[#E8F0FE] p-3 rounded-xl inline-block">{categoria}</h4>
                                                    
                                                    {Object.keys(stats.groupedInventory[categoria]).sort().map((subcategoria, sIdx) => (
                                                        <div key={sIdx} className="mb-6 ml-4 border-l-2 border-[#E0E0E0] pl-4">
                                                            <h5 className="text-sm font-black text-[#5F6368] uppercase tracking-widest mb-3">{subcategoria}</h5>
                                                            
                                                            <table className="w-full text-left print-table border-collapse">
                                                                <thead className="bg-[#F8F9FA] border-y border-[#E0E0E0]">
                                                                    <tr>
                                                                        <th className="px-3 py-2 text-[9px] font-black text-[#5F6368] uppercase tracking-widest w-1/2">Material</th>
                                                                        <th className="px-3 py-2 text-[9px] font-black text-[#5F6368] uppercase tracking-widest text-center">Mínimo</th>
                                                                        <th className="px-3 py-2 text-[9px] font-black text-[#5F6368] uppercase tracking-widest text-center">Stock Actual</th>
                                                                        <th className="px-3 py-2 text-[9px] font-black text-[#5F6368] uppercase tracking-widest text-center">Estado</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody className="divide-y divide-[#F1F3F4]">
                                                                    {stats.groupedInventory[categoria][subcategoria].map((item, iIdx) => {
                                                                        const stock = parseFloat(item.stock) || 0;
                                                                        const min = parseFloat(item.minimo) || 0;
                                                                        const status = stock <= 0 ? 'AGOTADO' : stock <= min ? 'CRÍTICO' : 'OK';
                                                                        const statusClass = stock <= 0 ? 'text-red-600 font-black' : stock <= min ? 'text-amber-600 font-bold' : 'text-green-600 font-medium';
                                                                        
                                                                        return (
                                                                            <tr key={iIdx}>
                                                                                <td className="px-3 py-2">
                                                                                    <span className="text-xs font-bold text-[#202124] block">{item.nombre}</span>
                                                                                    <span className="text-[9px] text-[#5F6368]">Ref: {item.id}</span>
                                                                                </td>
                                                                                <td className="px-3 py-2 text-center text-xs text-[#5F6368]">{min} <span className="text-[8px]">{item.unidad}</span></td>
                                                                                <td className="px-3 py-2 text-center text-sm font-black">{stock.toLocaleString()} <span className="text-[8px] font-normal">{item.unidad}</span></td>
                                                                                <td className={`px-3 py-2 text-center text-[10px] ${statusClass}`}>{status}</td>
                                                                            </tr>
                                                                        )
                                                                    })}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    ))}
                                                </div>
                                            ))}
                                        </div>
                                        
                                        {/* Footer del Reporte (Solo visible al final de la hoja) */}
                                        <div className="mt-12 pt-4 border-t border-[#E0E0E0] text-center text-[10px] text-[#5F6368]">
                                            <p>Documento confidencial. Exclusivo para uso interno de Kawas Coffee.</p>
                                            <p>Generado automáticamente por Kawas Stock Management System V2.0.</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Bottom Nav Mobile */}
                    <nav className="no-print lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-[#E0E0E0] px-4 py-4 z-40 flex justify-around items-center rounded-t-[32px] shadow-2xl">
                        {[
                            { id: 'dashboard', icon: 'dashboard', label: 'Inicio' },
                            { id: 'inventory', icon: 'inventory', label: 'Bodega' },
                            { id: 'history', icon: 'history', label: 'Bitácora' },
                            { id: 'reports', icon: 'analytics', label: 'Reportes' },
                        ].map(item => (
                            <button key={item.id} onClick={() => { setView(item.id); resetNav(); setSearchTerm(''); triggerHaptic(); }} className={`flex flex-col items-center gap-1.5 p-2 transition-all ${view === item.id ? 'text-[#1a73e8]' : 'text-[#BDC1C6]'}`}>
                                <div className={`p-2.5 px-7 rounded-full transition-all ${view === item.id ? 'bg-[#E8F0FE]' : ''}`}><Icon name={item.icon} size={26} fill={view === item.id} /></div>
                                <span className="text-[9px] font-black uppercase tracking-widest">{item.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
