<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawas Tostaduría - Sistema de Gestión de Inventario</title>
    
    <!-- ☕ FAVICON VECTORIAL -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a73e8'/%3E%3Ctext x='50' y='75' font-family='Arial, sans-serif' font-size='72' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
    
    <!-- ESCUDO GLOBAL ANTI-CRASH -->
    <script>
        window.addEventListener('error', function(event) {
            var root = document.getElementById('root');
            if(root) {
                root.innerHTML = '<div style="padding:30px; font-family:sans-serif; color:#d93025; background:#fce8e6; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;"><h2>⚠️ Excepción del Sistema</h2><p>Ocurrió un problema procesando los datos.</p><p style="font-size:11px; margin-top:10px; color:#5F6368;">' + event.message + '</p><button onclick="window.location.reload()" style="margin-top:25px; padding:12px 24px; background:#d93025; color:white; border:none; border-radius:24px; font-weight:bold; cursor:pointer;">Reiniciar Aplicación</button></div>';
            }
        });
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    
    <!-- Google Material Symbols (Rounded & Fill Support) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            margin: 0;
            overflow-x: hidden;
            color: #202124;
            -webkit-tap-highlight-color: transparent;
        }

        /* Estilo Material Symbols 2.2 */
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            white-space: nowrap;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .gpu-accelerated { transform: translateZ(0); will-change: transform, opacity; }
        
        .nav-card:active { transform: scale(0.96); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        .action-button:active { transform: scale(0.88); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translate3d(0, 15px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }

        @media print {
            @page { margin: 10mm; size: auto; }
            body { background-color: white !important; }
            .no-print, aside, header, nav, .action-button, .search-bar { display: none !important; }
            main { margin: 0 !important; padding: 0 !important; }
            .report-container { box-shadow: none !important; border: none !important; border-radius: 0 !important; padding: 0 !important; }
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
            .print-table { width: 100% !important; border-collapse: collapse !important; }
            .print-table th, .print-table td { border: 1px solid #E0E0E0 !important; padding: 12px !important; }
            .print-badge-red { background-color: #fce8e6 !important; color: #d93025 !important; border: 1px solid #d93025; }
            .print-badge-amber { background-color: #fef7e0 !important; color: #e37400 !important; border: 1px solid #e37400; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useDeferredValue, memo } = React;

        const MASTER_PIN = "9988"; 
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbye0BCOskWfd-jep9i605zmPGM0VLS3XYphKeHiYkKOSAWK8Jzwx0U7LnCLeVqJgjqohg/exec";

        const Icon = memo(({ name, size = 24, className = "", spin = false, fill = false }) => {
            return (
                <span 
                    className={`material-symbols-rounded ${className} ${spin ? 'animate-spin-custom' : ''} gpu-accelerated select-none`}
                    style={{ 
                        fontSize: size, 
                        fontVariationSettings: `'FILL' ${fill ? 1 : 0}, 'wght' 300, 'GRAD' 0, 'opsz' 24` 
                    }}
                >
                    {name}
                </span>
            );
        });

        const getItemIcon = (categoria = '', subcategoria = '', nombre = '') => {
            const text = `${categoria} ${subcategoria} ${nombre}`.toLowerCase();
            if (text.includes('vaso') || text.includes('copa') || text.includes('mug') || text.includes('taza') || text.includes('botella')) return 'local_drink';
            if (text.includes('tapa') || text.includes('bombilla') || text.includes('pajilla') || text.includes('fajilla') || text.includes('manga') || text.includes('revolvedor') || text.includes('servilleta') || text.includes('porta')) return 'takeout_dining';
            if (text.includes('bolsa')) return 'shopping_bag';
            if (text.includes('caja') || text.includes('carton') || text.includes('cartón') || text.includes('empaque') || text.includes('packaging')) return 'inventory_2';
            if (text.includes('equipo') || text.includes('maquina') || text.includes('repuesto') || text.includes('filtro') || text.includes('herramienta') || text.includes('mantenimiento') || text.includes('tostadora')) return 'handyman';
            if (text.includes('limpieza') || text.includes('aseo') || text.includes('cloro') || text.includes('detergente') || text.includes('jabon') || text.includes('jabón') || text.includes('sanitizante') || text.includes('paño')) return 'sanitizer';
            if (text.includes('merchandising') || text.includes('ropa') || text.includes('polera') || text.includes('jockey') || text.includes('delantal')) return 'checkroom';
            if (text.includes('café') || text.includes('cafe') || text.includes('grano') || text.includes('espresso') || text.includes('verde')) return 'coffee';
            if (text.includes('té') || text.includes('matcha') || text.includes('chai') || text.includes('infusión')) return 'emoji_food_beverage';
            if (text.includes('leche') || text.includes('avena') || text.includes('almendra')) return 'water_drop';
            if (text.includes('sirope') || text.includes('jarabe') || text.includes('vainilla') || text.includes('puré')) return 'liquor';
            if (text.includes('hielo') || text.includes('cold') || text.includes('frappe')) return 'ac_unit';
            if (text.includes('azucar') || text.includes('azúcar') || text.includes('endulzante') || text.includes('stevia') || text.includes('polvo')) return 'grain';
            if (text.includes('pasteleria') || text.includes('galleta') || text.includes('pan') || text.includes('croissant') || text.includes('muffin') || text.includes('sandwich')) return 'bakery_dining';
            return 'package_2'; 
        };

        const App = () => {
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(null);
            const [pin, setPin] = useState('');
            const [data, setData] = useState({ materiales: [], movimientos: [], usuarios: [] });
            const [loginInfo, setLoginInfo] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const deferredSearchTerm = useDeferredValue(searchTerm); 
            const [isSyncing, setIsSyncing] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [syncError, setSyncError] = useState(null);
            const [modalType, setModalType] = useState(null); 
            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [navPath, setNavPath] = useState({ category: null, subcategory: null, itemId: null });
            const [historyFilters, setHistoryFilters] = useState({ user: '', dateStart: '', dateEnd: '', category: '', subcategory: '', sort: 'date_desc' });
            const [showFilters, setShowFilters] = useState(false);

            // Auto-scroll instantáneo al tope
            useEffect(() => {
                if (view !== 'login') window.scrollTo(0, 0);
            }, [view, navPath]);

            const triggerHaptic = useCallback(() => {
                if ('vibrate' in navigator) navigator.vibrate([15, 30, 15]);
            }, []);

            const fetchData = useCallback(async () => {
                setIsSyncing(true); setSyncError(null);
                try {
                    const response = await fetch(SCRIPT_URL, { redirect: "follow" });
                    const text = await response.text();
                    const json = JSON.parse(text);
                    if (json && json.materiales) setData(json);
                } catch (e) {
                    setSyncError("Error de sincronización.");
                } finally {
                    setIsSyncing(false);
                }
            }, []);

            useEffect(() => { fetchData(); }, [fetchData]);

            const attemptLogin = useCallback((currentPin) => {
                if (data.materiales.length === 0) return; 
                const validUser = (data.usuarios || []).find(u => u.pin == currentPin) || (currentPin === MASTER_PIN ? { nombre: "Admin Principal", rol: "Administrador" } : null);
                if (validUser) {
                    setUser(validUser);
                    setLoginInfo({
                        date: new Date().toLocaleDateString(),
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        version: "v2.4"
                    });
                    setView('dashboard');
                    triggerHaptic();
                } else if (currentPin.length === 4) {
                    setPin('');
                    triggerHaptic();
                }
            }, [data, triggerHaptic]);

            useEffect(() => {
                if (pin.length === 4) attemptLogin(pin);
            }, [pin, attemptLogin]);

            const handlePinChange = (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                setPin(val);
            };

            const handleTransaction = async (e) => {
                e.preventDefault();
                const qty = parseFloat(e.target.cantidad.value);
                const nota = e.target.nota.value;
                const matId = selectedMaterial.id;
                setModalType(null); triggerHaptic(); setIsSaving(true);

                let nuevoStock = parseFloat(selectedMaterial.stock) || 0;
                if (modalType === 'IN') nuevoStock += qty;
                if (modalType === 'OUT') nuevoStock -= qty;
                if (modalType === 'ADJUST') nuevoStock = qty;

                setData(prev => ({
                    ...prev,
                    materiales: prev.materiales.map(m => m.id === matId ? { ...m, stock: nuevoStock } : m),
                    movimientos: [...prev.movimientos, {
                        timestamp: new Date().toISOString(), usuario: user.nombre, tipo: modalType,
                        item_id: matId, item_nombre: selectedMaterial.nombre, cantidad: qty,
                        stock_nuevo: nuevoStock, diferencia: modalType === 'IN' ? qty : modalType === 'OUT' ? -qty : (nuevoStock - (parseFloat(selectedMaterial.stock) || 0))
                    }]
                }));

                try {
                    await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'movimiento', usuario: user.nombre, tipo: modalType, materialId: matId, cantidad: qty, nota: nota }) });
                } catch (err) { console.error(err); } 
                finally { setIsSaving(false); }
            };

            const handleSort = useCallback((column) => {
                let newSort = '';
                if (column === 'date') newSort = historyFilters.sort === 'date_desc' ? 'date_asc' : 'date_desc';
                else if (column === 'tipo') newSort = historyFilters.sort === 'tipo_asc' ? 'tipo_desc' : 'tipo_asc';
                else if (column === 'mat') newSort = historyFilters.sort === 'mat_asc' ? 'mat_desc' : 'mat_asc';
                setHistoryFilters(prev => ({ ...prev, sort: newSort }));
                triggerHaptic();
            }, [historyFilters.sort, triggerHaptic]);

            const stats = useMemo(() => {
                const materiales = data.materiales || [];
                const movimientos = data.movimientos || [];
                const totalItems = materiales.length;
                const criticalList = materiales.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0);
                const outOfStockList = materiales.filter(m => (parseFloat(m.stock) || 0) <= 0);

                const getDaysLeft = (materialId, currentStock) => {
                    const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                    const recentOuts = movimientos.filter(mov => mov.item_id == materialId && mov.tipo === 'OUT' && new Date(mov.timestamp) >= sevenDaysAgo);
                    const totalConsumed = recentOuts.reduce((acc, curr) => acc + Math.abs(parseFloat(curr.cantidad || 0)), 0);
                    return totalConsumed <= 0 ? '---' : Math.round(parseFloat(currentStock) / (totalConsumed / 7));
                };

                const categoryStats = [...new Set(materiales.map(m => m.categoria || 'Sin Categoría'))].map(cat => {
                    const items = materiales.filter(m => (m.categoria || 'Sin Categoría') === cat);
                    return {
                        name: cat, total: items.length,
                        critical: items.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0).length,
                        outOfStock: items.filter(m => (parseFloat(m.stock) || 0) <= 0).length
                    };
                }).sort((a, b) => b.total - a.total);

                return { totalItems, criticalItems: criticalList.length, criticalList, outOfStock: outOfStockList.length, outOfStockList, getDaysLeft, categoryStats };
            }, [data]);

            const navigationData = useMemo(() => {
                const materiales = data.materiales || [];
                if (deferredSearchTerm) return { level: 'search', items: materiales.filter(m => (m.nombre || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()) || (m.categoria || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()))};
                
                // Categorías con Métricas y Color de Estado
                if (!navPath.category) return { 
                    level: 'categories', 
                    items: [...new Set(materiales.map(m => m.categoria).filter(Boolean))].map(name => {
                        const catItems = materiales.filter(m => m.categoria === name);
                        return { 
                            name, 
                            count: catItems.length, 
                            out: catItems.filter(m => (parseFloat(m.stock) || 0) <= 0).length,
                            critical: catItems.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0).length
                        };
                    })
                };
                
                // Subcategorías Compactas
                if (!navPath.subcategory) return { 
                    level: 'subcategories', 
                    items: [...new Set(materiales.filter(m => m.categoria === navPath.category).map(m => m.subcategoria || 'General'))].map(name => {
                        const subItems = materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name);
                        return { 
                            name, 
                            count: subItems.length, 
                            out: subItems.filter(m => (parseFloat(m.stock) || 0) <= 0).length,
                            critical: subItems.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0).length
                        };
                    })
                };
                
                if (!navPath.itemId) return { level: 'items', items: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === navPath.subcategory) };
                return { level: 'detail', item: materiales.find(m => m.id == navPath.itemId), movements: (data.movimientos || []).filter(mov => mov.item_id == navPath.itemId) };
            }, [data.materiales, navPath, deferredSearchTerm]);

            const historyData = useMemo(() => {
                let movs = [...(data.movimientos || [])];
                const matDict = {}; (data.materiales || []).forEach(m => { matDict[m.id] = m; });
                movs = movs.map(m => ({ ...m, subcategoria: matDict[m.item_id]?.subcategoria || 'General', categoria_real: matDict[m.item_id]?.categoria || m.categoria || 'Sin Categoría' }));
                
                if (historyFilters.user) movs = movs.filter(m => m.usuario === historyFilters.user);
                if (historyFilters.category) movs = movs.filter(m => m.categoria_real === historyFilters.category);
                if (historyFilters.subcategory) movs = movs.filter(m => m.subcategoria === historyFilters.subcategory);
                if (historyFilters.dateStart) movs = movs.filter(m => new Date(m.timestamp) >= new Date(historyFilters.dateStart + "T00:00:00"));
                if (historyFilters.dateEnd) movs = movs.filter(m => new Date(m.timestamp) <= new Date(historyFilters.dateEnd + "T23:59:59"));

                movs.sort((a, b) => {
                    if (historyFilters.sort === 'date_desc') return new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime();
                    if (historyFilters.sort === 'date_asc') return new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime();
                    return 0;
                });

                const uniqueUsers = [...new Set([...(data.usuarios || []).map(u => u.nombre), ...(data.movimientos || []).map(m => m.usuario)].filter(Boolean))].sort();
                const uniqueCategories = [...new Set((data.materiales || []).map(m => m.categoria).filter(Boolean))];
                let uniqueSubcategories = historyFilters.category ? [...new Set((data.materiales || []).filter(m => m.categoria === historyFilters.category).map(m => m.subcategoria || 'General'))] : [...new Set((data.materiales || []).map(m => m.subcategoria || 'General').filter(Boolean))];
                return { movs, uniqueUsers, uniqueCategories, uniqueSubcategories };
            }, [data, historyFilters]);

            const handleItemClick = useCallback((item) => {
                setNavPath({ category: item.categoria, subcategory: item.subcategoria || 'General', itemId: item.id });
                setSearchTerm(''); 
                triggerHaptic();
            }, [triggerHaptic]);

            const navItems = [
                { id: 'dashboard', label: 'Inicio', icon: 'space_dashboard' },
                { id: 'inventory', label: 'Buscador', icon: 'search' },
                { id: 'history', label: 'Historial', icon: 'history' },
                { id: 'reports', label: 'Reportes', icon: 'analytics' },
            ];

            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#F8F9FA]">
                        <div className="w-full max-w-sm bg-white rounded-[40px] p-10 shadow-xl border border-[#E0E0E0] text-center gpu-accelerated fade-in-up">
                            <div className="w-20 h-20 mx-auto mb-8 flex items-center justify-center">
                                <img src="./logo.png" alt="K" className="w-full h-full object-contain drop-shadow-md" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                                <div style={{display: 'none'}} className="w-20 h-20 bg-[#1a73e8] rounded-3xl flex-col items-center justify-center text-white shadow-lg shadow-blue-200"><span className="text-5xl font-black font-sans leading-none">K</span></div>
                            </div>
                            <h1 className="text-3xl font-black tracking-tighter uppercase mb-2 text-[#202124]">Control de Inventario</h1>
                            <p className="text-[#5F6368] text-sm mb-6 font-medium tracking-wide">Kawas Tostaduría de Café</p>
                            <input type="password" inputMode="numeric" maxLength={4} placeholder="PIN" value={pin} onChange={handlePinChange} className="w-full py-5 bg-[#F1F3F4] rounded-2xl text-center text-3xl tracking-[1em] font-bold focus:ring-4 focus:ring-blue-100 outline-none transition-all border-2 border-transparent focus:border-blue-200" autoFocus />
                            <div className="mt-8 h-4 text-xs font-bold text-blue-600 flex items-center justify-center">{isSyncing && <span>Estableciendo conexión...</span>}</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#F8F9FA] text-[#202124] font-sans flex flex-col lg:flex-row">
                    <aside className="no-print hidden lg:flex flex-col w-64 bg-white border-r border-[#E0E0E0] fixed h-full z-20">
                        <div className="p-8"><div className="flex items-center gap-3"><img src="./logo.png" alt="K" className="w-10 h-10 object-contain" /><span className="font-black text-xl tracking-tighter uppercase leading-tight text-[#202124]">Stock Control</span></div></div>
                        <nav className="flex-1 px-4 space-y-2">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => { setView(item.id); resetNav(); setSearchTerm(''); triggerHaptic(); }} className={`w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition-all ${view === item.id ? 'bg-[#E8F0FE] text-[#1a73e8] font-bold shadow-sm' : 'text-[#5F6368] hover:bg-[#F1F3F4] font-medium'}`}><Icon name={item.icon} size={22} fill={view === item.id} /> {item.label}</button>
                            ))}
                        </nav>
                        <div className="px-4 pb-6 mt-auto space-y-3">
                            <button onClick={fetchData} disabled={isSyncing} className="w-full flex items-center justify-center gap-3 px-4 py-3.5 rounded-2xl border bg-white text-[#1a73e8] font-bold active:scale-95 shadow-sm hover:bg-[#F8F9FA]"><Icon name="sync" size={20} spin={isSyncing} /> <span className="text-sm">Sincronizar</span></button>
                            <button onClick={handleLogout} className="w-full flex items-center justify-center gap-3 px-4 py-3.5 rounded-2xl bg-red-50 text-red-600 font-bold active:scale-95 shadow-sm hover:bg-red-100"><Icon name="logout" size={20} fill /> <span className="text-sm">Cerrar Sesión</span></button>
                        </div>
                        <div className="p-6 border-t border-[#F1F3F4]"><div className="flex items-center gap-3 p-3 bg-[#F8F9FA] rounded-2xl"><div className="w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs uppercase">{user?.nombre?.charAt(0)}</div><div className="overflow-hidden"><p className="text-xs font-bold truncate">{user?.nombre}</p><p className="text-[10px] text-[#5F6368] uppercase tracking-wider">{user?.rol}</p></div></div></div>
                    </aside>

                    <div className="lg:hidden no-print flex items-center justify-between p-4 bg-white border-b sticky top-0 z-30">
                        <div className="flex items-center gap-2"><img src="./logo.png" alt="K" className="w-8 h-8 object-contain" /><span className="font-black text-lg tracking-tighter uppercase text-[#202124]">Stock Control</span></div>
                        <button onClick={handleLogout} className="p-2 bg-red-50 text-red-600 rounded-xl active:scale-90"><Icon name="logout" size={20} fill /></button>
                    </div>

                    <main className="flex-1 lg:ml-64 p-4 lg:p-10 pb-28 lg:pb-10 max-w-[1400px] w-full mx-auto">
                        {view === 'dashboard' && (
                            <div className="space-y-8 fade-in-up">
                                <div className="flex flex-col md:flex-row md:items-end justify-between gap-4">
                                    <div><h2 className="text-3xl font-bold tracking-tight text-[#202124]">Control de Stock_Materiales</h2><p className="text-[#5F6368] mt-1 font-medium text-sm md:text-base">Estado de insumos críticos para producción.</p></div>
                                    {loginInfo && (
                                        <div className="text-left md:text-right text-xs text-[#5F6368] font-medium bg-white px-5 py-3 rounded-2xl border border-[#E0E0E0] shadow-sm shrink-0 flex flex-col md:items-end">
                                            <div className="flex items-center gap-2 mb-1.5"><div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div><span className="font-bold text-[#202124]">Sesión Activa</span></div>
                                            <p className="mb-0.5">Operador: <span className="font-bold text-[#1a73e8]">{user?.nombre}</span></p>
                                            <p className="mb-0.5">Ingreso: {loginInfo.date} a las {loginInfo.time}</p>
                                            <p className="text-[10px] mt-1 text-[#BDC1C6] font-bold tracking-widest uppercase tracking-widest">VERSIÓN {loginInfo.version}</p>
                                        </div>
                                    )}
                                </div>

                                {(stats.outOfStock > 0 || stats.criticalItems > 0) && (
                                    <div className={`p-6 md:p-8 rounded-[32px] md:rounded-[40px] shadow-xl fade-in-up ${stats.outOfStock > 0 ? 'bg-red-600 text-white shadow-red-200' : 'bg-amber-500 text-white shadow-amber-200'}`} style={{ animationDelay: '100ms' }}>
                                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                                            <div className="flex items-start gap-4 md:gap-5 w-full">
                                                <div className="bg-white/20 p-3 md:p-4 rounded-2xl shrink-0 animate-pulse"><Icon name={stats.outOfStock > 0 ? "error" : "warning"} size={32} fill /></div>
                                                <div className="w-full">
                                                    <h4 className="text-xl md:text-2xl font-black uppercase tracking-tight mb-1">Acción Requerida</h4>
                                                    <p className="text-white/90 text-sm mb-4">Los siguientes materiales requieren atención operativa inmediata:</p>
                                                    <div className="flex flex-wrap gap-2 md:gap-3">
                                                        {stats.outOfStockList.map(item => (
                                                            <button key={item.id} onClick={() => { setView('inventory'); handleItemClick(item); }} className="bg-white/10 hover:bg-white/20 border border-white/20 pl-3 pr-4 py-2 rounded-2xl text-sm font-bold backdrop-blur-sm flex items-center gap-2 transition-all active:scale-95 text-left group shadow-sm"><Icon name={getItemIcon(item.categoria, '', item.nombre)} size={18} /><span className="truncate max-w-[150px]">{item.nombre}</span><span className="bg-red-800/80 px-2 py-0.5 rounded text-[9px]">AGOTADO</span></button>
                                                        ))}
                                                        {stats.criticalList.map(item => (
                                                            <button key={item.id} onClick={() => { setView('inventory'); handleItemClick(item); }} className="bg-white/10 hover:bg-white/20 border border-white/20 pl-3 pr-4 py-2 rounded-2xl text-sm font-bold backdrop-blur-sm flex items-center gap-2 transition-all active:scale-95 text-left group shadow-sm"><Icon name={getItemIcon(item.categoria, '', item.nombre)} size={18} /><span className="truncate max-w-[150px]">{item.nombre}</span><span className="bg-amber-700/80 px-2 py-0.5 rounded text-[9px]">CRÍTICO</span></button>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-6">
                                    {[
                                        { label: 'Ítems Totales', val: stats.totalItems, icon: 'category', color: 'text-blue-600', bg: 'bg-blue-50' },
                                        { label: 'Existencias Críticas', val: stats.criticalItems, icon: 'warning', color: 'text-amber-600', bg: 'bg-amber-50' },
                                        { label: 'Artículos Agotados', val: stats.outOfStock, icon: 'error', color: 'text-red-600', bg: 'bg-red-50' },
                                        { label: 'Salud Bodega', val: `${Math.round(((stats.totalItems - stats.outOfStock) / stats.totalItems) * 100 || 0)}%`, icon: 'health_and_safety', color: 'text-green-600', bg: 'bg-green-50' },
                                    ].map((kpi, i) => (
                                        <div key={i} className={`bg-white p-4 md:p-8 rounded-[24px] md:rounded-[40px] border shadow-sm ${kpi.label === 'Artículos Agotados' && stats.outOfStock > 0 ? 'border-red-300 shadow-red-100 shadow-lg' : 'border-[#E0E0E0]'}`} style={{ animationDelay: `${i * 50}ms` }}>
                                            <div className={`w-10 h-10 md:w-12 md:h-12 ${kpi.bg} ${kpi.color} rounded-xl md:rounded-2xl flex items-center justify-center mb-3 md:mb-4`}><Icon name={kpi.icon} size={24} fill /></div>
                                            <p className="text-[9px] md:text-[10px] font-bold text-[#5F6368] uppercase tracking-widest leading-tight mb-1">{kpi.label}</p>
                                            <p className="text-2xl md:text-3xl font-black text-[#202124] tracking-tight">{kpi.val}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="mt-6 md:mt-12 fade-in-up" style={{ animationDelay: '200ms' }}>
                                    <h3 className="text-lg md:text-xl font-bold tracking-tight text-[#202124] mb-4 md:mb-6 flex items-center gap-2"><Icon name="pie_chart" size={24} className="text-[#1a73e8]" fill /> Análisis Detallado por Categorías</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-6">
                                        {stats.categoryStats.map((cat, idx) => (
                                            <div key={idx} onClick={() => { setView('inventory'); resetNav(); setNavPath({ category: cat.name, subcategory: null, itemId: null }); triggerHaptic(); }} className={`bg-white p-4 md:p-8 rounded-[24px] md:rounded-[32px] border cursor-pointer hover:shadow-lg transition-all group nav-card ${cat.outOfStock > 0 ? 'border-red-300' : cat.critical > 0 ? 'border-amber-300' : 'border-[#E0E0E0]'}`}>
                                                <div className="flex justify-between items-start mb-4">
                                                    <div className={`w-12 h-12 md:w-14 md:h-14 rounded-xl md:rounded-[20px] flex items-center justify-center transition-transform group-hover:scale-110 shrink-0 ${cat.outOfStock > 0 ? 'bg-red-50 text-red-600' : cat.critical > 0 ? 'bg-amber-50 text-amber-600' : 'bg-[#E8F0FE] text-[#1a73e8]'}`}><Icon name={getItemIcon(cat.name)} size={28} fill /></div>
                                                    <div className="flex flex-col gap-1 items-end ml-3">
                                                        {cat.outOfStock > 0 && <span className="bg-red-600 text-white px-2 py-1 rounded-[10px] text-[9px] font-black animate-pulse flex items-center gap-1 shadow-sm"><Icon name="error" size={12} fill /> {cat.outOfStock} AGOTADOS</span>}
                                                        {cat.critical > 0 && <span className="bg-amber-100 text-amber-700 px-2 py-1 rounded-[10px] text-[9px] font-black flex items-center gap-1"><Icon name="warning" size={12} fill /> {cat.critical} CRÍTICOS</span>}
                                                    </div>
                                                </div>
                                                <h4 className="text-base md:text-xl font-bold text-[#202124] group-hover:text-blue-600 transition-colors line-clamp-1">{cat.name}</h4>
                                                <div className="mt-3 md:mt-4 flex items-center justify-between border-t border-[#F1F3F4] pt-3 md:pt-4"><p className="text-[11px] md:text-xs text-[#5F6368] font-medium">{cat.total} ítems</p><p className="text-[10px] font-bold text-[#1a73e8] flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">Ver detalle <Icon name="arrow_forward" size={14} /></p></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {/* BUSCADOR */}
                        {view === 'inventory' && (
                            <div className="space-y-6 fade-in-up pb-6">
                                <div className="bg-white p-4 md:p-6 rounded-[32px] border border-[#E0E0E0] shadow-sm flex items-center gap-4 focus-within:ring-4 focus-within:ring-blue-100 transition-all">
                                    <Icon name="search" size={28} className="text-[#5F6368]" />
                                    <input type="text" placeholder="¿Qué estás buscando? (café, cajas, etiquetas...)" value={searchTerm} onChange={e => {setSearchTerm(e.target.value); if(e.target.value) resetNav();}} className="w-full bg-transparent text-xl font-medium outline-none placeholder-[#BDC1C6]" />
                                </div>

                                <div className="flex items-center gap-2 overflow-x-auto no-scrollbar py-2">
                                    <button onClick={() => { resetNav(); triggerHaptic(); }} className={`px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap flex items-center gap-1.5 transition-all ${!navPath.category ? 'bg-[#1a73e8] text-white shadow-md shadow-blue-200' : 'bg-white border border-[#E0E0E0] text-[#5F6368]'}`}><Icon name="search" size={16} fill={!navPath.category} /> Buscador</button>
                                    {navPath.category && <><Icon name="chevron_right" size={18} className="text-[#BDC1C6] shrink-0" /><button onClick={() => { setNavPath({...navPath, subcategory:null, itemId:null}); triggerHaptic(); }} className={`px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap flex items-center gap-1.5 transition-all ${!navPath.subcategory ? 'bg-[#1a73e8] text-white shadow-md shadow-blue-200' : 'bg-white border border-[#E0E0E0] text-[#5F6368]'}`}><Icon name={getItemIcon(navPath.category)} size={16} fill={!navPath.subcategory} /> {navPath.category}</button></>}
                                    {navPath.subcategory && <><Icon name="chevron_right" size={18} className="text-[#BDC1C6] shrink-0" /><button onClick={() => { setNavPath({...navPath, itemId:null}); triggerHaptic(); }} className="px-5 py-2.5 bg-[#1a73e8] text-white rounded-full text-xs font-bold uppercase shadow-md flex items-center gap-1.5 shadow-blue-100"><Icon name="folder_open" size={16} fill /> {navPath.subcategory}</button></>}
                                </div>

                                <div className="grid grid-cols-1 gap-4">
                                    {/* Nivel: Categorías (CON DISEÑO V2.2 Y MÉTRICAS) */}
                                    {navigationData.level === 'categories' && navigationData.items.map((item, idx) => (
                                        <div key={idx} onClick={() => { setNavPath({ ...navPath, category: item.name }); triggerHaptic(); }} className={`bg-white p-6 rounded-[32px] border transition-all flex items-center justify-between cursor-pointer hover:shadow-lg nav-card group fade-in-up ${item.out > 0 ? 'border-red-300' : item.critical > 0 ? 'border-amber-300' : 'border-[#E0E0E0]'}`} style={{ animationDelay: `${idx * 40}ms` }}>
                                            <div className="flex items-center gap-4">
                                                <div className={`w-14 h-14 rounded-2xl flex items-center justify-center transition-transform group-hover:scale-105 ${item.out > 0 ? 'bg-red-50 text-red-600' : item.critical > 0 ? 'bg-amber-50 text-amber-600' : 'bg-[#E8F0FE] text-[#1a73e8]'}`}>
                                                    <Icon name={getItemIcon(item.name)} size={28} fill />
                                                </div>
                                                <div className="text-left">
                                                    <h4 className="text-lg font-bold text-[#202124]">{item.name}</h4>
                                                    <div className="flex items-center flex-wrap gap-x-2 mt-1">
                                                        <span className="text-xs font-medium text-[#5F6368]">{item.count} ítems</span>
                                                        {item.out > 0 && <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded-lg text-[10px] font-black">Agotados: {item.out}</span>}
                                                        {item.critical > 0 && <span className="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-lg text-[10px] font-black">Críticos: {item.critical}</span>}
                                                    </div>
                                                </div>
                                            </div>
                                            <Icon name="chevron_right" className="text-[#BDC1C6] group-hover:text-blue-600 transition-colors" />
                                        </div>
                                    ))}

                                    {/* Nivel: Subcategorías (Formato Compacto) */}
                                    {navigationData.level === 'subcategories' && navigationData.items.map((sub, idx) => (
                                        <div key={idx} onClick={() => { setNavPath({ ...navPath, subcategory: sub.name }); triggerHaptic(); }} className={`bg-white p-4 md:p-5 rounded-[28px] border ${sub.out > 0 ? 'border-red-300' : sub.critical > 0 ? 'border-amber-300' : 'border-[#E0E0E0]'} flex items-center justify-between cursor-pointer hover:shadow-md transition-all nav-card group fade-in-up`} style={{ animationDelay: `${idx * 40}ms` }}>
                                            <div className="flex items-center gap-4">
                                                <div className={`w-12 h-12 rounded-xl flex items-center justify-center transition-transform group-hover:scale-105 ${sub.out > 0 ? 'bg-red-50 text-red-600' : sub.critical > 0 ? 'bg-amber-50 text-amber-600' : 'bg-gray-50 text-[#5F6368]'}`}>
                                                    <Icon name={getItemIcon(navPath.category)} size={24} fill />
                                                </div>
                                                <div className="text-left">
                                                    <h4 className="text-base font-bold text-[#202124] leading-tight">{sub.name}</h4>
                                                    <div className="flex items-center flex-wrap gap-x-2 mt-1">
                                                        <span className="text-[11px] font-medium text-[#5F6368]">{sub.count} ítems</span>
                                                        {sub.out > 0 && <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded-md text-[9px] font-bold">Agotados: {sub.out}</span>}
                                                        {sub.critical > 0 && <span className="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-md text-[9px] font-bold">Críticos: {sub.critical}</span>}
                                                    </div>
                                                </div>
                                            </div>
                                            <Icon name="chevron_right" className="text-[#BDC1C6] group-hover:text-blue-600 transition-colors" />
                                        </div>
                                    ))}

                                    {/* Nivel: Ítems Finales */}
                                    {(navigationData.level === 'items' || navigationData.level === 'search') && navigationData.items.map((m, idx) => {
                                        const isOut = (parseFloat(m.stock) || 0) <= 0; const isCrit = m.stock <= m.minimo && m.stock > 0;
                                        return (
                                            <div key={m.id} onClick={() => { handleItemClick(m); }} className={`gpu-accelerated bg-white p-5 md:p-6 rounded-[32px] md:rounded-[40px] border flex flex-col md:flex-row md:items-center justify-between gap-4 transition-all cursor-pointer hover:shadow-xl group nav-card fade-in-up ${isOut ? 'border-red-300 bg-red-50/10' : isCrit ? 'border-amber-300' : 'border-[#E0E0E0]'}`} style={{ animationDelay: `${idx * 40}ms` }}>
                                                <div className="flex items-center gap-5"><div className={`shrink-0 w-14 h-14 md:w-16 md:h-16 rounded-2xl flex items-center justify-center transition-transform group-hover:scale-105 ${isOut ? 'bg-red-600 text-white shadow-lg shadow-red-200' : isCrit ? 'bg-amber-100 text-amber-600' : 'bg-[#E8F0FE] text-[#1a73e8]'}`}><Icon name={getItemIcon(m.categoria, m.subcategoria, m.nombre)} size={32} fill /></div><div><p className="text-[10px] font-black text-[#5F6368] uppercase tracking-widest mb-0.5">{m.subcategoria || 'General'}</p><h4 className={`text-lg md:text-xl font-bold tracking-tight line-clamp-1 ${isOut ? 'text-red-700' : 'text-[#202124]'}`}>{m.nombre}</h4><p className="text-[11px] text-[#1a73e8] font-bold mt-0.5 flex items-center gap-1">Ficha detallada <Icon name="arrow_forward" size={14} /></p></div></div>
                                                <div className="flex items-center gap-6 px-2 border-t md:border-t-0 pt-4 md:pt-0 border-[#F1F3F4] justify-between md:justify-end w-full md:w-auto"><div className="text-left md:text-center"><p className="text-[9px] font-black text-[#5F6368] uppercase tracking-widest mb-1">Existencias</p><p className={`text-2xl md:text-3xl font-black tracking-tighter ${isOut ? 'text-red-600' : isCrit ? 'text-amber-600' : 'text-[#202124]'}`}>{parseFloat(m.stock).toLocaleString()} <span className="text-[10px] font-bold text-[#5F6368] lowercase">{m.unidad}</span></p></div><div className="text-right md:text-center"><p className="text-[9px] font-black text-[#5F6368] uppercase tracking-widest mb-1">Alcance</p><p className={`text-xl md:text-2xl font-black ${isOut ? 'text-red-300' : 'text-[#1a73e8]'}`}>{isOut ? '0' : stats.getDaysLeft(m.id, m.stock)} <span className="text-[10px] font-bold text-[#5F6368] lowercase">días</span></p></div></div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* DETALLE TÉCNICO */}
                        {navigationData.level === 'detail' && navigationData.item && (
                            <div className="space-y-6 fade-in-up">
                                <button onClick={() => setNavPath({ ...navPath, itemId: null })} className="flex items-center gap-2 text-[#5F6368] font-bold hover:text-blue-600 transition-all mb-2"><Icon name="arrow_back" size={20} /> Regresar al directorio</button>
                                <div className="bg-white p-8 md:p-12 rounded-[40px] md:rounded-[48px] border border-[#E0E0E0] shadow-sm">
                                    <div className="flex flex-col md:flex-row md:items-start justify-between gap-8">
                                        <div className="flex items-center gap-6"><div className={`w-20 h-20 md:w-24 md:h-24 rounded-[28px] md:rounded-[32px] flex items-center justify-center shrink-0 ${parseFloat(navigationData.item.stock) <= 0 ? 'bg-red-600 text-white shadow-xl shadow-red-200' : 'bg-[#1a73e8] text-white shadow-xl shadow-blue-200'}`}><Icon name={getItemIcon(navigationData.item.categoria, navigationData.item.subcategoria, navigationData.item.nombre)} size={44} fill /></div><div><p className="text-xs font-bold text-[#5F6368] uppercase tracking-widest mb-1 md:mb-2">{navigationData.item.categoria} / {navigationData.item.subcategoria || 'General'}</p><h3 className="text-3xl md:text-4xl font-black tracking-tighter uppercase text-[#202124] leading-tight mb-3">{navigationData.item.nombre}</h3><div className="flex gap-2"><span className="bg-[#F1F3F4] text-[#5F6368] px-3 py-1.5 rounded-xl text-[10px] font-bold uppercase tracking-wider">Cód: {navigationData.item.id}</span><span className="bg-[#F1F3F4] text-[#5F6368] px-3 py-1.5 rounded-xl text-[10px] font-bold uppercase tracking-wider">Mínimo: {navigationData.item.minimo} {navigationData.item.unidad}</span></div></div></div>
                                        <div className="flex gap-4 w-full md:w-auto mt-4 md:mt-0"><button onClick={() => { setSelectedMaterial(navigationData.item); setModalType('IN'); triggerHaptic(); }} className="action-button flex-1 md:flex-none flex flex-col items-center justify-center gap-2 p-5 bg-blue-50 text-blue-600 rounded-[28px] hover:bg-blue-600 hover:text-white transition-all min-w-[100px]"><Icon name="add_circle" size={28} fill /><span className="text-[10px] font-black uppercase text-center">Entrada</span></button><button disabled={parseFloat(navigationData.item.stock) <= 0} onClick={() => { setSelectedMaterial(navigationData.item); setModalType('OUT'); triggerHaptic(); }} className={`action-button flex-1 md:flex-none flex flex-col items-center justify-center gap-2 p-5 rounded-[28px] transition-all min-w-[100px] ${parseFloat(navigationData.item.stock) <= 0 ? 'bg-[#F1F3F4] text-[#BDC1C6]' : 'bg-red-50 text-red-600 hover:bg-red-600 hover:text-white'}`}><Icon name="remove_circle" size={28} fill /><span className="text-[10px] font-black uppercase text-center">Salida</span></button><button onClick={() => { setSelectedMaterial(navigationData.item); setModalType('ADJUST'); triggerHaptic(); }} className="action-button flex-1 md:flex-none flex flex-col items-center justify-center gap-2 p-5 bg-[#F1F3F4] text-[#5F6368] rounded-[28px] hover:bg-[#5F6368] hover:text-white transition-all min-w-[100px]"><Icon name="tune" size={28} fill /><span className="text-[10px] font-black uppercase text-center">Ajustar</span></button></div>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 mt-10 border-t border-[#F1F3F4] pt-10"><div className="bg-[#F8F9FA] p-6 md:p-8 rounded-[32px]"><p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest mb-2 ml-1">Existencias</p><div className={`flex items-baseline gap-1.5 ${parseFloat(navigationData.item.stock) <= 0 ? 'text-red-600' : 'text-blue-600'}`}><span className="text-4xl md:text-5xl font-black tracking-tight">{parseFloat(navigationData.item.stock).toLocaleString()}</span><span className="text-sm md:text-base font-bold text-[#5F6368] lowercase">{navigationData.item.unidad}</span></div></div><div className="bg-[#F8F9FA] p-6 md:p-8 rounded-[32px]"><p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest mb-2 ml-1">Alcance Estimado</p><div className="flex items-baseline gap-1.5 text-[#202124]"><span className="text-4xl md:text-5xl font-black tracking-tight">{stats.getDaysLeft(navigationData.item.id, navigationData.item.stock)}</span><span className="text-sm md:text-base font-bold text-[#5F6368] lowercase">días</span></div></div><div className="col-span-2 md:col-span-1 bg-[#F8F9FA] p-6 md:p-8 rounded-[32px] flex items-center gap-5"><Icon name={parseFloat(navigationData.item.stock) <= 0 ? 'error' : parseFloat(navigationData.item.stock) <= parseFloat(navigationData.item.minimo) ? 'warning' : 'check_circle'} size={48} fill className={parseFloat(navigationData.item.stock) <= 0 ? 'text-red-600' : parseFloat(navigationData.item.stock) <= parseFloat(navigationData.item.minimo) ? 'text-amber-600' : 'text-green-600'} /><div><p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest mb-1">Estado</p><p className="text-xl font-bold uppercase tracking-tight text-[#202124]">{parseFloat(navigationData.item.stock) <= 0 ? 'Sin Stock' : parseFloat(navigationData.item.stock) <= parseFloat(navigationData.item.minimo) ? 'Crítico' : 'Óptimo'}</p></div></div></div>
                                </div>
                            </div>
                        )}

                        {/* HISTORIAL */}
                        {view === 'history' && (
                            <div className="bg-white rounded-[40px] border border-[#E0E0E0] overflow-hidden shadow-sm fade-in-up mt-4">
                                <div className="p-6 md:p-8 border-b border-[#F1F3F4] flex flex-col md:flex-row md:items-center justify-between gap-4"><div className="flex items-center gap-3"><Icon name="history" className="text-[#1a73e8]" size={28} fill /><h3 className="text-2xl font-bold tracking-tight text-[#202124]">Bitácora Global</h3></div><div className="flex items-center gap-2"><button onClick={() => setShowFilters(!showFilters)} className={`action-button px-4 py-2.5 rounded-2xl flex items-center gap-2 text-sm font-bold transition-colors ${showFilters ? 'bg-blue-50 text-blue-600' : 'bg-[#F8F9FA] text-[#5F6368]'}`}><Icon name="filter_list" size={20} /> Filtros</button><button onClick={() => fetchData()} className="action-button p-2.5 bg-[#F8F9FA] text-[#5F6368] rounded-2xl"><Icon name="sync" size={20} spin={isSyncing} /></button></div></div>
                                {showFilters && (
                                    <div className="p-6 md:p-8 bg-[#F8F9FA] border-b border-[#F1F3F4] grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 fade-in-up"><div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Operador</label><select value={historyFilters.user} onChange={e => setHistoryFilters({...historyFilters, user: e.target.value})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-3 text-sm font-medium outline-none appearance-none cursor-pointer"><option value="">Todos</option>{historyData.uniqueUsers.map(u => <option key={u} value={u}>{u}</option>)}</select></div><div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Categoría</label><select value={historyFilters.category} onChange={e => setHistoryFilters({...historyFilters, category: e.target.value, subcategory: ''})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-3 text-sm font-medium outline-none appearance-none cursor-pointer"><option value="">Todas</option>{historyData.uniqueCategories.map(c => <option key={c} value={c}>{c}</option>)}</select></div><div className="sm:col-span-2 lg:col-span-1 flex justify-end items-end"><button onClick={() => { setHistoryFilters({ user: '', dateStart: '', dateEnd: '', category: '', subcategory: '', sort: 'date_desc' }); triggerHaptic(); }} className="text-red-600 hover:bg-red-50 px-5 py-3 rounded-xl text-xs font-bold transition-all uppercase tracking-wider w-full lg:w-auto">Limpiar Filtros</button></div></div>
                                )}
                                <div className="overflow-x-auto no-scrollbar"><table className="w-full text-left"><thead className="bg-[#F8F9FA] text-[#5F6368] text-xs font-bold uppercase tracking-widest border-b"><tr><th className="px-6 md:px-8 py-4">Fecha / Operador</th><th className="px-6 md:px-8 py-4">Tipo</th><th className="px-6 md:px-8 py-4">Material</th><th className="px-6 md:px-8 py-4 text-right">Variación / Saldo</th></tr></thead><tbody className="divide-y">{historyData.movs.slice(0, 200).map((m, i) => (<tr key={i} className="hover:bg-[#F8F9FA] transition-colors"><td className="px-6 md:px-8 py-5"><p className="text-sm font-bold text-[#202124] whitespace-nowrap">{new Date(m.timestamp).toLocaleDateString()} <span className="text-xs font-medium text-[#5F6368]">{new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></p><p className="text-[10px] uppercase font-bold text-[#5F6368] mt-1">{m.usuario}</p></td><td className="px-6 md:px-8 py-5"><span className={`px-3 py-1.5 rounded-xl text-[10px] font-black inline-flex items-center gap-1 ${m.tipo === 'IN' ? 'bg-green-100 text-green-700' : m.tipo === 'OUT' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>{m.tipo}</span></td><td className="px-6 md:px-8 py-5"><p className="text-sm font-bold text-[#202124]">{m.item_nombre}</p><p className="text-[10px] font-bold text-[#5F6368] mt-1 uppercase tracking-widest">{m.categoria_real}</p></td><td className="px-6 md:px-8 py-5 text-right"><p className={`text-sm font-bold mb-1 ${parseFloat(m.diferencia) < 0 ? 'text-red-600' : 'text-green-600'}`}>{parseFloat(m.diferencia) > 0 ? '+' : ''}{m.diferencia}</p><p className="font-black text-[#202124] text-xs bg-[#E0E0E0]/30 inline-block px-2 py-1 rounded-lg">= {m.stock_nuevo}</p></td></tr>))}</tbody></table></div>
                            </div>
                        )}
                    </main>

                    <nav className="no-print lg:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#E0E0E0] px-2 py-3 pb-8 z-40 flex justify-around items-center rounded-t-[32px] shadow-2xl">
                        {navItems.map(item => (
                            <button key={item.id} onClick={() => { setView(item.id); resetNav(); setSearchTerm(''); triggerHaptic(); }} className={`flex flex-col items-center gap-1.5 p-1 flex-1 transition-transform active:scale-90 ${view === item.id ? 'text-[#1a73e8]' : 'text-[#BDC1C6]'}`}><div className={`p-2.5 px-4 rounded-[20px] transition-colors ${view === item.id ? 'bg-[#E8F0FE]' : ''}`}><Icon name={item.icon} size={24} fill={view === item.id} /></div><span className="text-[9px] font-black uppercase tracking-widest">{item.label}</span></button>
                        ))}
                    </nav>

                    <div className={`fixed inset-0 z-[100] flex items-center justify-center p-6 transition-opacity duration-200 ${modalType ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                        <div className="absolute inset-0 bg-[#202124]/40 backdrop-blur-md" onClick={() => !isSaving && setModalType(null)}></div>
                        <div className={`bg-white w-full max-w-sm rounded-[40px] shadow-2xl z-10 overflow-hidden gpu-accelerated transition-transform duration-300 ${modalType ? 'scale-100 translate-y-0' : 'scale-95 translate-y-10'}`}>
                            <div className={`p-8 text-white ${modalType === 'IN' ? 'bg-green-600' : modalType === 'OUT' ? 'bg-red-600' : 'bg-gray-800'}`}><div className="flex justify-between items-start"><div><p className="text-[10px] font-black uppercase tracking-widest opacity-80 mb-1">Registro de {modalType}</p><h3 className="text-2xl font-bold leading-tight">{selectedMaterial?.nombre}</h3></div><div className="p-3 bg-white/20 rounded-2xl"><Icon name={modalType === 'IN' ? 'add_circle' : modalType === 'OUT' ? 'remove_circle' : 'tune'} size={32} fill /></div></div></div>
                            <form className="p-8 space-y-6" onSubmit={handleTransaction}>
                                <div className="space-y-2"><label className="text-xs font-bold text-[#5F6368] uppercase ml-1">Cantidad ({selectedMaterial?.unidad})</label><input required name="cantidad" type="number" step="0.01" className="w-full px-6 py-5 bg-[#F1F3F4] rounded-3xl outline-none text-2xl font-black text-[#202124] focus:ring-4 focus:ring-blue-100 transition-all" placeholder="0" autoFocus /></div>
                                <div className="space-y-2"><label className="text-xs font-bold text-[#5F6368] uppercase ml-1">Comentario</label><input name="nota" className="w-full px-6 py-4 bg-[#F1F3F4] rounded-2xl outline-none text-sm font-medium text-[#202124] focus:ring-4 focus:ring-blue-100 transition-all" placeholder="Escribir nota..." /></div>
                                <div className="flex gap-4 pt-4"><button type="button" disabled={isSaving} onClick={() => setModalType(null)} className="action-button flex-1 py-4 font-bold text-[#5F6368] bg-[#F8F9FA] hover:bg-[#E0E0E0] rounded-2xl">Cancelar</button><button disabled={isSaving} className="action-button flex-[2] py-4 bg-[#1a73e8] text-white rounded-3xl font-bold shadow-xl shadow-blue-100 flex items-center justify-center gap-2 hover:bg-[#1557b0] transition-colors">{isSaving ? <Icon name="sync" size={20} spin /> : 'Confirmar'}</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
