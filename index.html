<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawas Coffee - Control de Stock</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a73e8'/%3E%3Ctext x='50' y='75' font-family='Arial, sans-serif' font-size='72' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
    
    <script>
        window.addEventListener('error', function(event) {
            var root = document.getElementById('root');
            if(root) {
                root.innerHTML = '<div style="padding:30px; font-family:sans-serif; color:#d93025; background:#fce8e6; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;"><h2>⚠️ Error de Sistema</h2><p>Ocurrió un problema procesando los datos.</p><p style="font-size:11px; margin-top:10px; color:#5F6368;">' + event.message + '</p><button onclick="window.location.reload()" style="margin-top:25px; padding:12px 24px; background:#d93025; color:white; border:none; border-radius:24px; font-weight:bold; cursor:pointer;">Recargar Aplicación</button></div>';
            }
        });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            margin: 0;
            overflow-x: hidden;
            color: #202124;
            -webkit-tap-highlight-color: transparent;
        }

        /* Tipografía de Íconos Google */
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            white-space: nowrap;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Aceleración de GPU */
        .gpu-accelerated { transform: translateZ(0); will-change: transform, opacity; }
        
        /* Animaciones Interfaz Suave */
        .nav-card:active { transform: scale(0.96); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        .action-button:active { transform: scale(0.88); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translate3d(0, 15px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }

        /* ESTILOS DE IMPRESIÓN */
        @media print {
            @page { margin: 10mm; size: auto; }
            body { background-color: white !important; }
            .no-print, aside, header, nav, .action-button, .search-bar { display: none !important; }
            main { margin: 0 !important; padding: 0 !important; }
            .report-container { box-shadow: none !important; border: none !important; border-radius: 0 !important; padding: 0 !important; }
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
            .print-badge-red { background-color: #fce8e6 !important; color: #d93025 !important; border: 1px solid #d93025; }
            .print-badge-amber { background-color: #fef7e0 !important; color: #e37400 !important; border: 1px solid #e37400; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#1a73e8;font-family:sans-serif;">
            <div style="width:44px;height:44px;border:4px solid #E8F0FE;border-top:4px solid #1a73e8;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            <p style="margin-top:20px;font-weight:700;font-size:1.1rem;letter-spacing:-0.5px;">Iniciando Kawas Stock...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useDeferredValue, memo } = React;

        // --- COMPONENTE ICONO MATERIAL SYMBOLS ("LEAN & SLEEK") ---
        const Icon = memo(({ name, size = 24, className = "", spin = false, fill = false }) => {
            return (
                <span 
                    className={`material-symbols-rounded ${className} ${spin ? 'animate-spin-custom' : ''} gpu-accelerated select-none`}
                    style={{ 
                        fontSize: size, 
                        // Redujimos el wght a 300 para un look minimalista, fino y elegante (Lean & Sleek)
                        fontVariationSettings: `'FILL' ${fill ? 1 : 0}, 'wght' 300, 'GRAD' 0, 'opsz' 24` 
                    }}
                >
                    {name}
                </span>
            );
        });

        // --- INTELIGENCIA DE ÍCONOS (CATEGORÍAS, SUBCATEGORÍAS E ÍTEMS) ---
        const getItemIcon = (categoria = '', subcategoria = '', nombre = '') => {
            const text = `${categoria} ${subcategoria} ${nombre}`.toLowerCase();
            
            // PRIORIDAD 1: EMPAQUES Y CONTENEDORES
            // (Evita que "Bolsa de Café" tome el ícono de taza en lugar del de bolsa)
            
            // 1. Vasos y Contenedores de Bebida
            if (text.includes('vaso') || text.includes('copa') || text.includes('mug') || text.includes('taza') || text.includes('botella')) return 'local_drink'; // Vaso con bombilla (Sleek)
            
            // 2. Tapas, Bombillas y Desechables
            if (text.includes('tapa') || text.includes('bombilla') || text.includes('pajilla') || text.includes('fajilla') || text.includes('manga') || text.includes('revolvedor') || text.includes('servilleta') || text.includes('porta')) return 'takeout_dining';
            
            // 3. Bolsas (Soluciona "Bolsas de café")
            if (text.includes('bolsa')) return 'shopping_bag';
            
            // 4. Cajas y Empaques de Cartón
            if (text.includes('caja') || text.includes('carton') || text.includes('cartón') || text.includes('empaque') || text.includes('packaging')) return 'inventory_2'; // Caja de cartón elegante
            
            // 5. Equipamiento y Repuestos
            if (text.includes('equipo') || text.includes('maquina') || text.includes('repuesto') || text.includes('filtro') || text.includes('herramienta') || text.includes('mantenimiento')) return 'handyman';
            
            // 6. Limpieza y Aseo
            if (text.includes('limpieza') || text.includes('aseo') || text.includes('cloro') || text.includes('detergente') || text.includes('jabon') || text.includes('jabón') || text.includes('basura') || text.includes('esponja') || text.includes('sanitizante') || text.includes('paño')) return 'sanitizer'; // Botella de spray (Minimalista)
            
            // 7. Merchandising
            if (text.includes('merchandising') || text.includes('ropa') || text.includes('polera') || text.includes('jockey') || text.includes('delantal') || text.includes('tote')) return 'checkroom'; // Percha de ropa elegante
            
            // 8. Etiquetas y Adhesivos
            if (text.includes('etiqueta') || text.includes('adhesivo') || text.includes('sticker')) return 'label'; // Ícono de etiqueta (tag)
            
            // 9. Papelería y Oficina
            if (text.includes('papel') || text.includes('oficina') || text.includes('boleta') || text.includes('impresora') || text.includes('tinta') || text.includes('rollo') || text.includes('termico')) return 'receipt_long'; // Ticket / Boleta

            // PRIORIDAD 2: INGREDIENTES Y ALIMENTOS
            
            // 10. Café, Granos y Espresso
            if (text.includes('café') || text.includes('cafe') || text.includes('grano') || text.includes('espresso') || text.includes('decaf')) return 'coffee';
            
            // 11. Té, Matcha, Infusiones
            if (text.includes('té') || text.includes('te ') || text.includes('matcha') || text.includes('chai') || text.includes('infusión') || text.includes('hoja')) return 'emoji_food_beverage';
            
            // 11. Leches y Lácteos (Animal o Vegetal)
            if (text.includes('leche') || text.includes('lacteo') || text.includes('lácteo') || text.includes('avena') || text.includes('almendra') || text.includes('soya') || text.includes('entera') || text.includes('descremada')) return 'water_drop';
            
            // 12. Siropes, Salsas y Saborizantes
            if (text.includes('sirope') || text.includes('jarabe') || text.includes('salsa') || text.includes('esencia') || text.includes('saborizante') || text.includes('vainilla') || text.includes('caramelo') || text.includes('avellana') || text.includes('puré')) return 'liquor'; // Botella estilo sirope
            
            // 13. Hielo y Bebidas Frías
            if (text.includes('hielo') || text.includes('cold') || text.includes('frio') || text.includes('frío') || text.includes('frappe')) return 'ac_unit'; // Copo de nieve elegante
            
            // 14. Azúcar, Endulzantes y Polvos
            if (text.includes('azucar') || text.includes('azúcar') || text.includes('endulzante') || text.includes('stevia') || text.includes('cacao') || text.includes('canela') || text.includes('polvo')) return 'grain'; // Partículas/Polvo
            
            // 15. Pastelería y Comida
            if (text.includes('pasteleria') || text.includes('comida') || text.includes('alimento') || text.includes('galleta') || text.includes('pan') || text.includes('croissant') || text.includes('muffin') || text.includes('torta') || text.includes('postre') || text.includes('sandwich')) return 'bakery_dining';
            
            // Por defecto (Caja minimalista cerrada)
            return 'package_2'; 
        };

        // --- CONFIGURACIÓN BACKEND ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbye0BCOskWfd-jep9i605zmPGM0VLS3XYphKeHiYkKOSAWK8Jzwx0U7LnCLeVqJgjqohg/exec";

        const App = () => {
            // --- ESTADOS ---
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(null);
            const [pin, setPin] = useState('');
            const [data, setData] = useState({ materiales: [], movimientos: [], usuarios: [] });
            const [loginInfo, setLoginInfo] = useState(null);
            
            const [searchTerm, setSearchTerm] = useState('');
            const deferredSearchTerm = useDeferredValue(searchTerm); 
            
            const [isSyncing, setIsSyncing] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [syncError, setSyncError] = useState(null);
            
            const [modalType, setModalType] = useState(null); 
            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [navPath, setNavPath] = useState({ category: null, subcategory: null, itemId: null });

            // Nuevos estados para filtros del historial
            const [historyFilters, setHistoryFilters] = useState({ user: '', dateStart: '', dateEnd: '', category: '', subcategory: '', sort: 'date_desc' });
            const [showFilters, setShowFilters] = useState(false);

            const triggerHaptic = useCallback(() => {
                if ('vibrate' in navigator) navigator.vibrate([15, 30, 15]);
            }, []);

            // --- LÓGICA DE RED ---
            const fetchData = useCallback(async () => {
                if (!SCRIPT_URL) return;
                setIsSyncing(true);
                setSyncError(null);
                try {
                    const response = await fetch(SCRIPT_URL, { redirect: "follow" });
                    if (!response.ok) throw new Error(`Google Apps Script rechazó la conexión (Código ${response.status}).`);
                    const textResponse = await response.text();
                    try {
                        const json = JSON.parse(textResponse);
                        if (json && json.materiales) setData(json);
                    } catch (err) { throw new Error("Los datos recibidos no tienen un formato válido."); }
                } catch (e) {
                    console.error("Error en sincronización:", e);
                    setSyncError(e.message);
                } finally {
                    setIsSyncing(false);
                }
            }, []);

            useEffect(() => {
                fetchData();
            }, [fetchData]);

            // --- LÓGICA DE LOGIN ---
            const attemptLogin = useCallback((currentPin) => {
                if (data.materiales.length === 0) return; 
                const validUser = (data.usuarios || []).find(u => u.pin == currentPin) || (currentPin === "1234" ? { nombre: "Admin Kawas", rol: "Administrador" } : null);
                
                if (validUser) {
                    setUser(validUser);
                    setLoginInfo({
                        date: new Date().toLocaleDateString(),
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        version: "v2.3"
                    });
                    setView('dashboard');
                    triggerHaptic();
                } else if (currentPin.length === 4) {
                    setPin('');
                    alert("PIN incorrecto. Intente nuevamente.");
                    triggerHaptic();
                }
            }, [data, triggerHaptic]);

            useEffect(() => {
                if (pin.length === 4 && data.materiales.length > 0 && view === 'login') {
                    attemptLogin(pin);
                }
            }, [data.materiales.length, pin, view, attemptLogin]);

            const handlePinChange = (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                setPin(val);
                if (val.length === 4) {
                    setTimeout(() => attemptLogin(val), 100);
                }
            };

            // --- LÓGICA DE MOVIMIENTOS (OPTIMISTIC UI) ---
            const handleTransaction = async (e) => {
                e.preventDefault();
                const qty = parseFloat(e.target.cantidad.value);
                const nota = e.target.nota.value;
                const matId = selectedMaterial.id;

                setModalType(null);
                triggerHaptic();
                setIsSaving(true);

                let nuevoStock = parseFloat(selectedMaterial.stock) || 0;
                if (modalType === 'IN') nuevoStock += qty;
                if (modalType === 'OUT') nuevoStock -= qty;
                if (modalType === 'ADJUST') nuevoStock = qty;

                setData(prev => ({
                    ...prev,
                    materiales: prev.materiales.map(m => m.id === matId ? { ...m, stock: nuevoStock } : m),
                    movimientos: [...prev.movimientos, {
                        timestamp: new Date().toISOString(), usuario: user.nombre, tipo: modalType,
                        item_id: matId, item_nombre: selectedMaterial.nombre, cantidad: qty,
                        stock_nuevo: nuevoStock, diferencia: modalType === 'IN' ? qty : modalType === 'OUT' ? -qty : (nuevoStock - (parseFloat(selectedMaterial.stock) || 0))
                    }]
                }));

                try {
                    await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'movimiento', usuario: user.nombre, tipo: modalType, materialId: matId, cantidad: qty, nota: nota }) });
                } catch (err) { console.error("Error guardando:", err); } 
                finally { setIsSaving(false); }
            };

            // --- ESTADÍSTICAS ---
            const stats = useMemo(() => {
                const materiales = data.materiales || [];
                const movimientos = data.movimientos || [];
                
                const totalItems = materiales.length;
                const criticalList = materiales.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0);
                const criticalItems = criticalList.length;
                
                const outOfStockList = materiales.filter(m => (parseFloat(m.stock) || 0) <= 0);
                const outOfStock = outOfStockList.length;

                const getDaysLeft = (materialId, currentStock) => {
                    const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                    const recentOuts = movimientos.filter(mov => mov.item_id == materialId && mov.tipo === 'OUT' && new Date(mov.timestamp) >= sevenDaysAgo);
                    const totalConsumed = recentOuts.reduce((acc, curr) => acc + Math.abs(parseFloat(curr.cantidad || 0)), 0);
                    return totalConsumed <= 0 ? '---' : Math.round(parseFloat(currentStock) / (totalConsumed / 7));
                };

                const groupedInventory = {};
                materiales.forEach(m => {
                    const cat = m.categoria || 'Sin Categoría'; const subcat = m.subcategoria || 'General';
                    if(!groupedInventory[cat]) groupedInventory[cat] = {};
                    if(!groupedInventory[cat][subcat]) groupedInventory[cat][subcat] = [];
                    groupedInventory[cat][subcat].push(m);
                });

                // Cálculo de Métricas Consolidadas por Categoría
                const categories = [...new Set(materiales.map(m => m.categoria || 'Sin Categoría'))];
                const categoryStats = categories.map(cat => {
                    const items = materiales.filter(m => (m.categoria || 'Sin Categoría') === cat);
                    return {
                        name: cat,
                        total: items.length,
                        critical: items.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0).length,
                        outOfStock: items.filter(m => (parseFloat(m.stock) || 0) <= 0).length
                    };
                }).sort((a, b) => b.total - a.total); // Ordena de mayor a menor cantidad de ítems

                return { totalItems, criticalItems, criticalList, outOfStock, outOfStockList, getDaysLeft, groupedInventory, categoryStats };
            }, [data]);

            const navigationData = useMemo(() => {
                const materiales = data.materiales || [];
                // Búsqueda Ultra-rápida (Deferred)
                if (deferredSearchTerm) return { level: 'search', items: materiales.filter(m => (m.nombre || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()) || (m.categoria || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()))};
                
                // Navegación Jerárquica
                if (!navPath.category) return { level: 'categories', items: [...new Set(materiales.map(m => m.categoria).filter(Boolean))].map(name => ({ name, count: materiales.filter(m => m.categoria === name).length, out: materiales.filter(m => m.categoria === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.subcategory) return { level: 'subcategories', items: [...new Set(materiales.filter(m => m.categoria === navPath.category).map(m => m.subcategoria || 'General'))].map(name => ({ name, count: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name).length, out: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.itemId) return { level: 'items', items: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === navPath.subcategory) };
                
                return { level: 'detail', item: materiales.find(m => m.id == navPath.itemId), movements: (data.movimientos || []).filter(mov => mov.item_id == navPath.itemId) };
            }, [data.materiales, navPath, deferredSearchTerm]);

            const resetNav = useCallback(() => setNavPath({ category: null, subcategory: null, itemId: null }), []);
            
            // --- LÓGICA DE CERRAR SESIÓN ---
            const handleLogout = useCallback(() => {
                setUser(null);
                setPin('');
                setLoginInfo(null);
                setView('login');
                triggerHaptic();
            }, [triggerHaptic]);

            // --- LÓGICA DE FILTROS Y ORDENAMIENTO (BITÁCORA) ---
            const historyData = useMemo(() => {
                let movs = [...(data.movimientos || [])];
                const matDict = {};
                (data.materiales || []).forEach(m => { matDict[m.id] = m; });
                
                // 1. Enriquecer los movimientos con datos de categoría y subcategoría
                movs = movs.map(m => ({
                    ...m,
                    subcategoria: matDict[m.item_id]?.subcategoria || 'General',
                    categoria_real: matDict[m.item_id]?.categoria || m.categoria || 'Sin Categoría'
                }));

                // 2. Aplicar Filtros
                if (historyFilters.user) movs = movs.filter(m => m.usuario === historyFilters.user);
                if (historyFilters.category) movs = movs.filter(m => m.categoria_real === historyFilters.category);
                if (historyFilters.subcategory) movs = movs.filter(m => m.subcategoria === historyFilters.subcategory);
                if (historyFilters.dateStart) {
                    const start = new Date(historyFilters.dateStart + "T00:00:00");
                    movs = movs.filter(m => new Date(m.timestamp) >= start);
                }
                if (historyFilters.dateEnd) {
                    const end = new Date(historyFilters.dateEnd + "T23:59:59");
                    movs = movs.filter(m => new Date(m.timestamp) <= end);
                }

                // 3. Ordenamiento Avanzado
                movs.sort((a, b) => {
                    if (historyFilters.sort === 'date_desc') return new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime();
                    if (historyFilters.sort === 'date_asc') return new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime();
                    if (historyFilters.sort === 'mat_asc') return (a.item_nombre || '').localeCompare(b.item_nombre || '');
                    if (historyFilters.sort === 'mat_desc') return (b.item_nombre || '').localeCompare(a.item_nombre || '');
                    if (historyFilters.sort === 'tipo_asc') return (a.tipo || '').localeCompare(b.tipo || '');
                    if (historyFilters.sort === 'tipo_desc') return (b.tipo || '').localeCompare(a.tipo || '');
                    return 0;
                });

                // 4. Listas únicas para los selectores (dropdowns)
                const uniqueUsers = [...new Set((data.movimientos || []).map(m => m.usuario).filter(Boolean))];
                const uniqueCategories = [...new Set((data.materiales || []).map(m => m.categoria).filter(Boolean))];
                let uniqueSubcategories = [];
                if (historyFilters.category) {
                    uniqueSubcategories = [...new Set((data.materiales || []).filter(m => m.categoria === historyFilters.category).map(m => m.subcategoria || 'General'))];
                } else {
                    uniqueSubcategories = [...new Set((data.materiales || []).map(m => m.subcategoria || 'General').filter(Boolean))];
                }

                return { movs, uniqueUsers, uniqueCategories, uniqueSubcategories };
            }, [data.movimientos, data.materiales, historyFilters]);

            const handleSort = useCallback((column) => {
                let newSort = '';
                
                // Lógica de alternancia (Toggle)
                if (column === 'date') {
                    newSort = historyFilters.sort === 'date_desc' ? 'date_asc' : 'date_desc';
                } else if (column === 'tipo') {
                    newSort = historyFilters.sort === 'tipo_asc' ? 'tipo_desc' : 'tipo_asc';
                } else if (column === 'mat') {
                    newSort = historyFilters.sort === 'mat_asc' ? 'mat_desc' : 'mat_asc';
                }
                
                // Actualizamos el estado global de filtros
                setHistoryFilters(prev => ({
                    ...prev,
                    sort: newSort
                }));
                
                // Confirmación táctil
                triggerHaptic();
            }, [historyFilters.sort, triggerHaptic]);

            // Función para manejar el clic en una tarjeta y asegurar que el buscador se limpie para ir al detalle
            const handleItemClick = useCallback((item) => {
                setNavPath({ category: item.categoria, subcategory: item.subcategoria || 'General', itemId: item.id });
                setSearchTerm(''); // LIMPIA EL BUSCADOR PARA PERMITIR ENTRAR AL DETALLE
                triggerHaptic();
            }, [triggerHaptic]);

            // --- VISTA DE LOGIN ---
            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#F8F9FA]">
                        <div className="w-full max-w-sm bg-white rounded-[40px] p-10 shadow-xl border border-[#E0E0E0] text-center gpu-accelerated">
                            {/* Se eliminó la clase 'rotate-3' para que el logo quede perfectamente recto */}
                            <div className="w-20 h-20 mx-auto mb-8 flex items-center justify-center">

                                                    <tr>
                                                        <th className="px-5 py-4 text-xs font-bold text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0]">Categoría</th>
                                                        <th className="px-5 py-4 text-xs font-bold text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0] text-center">Ítems Registrados</th>
                                                        <th className="px-5 py-4 text-xs font-bold text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0] text-center">En Riesgo (Críticos)</th>
                                                        <th className="px-5 py-4 text-xs font-bold text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0] text-center">Quiebre (Agotados)</th>
                                                        <th className="px-5 py-4 text-xs font-bold text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0] text-right">Salud General</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {stats.categoryStats.map((cat, i) => {
                                                        const health = Math.round(((cat.total - cat.outOfStock) / cat.total) * 100) || 0;
                                                        return (
                                                            <tr key={i} className="border-b border-[#F1F3F4]">
                                                                <td className="px-5 py-4">
                                                                    <div className="flex items-center gap-3">
                                                                        <Icon name={getItemIcon(cat.name)} size={20} className="text-[#5F6368]" />
                                                                        <span className="font-bold text-sm text-[#202124]">{cat.name}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="px-5 py-4 text-center font-bold text-[#5F6368]">{cat.total}</td>
                                                                <td className="px-5 py-4 text-center">
                                                                    {cat.critical > 0 ? <span className="text-amber-600 font-bold bg-amber-50 px-3 py-1 rounded-lg">{cat.critical}</span> : <span className="text-[#BDC1C6]">-</span>}
                                                                </td>
                                                                <td className="px-5 py-4 text-center">
                                                                    {cat.outOfStock > 0 ? <span className="text-red-600 font-black bg-red-50 px-3 py-1 rounded-lg">{cat.outOfStock}</span> : <span className="text-[#BDC1C6]">-</span>}
                                                                </td>
                                                                <td className="px-5 py-4 text-right">
                                                                    <span className={`font-black text-sm ${health < 50 ? 'text-red-600' : health < 80 ? 'text-amber-600' : 'text-green-600'}`}>
                                                                        {health}%
                                                                    </span>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    {/* NOTA VISUAL EN PANTALLA (NO SE IMPRIME) */}
                                    <div className="text-center p-6 bg-blue-50 border border-blue-100 text-blue-700 rounded-3xl mt-8 font-medium text-sm no-print flex flex-col items-center gap-2">
                                        <Icon name="picture_as_pdf" size={28} />
                                        <p>El detalle completo del inventario y los materiales críticos se adjuntará automáticamente en este documento al generar el PDF.</p>
                                    </div>

                                    {(stats.outOfStock > 0 || stats.criticalItems > 0) && (
                                        <div className="mb-12 avoid-break hidden print:block">
                                            <div className="flex items-center gap-3 mb-6"><Icon name="error" className="text-red-600" fill /><h3 className="text-xl md:text-2xl font-bold uppercase tracking-tight text-[#202124]">Atención Requerida</h3></div>
                                            <div className="overflow-x-auto"><table className="w-full text-left print-table border-collapse border border-[#E0E0E0]"><thead className="bg-[#F8F9FA]"><tr><th className="px-5 py-4 text-xs font-bold text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0]">Material</th><th className="px-5 py-4 text-xs font-bold text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0] text-center">Stock</th><th className="px-5 py-4 text-xs font-bold text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0] text-center">Estado</th></tr></thead>
                                                <tbody>{[...stats.outOfStockList, ...stats.criticalList].map((m, i) => (
                                                    <tr key={i} className="border-b border-[#F1F3F4]"><td className="px-5 py-4"><p className="font-bold text-sm md:text-base text-[#202124]">{m.nombre}</p><p className="text-[10px] font-medium text-[#5F6368] mt-1">ID: {m.id} • {m.categoria}</p></td><td className="px-5 py-4 text-center font-black text-base">{parseFloat(m.stock).toLocaleString()}</td><td className="px-5 py-4 text-center text-[10px] font-black uppercase">{parseFloat(m.stock) <= 0 ? <span className="print-badge-red px-2 py-1 rounded">Agotado</span> : <span className="print-badge-amber px-2 py-1 rounded">Crítico</span>}</td></tr>
                                                ))}</tbody>
                                            </table></div>
                                        </div>
                                    )}

                                    <div className="page-break hidden print:block">
                                        <div className="flex items-center gap-3 mb-8 border-b-2 border-[#202124] pb-4"><Icon name="inventory_2" className="text-[#202124]" fill /><h3 className="text-xl md:text-2xl font-bold uppercase tracking-tight text-[#202124]">Inventario Completo</h3></div>
                                        {Object.keys(stats.groupedInventory).sort().map((categoria, idx) => (
                                            <div key={idx} className="mb-12 avoid-break">
                                                <h4 className="text-base font-bold text-white bg-[#1a73e8] uppercase mb-4 px-4 py-2 rounded-xl flex items-center gap-2 w-max">
                                                    <Icon name={getItemIcon(categoria)} size={20} fill /> {categoria}
                                                </h4>
                                                {Object.keys(stats.groupedInventory[categoria]).sort().map((subcategoria, sIdx) => (
                                                    <div key={sIdx} className="mb-8 ml-3 md:ml-6 border-l-2 border-[#E0E0E0] pl-4 md:pl-6">
                                                        <h5 className="text-xs md:text-sm font-bold text-[#5F6368] uppercase tracking-widest mb-4">{subcategoria}</h5>
                                                        <div className="overflow-x-auto"><table className="w-full text-left print-table border-collapse"><thead className="bg-[#F8F9FA] border-y border-[#E0E0E0]"><tr><th className="px-4 py-3 text-[10px] font-bold text-[#5F6368] uppercase tracking-widest w-1/2">Material</th><th className="px-4 py-3 text-[10px] font-bold text-[#5F6368] uppercase tracking-widest text-center hidden md:table-cell">Min</th><th className="px-4 py-3 text-[10px] font-bold text-[#5F6368] uppercase tracking-widest text-center">Stock</th><th className="px-4 py-3 text-[10px] font-bold text-[#5F6368] uppercase tracking-widest text-center hidden sm:table-cell">Status</th></tr></thead>
                                                            <tbody className="divide-y divide-[#F1F3F4]">
                                                                {stats.groupedInventory[categoria][subcategoria].map((item, iIdx) => {
                                                                    const stock = parseFloat(item.stock) || 0; const min = parseFloat(item.minimo) || 0;
                                                                    const status = stock <= 0 ? 'AGOTADO' : stock <= min ? 'CRÍTICO' : 'OK';
                                                                    const statusClass = stock <= 0 ? 'text-red-600 font-black' : stock <= min ? 'text-amber-600 font-bold' : 'text-green-600 font-medium';
                                                                    return (
                                                                        <tr key={iIdx}><td className="px-4 py-3"><span className="text-xs md:text-sm font-bold text-[#202124] block">{item.nombre}</span><span className="text-[9px] font-medium text-[#5F6368] mt-0.5">Ref: {item.id}</span></td><td className="px-4 py-3 text-center text-xs text-[#5F6368] hidden md:table-cell">{min}</td><td className="px-4 py-3 text-center text-sm font-black text-[#202124]">{stock.toLocaleString()} <span className="text-[9px] font-bold text-[#5F6368]">{item.unidad}</span></td><td className={`px-4 py-3 text-center text-[10px] hidden sm:table-cell ${statusClass}`}>{status}</td></tr>
                                                                    )
                                                                })}
                                                            </tbody>
                                                        </table></div>
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* BOTTOM NAV MÓVIL */}
                    <nav className="no-print lg:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#E0E0E0] px-2 py-3 pb-8 z-40 flex justify-between items-center rounded-t-[32px] shadow-[0_-10px_30px_rgba(0,0,0,0.05)] gpu-accelerated">
                        {navItems.map(item => (
                            <button key={item.id} onClick={() => { setView(item.id); resetNav(); setSearchTerm(''); triggerHaptic(); }} className={`flex flex-col items-center gap-1.5 p-1 flex-1 transition-transform active:scale-90 ${view === item.id ? 'text-[#1a73e8]' : 'text-[#BDC1C6]'}`}>
                                <div className={`p-2.5 px-4 rounded-[20px] transition-colors ${view === item.id ? 'bg-[#E8F0FE]' : ''}`}>
                                    <Icon name={item.icon} size={24} fill={view === item.id} />
                                </div>
                                <span className="text-[9px] font-black uppercase tracking-widest">{item.label}</span>
                            </button>
                        ))}
                        
                        {/* --- BOTÓN SYNC MÓVIL --- */}
                        <button onClick={() => { fetchData(); triggerHaptic(); }} disabled={isSyncing} className={`flex flex-col items-center gap-1.5 p-1 flex-1 transition-transform active:scale-90 ${isSyncing ? 'text-[#1a73e8]' : 'text-[#5F6368]'}`}>
                            <div className={`p-2.5 px-4 rounded-[20px] transition-colors ${isSyncing ? 'bg-[#E8F0FE]' : 'bg-[#F1F3F4]'}`}>
                                <Icon name="sync" size={24} spin={isSyncing} />
                            </div>
                            <span className="text-[9px] font-black uppercase tracking-widest">Sync</span>
                        </button>
                    </nav>

                    {/* MODAL DE TRANSACCIONES */}
                    <div className={`fixed inset-0 z-[100] flex items-center justify-center p-6 transition-opacity duration-200 ${modalType ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                        <div className="absolute inset-0 bg-[#202124]/40 backdrop-blur-md" onClick={() => !isSaving && setModalType(null)}></div>
                        <div className={`bg-white w-full max-w-sm rounded-[40px] shadow-2xl z-10 overflow-hidden gpu-accelerated transition-transform duration-300 ${modalType ? 'scale-100 translate-y-0' : 'scale-95 translate-y-10'}`}>
                            <div className={`p-8 text-white ${modalType === 'IN' ? 'bg-green-600' : modalType === 'OUT' ? 'bg-red-600' : 'bg-gray-800'}`}>
                                <div className="flex justify-between items-start">
                                    <div><p className="text-[10px] font-black uppercase tracking-widest opacity-80 mb-1">Registrar {modalType}</p><h3 className="text-2xl font-bold leading-tight">{selectedMaterial?.nombre}</h3></div>
                                    <div className="p-3 bg-white/20 rounded-2xl">
                                        <Icon name={modalType === 'IN' ? 'add_circle' : modalType === 'OUT' ? 'remove_circle' : 'tune'} size={32} fill />
                                    </div>
                                </div>
                            </div>
                            <form className="p-8 space-y-6" onSubmit={handleTransaction}>
                                <div className="space-y-2"><label className="text-xs font-bold text-[#5F6368] uppercase ml-1">Cantidad ({selectedMaterial?.unidad})</label><input required name="cantidad" type="number" step="0.01" className="w-full px-6 py-5 bg-[#F1F3F4] rounded-3xl outline-none text-2xl font-black text-[#202124] focus:ring-4 focus:ring-blue-100 transition-all" placeholder="0" autoFocus /></div>
                                <div className="space-y-2"><label className="text-xs font-bold text-[#5F6368] uppercase ml-1">Comentario</label><input name="nota" className="w-full px-6 py-4 bg-[#F1F3F4] rounded-2xl outline-none text-sm font-medium text-[#202124] focus:ring-4 focus:ring-blue-100 transition-all" placeholder="Ej: Nueva recepción" /></div>
                                <div className="flex gap-4 pt-4"><button type="button" disabled={isSaving} onClick={() => setModalType(null)} className="action-button flex-1 py-4 font-bold text-[#5F6368] bg-[#F8F9FA] hover:bg-[#E0E0E0] rounded-2xl transition-colors">Cancelar</button><button disabled={isSaving} className="action-button flex-[2] py-4 bg-[#1a73e8] text-white rounded-3xl font-bold shadow-xl shadow-blue-100 flex items-center justify-center gap-2 hover:bg-[#1557b0] transition-colors">{isSaving ? <Icon name="sync" size={20} spin /> : 'Confirmar'}</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
