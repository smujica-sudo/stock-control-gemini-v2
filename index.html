<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawas Stock Control</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-rounded { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; transition: all 0.3s ease; }
        
        /* Animaciones Premium */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes spinCustom { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spinCustom 1.5s linear infinite; }
        
        /* Utilidades UI */
        .gpu-accelerated { transform: translateZ(0); backface-visibility: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .nav-card:active { transform: scale(0.97); transition: transform 0.1s; }
        
        /* Estilos de Impresión */
        @media print {
            .no-print { display: none !important; }
            .print-table { width: 100% !important; border-collapse: collapse !important; }
            .print-table th, .print-table td { border: 1px solid #E0E0E0 !important; padding: 12px !important; }
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-[#F8F9FA] overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useDeferredValue, memo } = React;

        // --- COMPONENTE ICONO MATERIAL SYMBOLS ("LEAN & SLEEK") ---
        const Icon = memo(({ name, size = 24, className = "", spin = false, fill = false }) => {
            return (
                <span 
                    className={`material-symbols-rounded ${className} ${spin ? 'animate-spin-custom' : ''} gpu-accelerated select-none`}
                    style={{ 
                        fontSize: size, 
                        fontVariationSettings: `'FILL' ${fill ? 1 : 0}, 'wght' 300, 'GRAD' 0, 'opsz' 24` 
                    }}
                >
                    {name}
                </span>
            );
        });

        // --- INTELIGENCIA DE ÍCONOS (CATEGORÍAS Y PRODUCTOS) ---
        const getItemIcon = (categoria = '', subcategoria = '', nombre = '') => {
            const text = `${categoria} ${subcategoria} ${nombre}`.toLowerCase();
            
            // PRIORIDAD 1: EMPAQUES Y CONTENEDORES
            if (text.includes('vaso') || text.includes('copa') || text.includes('mug') || text.includes('taza') || text.includes('botella')) return 'local_drink';
            if (text.includes('tapa') || text.includes('bombilla') || text.includes('pajilla') || text.includes('manga') || text.includes('servilleta')) return 'takeout_dining';
            if (text.includes('etiqueta') || text.includes('adhesivo') || text.includes('sticker')) return 'label';
            if (text.includes('bolsa')) return 'shopping_bag';
            if (text.includes('caja') || text.includes('carton') || text.includes('cartón') || text.includes('empaque')) return 'inventory_2';
            
            // PRIORIDAD 2: INGREDIENTES Y OTROS
            if (text.includes('limpieza') || text.includes('aseo') || text.includes('jabon') || text.includes('sanitizante')) return 'sanitizer';
            if (text.includes('café') || text.includes('cafe') || text.includes('grano') || text.includes('espresso')) return 'coffee';
            if (text.includes('té') || text.includes('te ') || text.includes('matcha') || text.includes('chai')) return 'emoji_food_beverage';
            if (text.includes('leche') || text.includes('lacteo') || text.includes('avena') || text.includes('almendra')) return 'water_drop';
            if (text.includes('sirope') || text.includes('jarabe') || text.includes('salsa') || text.includes('vainilla')) return 'liquor';
            if (text.includes('hielo') || text.includes('cold') || text.includes('frio')) return 'ac_unit';
            if (text.includes('azucar') || text.includes('endulzante') || text.includes('polvo') || text.includes('cacao')) return 'grain';
            if (text.includes('pasteleria') || text.includes('comida') || text.includes('galleta') || text.includes('pan')) return 'bakery_dining';
            if (text.includes('merchandising') || text.includes('ropa')) return 'checkroom';
            if (text.includes('papel') || text.includes('boleta') || text.includes('oficina')) return 'receipt_long';
            if (text.includes('equipo') || text.includes('maquina') || text.includes('herramienta')) return 'handyman';
            
            return 'package_2'; 
        };

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbye0BCOskWfd-jep9i605zmPGM0VLS3XYphKeHiYkKOSAWK8Jzwx0U7LnCLeVqJgjqohg/exec";

        const App = () => {
            // --- ESTADOS PRINCIPALES ---
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(null);
            const [pin, setPin] = useState('');
            const [data, setData] = useState({ materiales: [], movimientos: [], usuarios: [] });
            const [isSyncing, setIsSyncing] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [syncError, setSyncError] = useState(null);
            
            // Navegación e UI
            const [modalType, setModalType] = useState(null); 
            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const deferredSearchTerm = useDeferredValue(searchTerm);
            const [navPath, setNavPath] = useState({ category: null, subcategory: null, itemId: null });

            // Filtros de Historial
            const [historyFilters, setHistoryFilters] = useState({ user: '', dateStart: '', dateEnd: '', category: '', subcategory: '', sort: 'date_desc' });
            const [showFilters, setShowFilters] = useState(false);

            const triggerHaptic = useCallback(() => {
                if ('vibrate' in navigator) navigator.vibrate([15, 30, 15]);
            }, []);

            // --- SINCRONIZACIÓN ---
            const fetchData = async () => {
                setIsSyncing(true);
                setSyncError(null);
                try {
                    const response = await fetch(SCRIPT_URL);
                    if (!response.ok) throw new Error("Error de red");
                    const json = await response.json();
                    setData(json);
                } catch (e) {
                    setSyncError("Error al sincronizar datos");
                } finally {
                    setIsSyncing(false);
                }
            };

            useEffect(() => { if (user) fetchData(); }, [user]);

            // --- LÓGICA DE NEGOCIO (useMemo) ---
            const stats = useMemo(() => {
                const materiales = data.materiales || [];
                const movimientos = data.movimientos || [];
                const totalItems = materiales.length;
                const criticalList = materiales.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0);
                const outOfStockList = materiales.filter(m => (parseFloat(m.stock) || 0) <= 0);
                const criticalItems = criticalList.length;
                const outOfStock = outOfStockList.length;

                const getDaysLeft = (materialId, currentStock) => {
                    const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                    const recentOuts = movimientos.filter(mov => mov.item_id == materialId && mov.tipo === 'OUT' && new Date(mov.timestamp) >= sevenDaysAgo);
                    const totalConsumed = recentOuts.reduce((acc, curr) => acc + Math.abs(parseFloat(curr.cantidad || 0)), 0);
                    return totalConsumed <= 0 ? '---' : Math.round(parseFloat(currentStock) / (totalConsumed / 7));
                };

                const groupedInventory = {};
                materiales.forEach(m => {
                    const cat = m.categoria || 'Sin Categoría'; const subcat = m.subcategoria || 'General';
                    if(!groupedInventory[cat]) groupedInventory[cat] = {};
                    if(!groupedInventory[cat][subcat]) groupedInventory[cat][subcat] = [];
                    groupedInventory[cat][subcat].push(m);
                });

                const categories = [...new Set(materiales.map(m => m.categoria || 'Sin Categoría'))];
                const categoryStats = categories.map(cat => {
                    const items = materiales.filter(m => (m.categoria || 'Sin Categoría') === cat);
                    return {
                        name: cat,
                        total: items.length,
                        critical: items.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0).length,
                        outOfStock: items.filter(m => (parseFloat(m.stock) || 0) <= 0).length
                    };
                }).sort((a, b) => b.total - a.total);

                return { totalItems, criticalItems, criticalList, outOfStock, outOfStockList, getDaysLeft, groupedInventory, categoryStats };
            }, [data]);

            const navigationData = useMemo(() => {
                const materiales = data.materiales || [];
                if (deferredSearchTerm) return { level: 'search', items: materiales.filter(m => m.nombre?.toLowerCase().includes(deferredSearchTerm.toLowerCase()) || m.categoria?.toLowerCase().includes(deferredSearchTerm.toLowerCase()))};
                if (!navPath.category) return { level: 'categories', items: [...new Set(materiales.map(m => m.categoria).filter(Boolean))].map(name => ({ name, count: materiales.filter(m => m.categoria === name).length, out: materiales.filter(m => m.categoria === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.subcategory) return { level: 'subcategories', items: [...new Set(materiales.filter(m => m.categoria === navPath.category).map(m => m.subcategoria || 'General'))].map(name => ({ name, count: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name).length, out: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                if (!navPath.itemId) return { level: 'items', items: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === navPath.subcategory) };
                return { level: 'detail', item: materiales.find(m => m.id == navPath.itemId), movements: (data.movimientos || []).filter(mov => mov.item_id == navPath.itemId) };
            }, [data.materiales, navPath, deferredSearchTerm]);

            const historyData = useMemo(() => {
                let movs = [...(data.movimientos || [])];
                const matDict = {}; (data.materiales || []).forEach(m => { matDict[m.id] = m; });
                movs = movs.map(m => ({ ...m, subcategoria: matDict[m.item_id]?.subcategoria || 'General', categoria_real: matDict[m.item_id]?.categoria || m.categoria || 'Sin Categoría' }));
                
                if (historyFilters.user) movs = movs.filter(m => m.usuario === historyFilters.user);
                if (historyFilters.category) movs = movs.filter(m => m.categoria_real === historyFilters.category);
                if (historyFilters.subcategory) movs = movs.filter(m => m.subcategoria === historyFilters.subcategory);
                if (historyFilters.dateStart) movs = movs.filter(m => new Date(m.timestamp) >= new Date(historyFilters.dateStart + "T00:00:00"));
                if (historyFilters.dateEnd) movs = movs.filter(m => new Date(m.timestamp) <= new Date(historyFilters.dateEnd + "T23:59:59"));

                movs.sort((a, b) => {
                    if (historyFilters.sort === 'date_desc') return new Date(b.timestamp) - new Date(a.timestamp);
                    if (historyFilters.sort === 'date_asc') return new Date(a.timestamp) - new Date(b.timestamp);
                    if (historyFilters.sort === 'mat_asc') return a.item_nombre.localeCompare(b.item_nombre);
                    if (historyFilters.sort === 'mat_desc') return b.item_nombre.localeCompare(a.item_nombre);
                    if (historyFilters.sort === 'tipo_asc') return a.tipo.localeCompare(b.tipo);
                    if (historyFilters.sort === 'tipo_desc') return b.tipo.localeCompare(a.tipo);
                    return 0;
                });

                const uniqueUsers = [...new Set((data.movimientos || []).map(m => m.usuario).filter(Boolean))];
                const uniqueCategories = [...new Set((data.materiales || []).map(m => m.categoria).filter(Boolean))];
                let uniqueSubcategories = historyFilters.category ? [...new Set((data.materiales || []).filter(m => m.categoria === historyFilters.category).map(m => m.subcategoria || 'General'))] : [...new Set((data.materiales || []).map(m => m.subcategoria || 'General').filter(Boolean))];
                return { movs, uniqueUsers, uniqueCategories, uniqueSubcategories };
            }, [data.movimientos, data.materiales, historyFilters]);

            // --- MANEJADORES DE SESIÓN Y NAVEGACIÓN ---
            const handleLogout = useCallback(() => {
                setUser(null); setPin(''); setView('login'); triggerHaptic();
            }, [triggerHaptic]);

            const handleSort = useCallback((column) => {
                let newSort = '';
                if (column === 'date') newSort = historyFilters.sort === 'date_desc' ? 'date_asc' : 'date_desc';
                else if (column === 'tipo') newSort = historyFilters.sort === 'tipo_asc' ? 'tipo_desc' : 'tipo_asc';
                else if (column === 'mat') newSort = historyFilters.sort === 'mat_asc' ? 'mat_desc' : 'mat_asc';
                setHistoryFilters(prev => ({ ...prev, sort: newSort }));
                triggerHaptic();
            }, [historyFilters.sort, triggerHaptic]);

            const handleLogin = (e) => {
                e.preventDefault();
                const validUser = (data.usuarios || []).find(u => u.pin == pin) || (pin === "1234" ? { nombre: "Admin", rol: "Administrador" } : null);
                if (validUser) { setUser(validUser); setView('dashboard'); triggerHaptic(); }
                else { setPin(''); triggerHaptic(); }
            };

            const resetNav = useCallback(() => setNavPath({ category: null, subcategory: null, itemId: null }), []);

            const navItems = [
                { id: 'dashboard', label: 'Inicio', icon: 'space_dashboard' },
                { id: 'inventory', label: 'Buscador', icon: 'search' },
                { id: 'history', label: 'Historial', icon: 'history' },
                { id: 'reports', label: 'Reportes', icon: 'analytics' },
            ];

            // --- VISTA LOGIN ---
            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#F8F9FA]">
                        <div className="w-full max-w-sm bg-white rounded-[40px] p-10 shadow-xl border border-[#E0E0E0] text-center fade-in-up">
                            <div className="w-20 h-20 mx-auto mb-8 flex items-center justify-center">
                                <img src="./logo.png" alt="K" className="w-full h-full object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                                <div style={{display: 'none'}} className="w-20 h-20 bg-[#1a73e8] rounded-3xl items-center justify-center text-white shadow-lg"><span className="text-5xl font-black">K</span></div>
                            </div>
                            <h1 className="text-3xl font-black tracking-tighter uppercase mb-2">Stock Control</h1>
                            <p className="text-[#5F6368] text-sm mb-10 font-medium tracking-wide">Kawas Coffee Inventory</p>
                            <form onSubmit={handleLogin} className="space-y-6">
                                <input type="password" maxLength={4} placeholder="••••" value={pin} onChange={e => setPin(e.target.value)} className="w-full py-5 bg-[#F1F3F4] rounded-[24px] text-center text-3xl tracking-[0.5em] focus:ring-4 focus:ring-blue-100 outline-none border-2 border-transparent focus:border-blue-200 transition-all" autoFocus />
                                <button className="w-full bg-[#1a73e8] text-white py-5 rounded-full font-bold shadow-xl shadow-blue-100 hover:bg-[#1557b0] active:scale-95 transition-all">Ingresar</button>
                            </form>
                            {syncError && <p className="mt-6 text-red-600 text-xs font-bold">{syncError}</p>}
                        </div>
                    </div>
                );
            }

            // --- INTERFAZ PRINCIPAL ---
            return (
                <div className="min-h-screen bg-[#F8F9FA] text-[#202124] font-sans flex flex-col lg:flex-row">
                    {/* BARRA LATERAL (DESKTOP) */}
                    <aside className="no-print hidden lg:flex flex-col w-64 bg-white border-r border-[#E0E0E0] fixed h-full z-20">
                        <div className="p-8">
                            <div className="flex items-center gap-3">
                                <img src="./logo.png" alt="K" className="w-10 h-10 object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                                <div style={{display: 'none'}} className="w-10 h-10 bg-[#1a73e8] rounded-xl items-center justify-center text-white"><span className="text-2xl font-black">K</span></div>
                                <span className="font-black text-xl tracking-tighter uppercase leading-tight">Stock<br/>Control</span>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-2">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => { setView(item.id); resetNav(); setSearchTerm(''); triggerHaptic(); }} className={`w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition-all ${view === item.id ? 'bg-[#E8F0FE] text-[#1a73e8] font-bold shadow-sm' : 'text-[#5F6368] hover:bg-[#F1F3F4]'}`}>
                                    <Icon name={item.icon} size={22} fill={view === item.id} /> {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="px-4 pb-6 mt-auto space-y-3">
                            <button onClick={() => { fetchData(); triggerHaptic(); }} disabled={isSyncing} className="w-full flex items-center justify-center gap-3 px-4 py-3.5 rounded-2xl border bg-white text-[#1a73e8] font-bold hover:bg-[#F8F9FA] transition-all">
                                <Icon name="sync" size={20} spin={isSyncing} /> <span className="text-sm">Sincronizar</span>
                            </button>
                            <button onClick={handleLogout} className="w-full flex items-center justify-center gap-3 px-4 py-3.5 rounded-2xl bg-red-50 text-red-600 font-bold hover:bg-red-100 transition-all">
                                <Icon name="logout" size={20} fill /> <span className="text-sm">Cerrar Sesión</span>
                            </button>
                        </div>
                        <div className="p-6 border-t border-[#F1F3F4]">
                            <div className="flex items-center gap-3 p-3 bg-[#F8F9FA] rounded-2xl">
                                <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs">{user?.nombre?.charAt(0)}</div>
                                <div className="overflow-hidden"><p className="text-xs font-bold truncate">{user?.nombre}</p><p className="text-[10px] text-[#5F6368] uppercase">{user?.rol}</p></div>
                            </div>
                        </div>
                    </aside>

                    {/* HEADER MÓVIL */}
                    <div className="lg:hidden no-print flex items-center justify-between p-4 bg-white border-b border-[#E0E0E0] sticky top-0 z-30">
                        <div className="flex items-center gap-2">
                            <img src="./logo.png" alt="K" className="w-8 h-8 object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                            <div style={{display: 'none'}} className="w-8 h-8 bg-[#1a73e8] rounded-lg items-center justify-center text-white"><span className="text-lg font-black">K</span></div>
                            <span className="font-black text-lg tracking-tighter uppercase">Stock Control</span>
                        </div>
                        <div className="flex items-center gap-2">
                            {isSaving && <Icon name="cloud_upload" size={20} className="text-blue-600 animate-pulse" />}
                            <button onClick={handleLogout} className="p-2 bg-red-50 text-red-600 rounded-xl"><Icon name="logout" size={20} fill /></button>
                        </div>
                    </div>

                    {/* CONTENIDO PRINCIPAL */}
                    <main className="flex-1 lg:ml-64 p-4 lg:p-10 pb-28 lg:pb-10 max-w-[1400px] w-full mx-auto">
                        
                        {/* VISTA INICIO (DASHBOARD) */}
                        {view === 'dashboard' && (
                            <div className="space-y-8 fade-in-up">
                                <div>
                                    <h2 className="text-3xl font-bold tracking-tight">Panel de Control</h2>
                                    <p className="text-[#5F6368] font-medium mt-1">Gestión de insumos y materiales críticos.</p>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-6">
                                    {[
                                        { label: 'Ítems Totales', val: stats.totalItems, icon: 'category', color: 'text-blue-600', bg: 'bg-blue-50' },
                                        { label: 'Stock Crítico', val: stats.criticalItems, icon: 'warning', color: 'text-amber-600', bg: 'bg-amber-50' },
                                        { label: 'Agotados', val: stats.outOfStock, icon: 'error', color: 'text-red-600', bg: 'bg-red-50' },
                                        { label: 'Salud Bodega', val: `${Math.round(((stats.totalItems - stats.outOfStock) / stats.totalItems) * 100 || 0)}%`, icon: 'health_and_safety', color: 'text-green-600', bg: 'bg-green-50' },
                                    ].map((kpi, i) => (
                                        <div key={i} className={`bg-white p-4 md:p-8 rounded-[24px] md:rounded-[40px] border shadow-sm ${kpi.label === 'Agotados' && stats.outOfStock > 0 ? 'border-red-300' : 'border-[#E0E0E0]'}`}>
                                            <div className={`w-10 h-10 md:w-12 md:h-12 ${kpi.bg} ${kpi.color} rounded-xl flex items-center justify-center mb-3`}><Icon name={kpi.icon} size={24} fill /></div>
                                            <p className="text-[9px] md:text-[10px] font-bold text-[#5F6368] uppercase tracking-widest">{kpi.label}</p>
                                            <p className="text-2xl md:text-3xl font-black mt-1 tracking-tight">{kpi.val}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="mt-6 md:mt-12">
                                    <h3 className="text-lg md:text-xl font-bold mb-4 md:mb-6 flex items-center gap-2"><Icon name="pie_chart" size={24} className="text-[#1a73e8]" fill /> Desglose por Categoría</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-6">
                                        {stats.categoryStats.map((cat, idx) => (
                                            <div key={idx} onClick={() => { setView('inventory'); resetNav(); setNavPath({ category: cat.name, subcategory: null, itemId: null }); triggerHaptic(); }} className={`bg-white p-4 md:p-8 rounded-[24px] md:rounded-[32px] border cursor-pointer hover:shadow-lg transition-all group nav-card ${cat.outOfStock > 0 ? 'border-red-300' : cat.critical > 0 ? 'border-amber-300' : 'border-[#E0E0E0]'}`}>
                                                <div className="flex justify-between items-start mb-4">
                                                    <div className={`w-12 h-12 md:w-14 md:h-14 rounded-xl flex items-center justify-center ${cat.outOfStock > 0 ? 'bg-red-50 text-red-600' : cat.critical > 0 ? 'bg-amber-50 text-amber-600' : 'bg-blue-50 text-blue-600'}`}><Icon name={getItemIcon(cat.name)} size={28} fill /></div>
                                                    <div className="flex flex-col gap-1 items-end">
                                                        {cat.outOfStock > 0 && <span className="bg-red-600 text-white px-2 py-1 rounded-lg text-[9px] font-black animate-pulse flex items-center gap-1"><Icon name="error" size={12} fill /> {cat.outOfStock} AGOTADO{cat.outOfStock > 1 ? 'S' : ''}</span>}
                                                        {cat.critical > 0 && <span className="bg-amber-100 text-amber-700 px-2 py-1 rounded-lg text-[9px] font-black flex items-center gap-1"><Icon name="warning" size={12} fill /> {cat.critical} CRÍTICO{cat.critical > 1 ? 'S' : ''}</span>}
                                                        {cat.outOfStock === 0 && cat.critical === 0 && <span className="bg-green-50 text-green-600 px-2 py-1 rounded-lg text-[9px] font-black flex items-center gap-1"><Icon name="check_circle" size={12} fill /> ÓPTIMO</span>}
                                                    </div>
                                                </div>
                                                <h4 className="text-base md:text-xl font-bold text-[#202124] group-hover:text-blue-600">{cat.name}</h4>
                                                <div className="mt-4 flex items-center justify-between border-t border-[#F1F3F4] pt-4">
                                                    <p className="text-[11px] text-[#5F6368] font-medium">{cat.total} ítems</p>
                                                    <p className="text-[10px] font-bold text-blue-600 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-all">Ver detalle <Icon name="arrow_forward" size={14} /></p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VISTA BUSCADOR (INVENTARIO) */}
                        {view === 'inventory' && (
                            <div className="space-y-6 fade-in-up">
                                <div className="bg-white p-4 md:p-6 rounded-[32px] border border-[#E0E0E0] shadow-sm flex items-center gap-4">
                                    <Icon name="search" size={28} className="text-[#5F6368]" />
                                    <input type="text" placeholder="¿Qué estás buscando? (ej. café, vasos, leche...)" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full bg-transparent text-xl font-medium outline-none placeholder-[#BDC1C6]" />
                                </div>

                                <div className="flex items-center gap-2 overflow-x-auto no-scrollbar py-2">
                                    <button onClick={() => { resetNav(); triggerHaptic(); }} className={`px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap flex items-center gap-1.5 transition-all ${!navPath.category ? 'bg-[#1a73e8] text-white shadow-md shadow-blue-200' : 'bg-white border border-[#E0E0E0] text-[#5F6368]'}`}><Icon name="search" size={16} fill={!navPath.category} /> Buscador</button>
                                    {navPath.category && <><Icon name="chevron_right" size={18} className="text-[#BDC1C6]" /><button onClick={() => { setNavPath({...navPath, subcategory:null, itemId:null}); triggerHaptic(); }} className={`px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap flex items-center gap-1.5 transition-all ${!navPath.subcategory ? 'bg-[#1a73e8] text-white shadow-md shadow-blue-200' : 'bg-white border border-[#E0E0E0] text-[#5F6368]'}`}><Icon name={getItemIcon(navPath.category)} size={16} fill={!navPath.subcategory} /> {navPath.category}</button></>}
                                    {navPath.subcategory && <><Icon name="chevron_right" size={18} className="text-[#BDC1C6]" /><button className="px-5 py-2.5 rounded-full text-xs font-bold uppercase whitespace-nowrap bg-[#1a73e8] text-white shadow-md shadow-blue-200 flex items-center gap-1.5"><Icon name="folder_open" size={16} fill /> {navPath.subcategory}</button></>}
                                </div>

                                <div className="grid grid-cols-1 gap-4">
                                    {navigationData.level === 'categories' && navigationData.items.map(cat => (
                                        <div key={cat.name} onClick={() => { setNavPath({ ...navPath, category: cat.name }); triggerHaptic(); }} className="bg-white p-6 rounded-[32px] border border-[#E0E0E0] flex items-center justify-between cursor-pointer hover:shadow-md transition-all nav-card">
                                            <div className="flex items-center gap-4"><div className="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center"><Icon name={getItemIcon(cat.name)} size={28} fill /></div><div className="text-left"><h4 className="text-lg font-bold">{cat.name}</h4><p className="text-xs font-medium text-[#5F6368]">{cat.count} tipos de productos • {cat.out > 0 ? <span className="text-red-600 font-bold">{cat.out} agotados</span> : 'Todo disponible'}</p></div></div>
                                            <Icon name="chevron_right" className="text-[#BDC1C6]" />
                                        </div>
                                    ))}

                                    {navigationData.level === 'subcategories' && navigationData.items.map(sub => (
                                        <div key={sub.name} onClick={() => { setNavPath({ ...navPath, subcategory: sub.name }); triggerHaptic(); }} className="bg-white p-6 rounded-[32px] border border-[#E0E0E0] flex items-center justify-between cursor-pointer hover:shadow-md transition-all nav-card">
                                            <div className="flex items-center gap-4"><div className="w-14 h-14 bg-gray-50 text-[#5F6368] rounded-2xl flex items-center justify-center"><Icon name="folder" size={28} fill /></div><div className="text-left"><h4 className="text-lg font-bold">{sub.name}</h4><p className="text-xs font-medium text-[#5F6368]">{sub.count} materiales registrados</p></div></div>
                                            <Icon name="chevron_right" className="text-[#BDC1C6]" />
                                        </div>
                                    ))}

                                    {(navigationData.level === 'items' || navigationData.level === 'search') && navigationData.items.map(m => {
                                        const isOut = (parseFloat(m.stock) || 0) <= 0;
                                        const isCrit = (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0);
                                        return (
                                            <div key={m.id} onClick={() => { setNavPath({ ...navPath, itemId: m.id, category: m.categoria, subcategory: m.subcategoria || 'General' }); triggerHaptic(); }} className={`bg-white p-6 rounded-[32px] border transition-all flex flex-col md:flex-row md:items-center justify-between gap-6 cursor-pointer hover:shadow-md nav-card ${isOut ? 'border-red-300' : isCrit ? 'border-amber-300' : 'border-[#E0E0E0]'}`}>
                                                <div className="flex items-center gap-4">
                                                    <div className={`w-14 h-14 rounded-2xl flex items-center justify-center shrink-0 ${isOut ? 'bg-red-50 text-red-600' : isCrit ? 'bg-amber-50 text-amber-600' : 'bg-[#E8F0FE] text-blue-600'}`}><Icon name={getItemIcon(m.categoria, m.subcategoria, m.nombre)} size={28} fill /></div>
                                                    <div><h4 className="text-lg font-bold tracking-tight">{m.nombre}</h4><p className="text-[10px] font-black text-[#5F6368] uppercase tracking-widest">{m.categoria} / {m.subcategoria || 'General'}</p></div>
                                                </div>
                                                <div className="flex items-center gap-6 md:px-6 border-t md:border-t-0 pt-4 md:pt-0 border-[#F1F3F4] justify-between md:justify-end">
                                                    <div className="text-left md:text-center"><p className="text-[9px] font-bold text-[#5F6368] uppercase tracking-widest">Stock</p><div className="flex items-baseline gap-1"><span className={`text-2xl font-black tracking-tight ${isOut ? 'text-red-600' : isCrit ? 'text-amber-600' : 'text-blue-600'}`}>{parseFloat(m.stock).toLocaleString()}</span><span className="text-[10px] font-bold text-[#5F6368] tracking-normal lowercase">{m.unidad}</span></div></div>
                                                    <div className="text-right md:text-center"><p className="text-[9px] font-bold text-[#5F6368] uppercase tracking-widest">Alcance</p><div className="flex items-baseline gap-1"><span className="text-xl font-black text-[#202124] tracking-tight">{stats.getDaysLeft(m.id, m.stock)}</span><span className="text-[10px] font-bold text-[#5F6368] tracking-normal lowercase">días</span></div></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* VISTA DETALLE ITEM */}
                        {navigationData.level === 'detail' && navigationData.item && (
                            <div className="space-y-6 fade-in-up">
                                <button onClick={() => setNavPath({ ...navPath, itemId: null })} className="flex items-center gap-2 text-[#5F6368] font-bold hover:text-blue-600 transition-all mb-2"><Icon name="arrow_back" size={20} /> Volver al listado</button>
                                <div className="bg-white p-8 md:p-12 rounded-[40px] border border-[#E0E0E0] shadow-sm">
                                    <div className="flex flex-col md:flex-row md:items-start justify-between gap-8">
                                        <div className="flex items-center gap-6">
                                            <div className="w-20 h-20 bg-blue-600 text-white rounded-[28px] flex items-center justify-center shadow-xl shadow-blue-100"><Icon name={getItemIcon(navigationData.item.categoria, navigationData.item.subcategoria, navigationData.item.nombre)} size={40} fill /></div>
                                            <div>
                                                <p className="text-xs font-bold text-[#5F6368] uppercase tracking-widest mb-1">{navigationData.item.categoria} / {navigationData.item.subcategoria || 'General'}</p>
                                                <h3 className="text-3xl md:text-4xl font-black tracking-tighter uppercase text-[#202124]">{navigationData.item.nombre}</h3>
                                                <div className="flex gap-2 mt-2"><span className="bg-[#F1F3F4] text-[#5F6368] px-3 py-1 rounded-lg text-[10px] font-bold">REF: {navigationData.item.id}</span><span className="bg-[#F1F3F4] text-[#5F6368] px-3 py-1 rounded-lg text-[10px] font-bold uppercase">MIN: {navigationData.item.minimo} {navigationData.item.unidad}</span></div>
                                            </div>
                                        </div>
                                        <div className="flex gap-3">
                                            <button onClick={() => { setSelectedMaterial(navigationData.item); setModalType('IN'); triggerHaptic(); }} className="action-button flex flex-col items-center gap-2 p-5 bg-blue-50 text-blue-600 rounded-[28px] hover:bg-blue-600 hover:text-white transition-all min-w-[100px]"><Icon name="add_circle" size={28} fill /><span className="text-[10px] font-black uppercase">Ingresar</span></button>
                                            <button disabled={parseFloat(navigationData.item.stock) <= 0} onClick={() => { setSelectedMaterial(navigationData.item); setModalType('OUT'); triggerHaptic(); }} className="action-button flex flex-col items-center gap-2 p-5 bg-red-50 text-red-600 rounded-[28px] hover:bg-red-600 hover:text-white disabled:bg-gray-100 disabled:text-gray-300 transition-all min-w-[100px]"><Icon name="remove_circle" size={28} fill /><span className="text-[10px] font-black uppercase">Consumir</span></button>
                                            <button onClick={() => { setSelectedMaterial(navigationData.item); setModalType('ADJUST'); triggerHaptic(); }} className="action-button flex flex-col items-center gap-2 p-5 bg-gray-50 text-[#5F6368] rounded-[28px] hover:bg-gray-800 hover:text-white transition-all min-w-[100px]"><Icon name="tune" size={28} fill /><span className="text-[10px] font-black uppercase">Ajustar</span></button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 mt-10 border-t border-[#F1F3F4] pt-10">
                                        <div className="bg-[#F8F9FA] p-6 md:p-8 rounded-[32px]"><p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest mb-2">Stock Actual</p><div className="flex items-baseline gap-1.5"><span className={`text-4xl md:text-5xl font-black tracking-tight ${parseFloat(navigationData.item.stock) <= 0 ? 'text-red-600' : 'text-blue-600'}`}>{parseFloat(navigationData.item.stock).toLocaleString()}</span><span className="text-sm font-bold text-[#5F6368] tracking-normal lowercase">{navigationData.item.unidad}</span></div></div>
                                        <div className="bg-[#F8F9FA] p-6 md:p-8 rounded-[32px]"><p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest mb-2">Alcance Estimado</p><div className="flex items-baseline gap-1.5 text-[#202124]"><span className="text-4xl md:text-5xl font-black tracking-tight">{stats.getDaysLeft(navigationData.item.id, navigationData.item.stock)}</span><span className="text-sm font-bold text-[#5F6368] tracking-normal lowercase">días</span></div></div>
                                        <div className="col-span-2 md:col-span-1 bg-[#F8F9FA] p-6 md:p-8 rounded-[32px] flex items-center gap-4"><Icon name={parseFloat(navigationData.item.stock) <= 0 ? 'error' : parseFloat(navigationData.item.stock) <= parseFloat(navigationData.item.minimo) ? 'warning' : 'check_circle'} size={44} fill className={parseFloat(navigationData.item.stock) <= 0 ? 'text-red-600' : parseFloat(navigationData.item.stock) <= parseFloat(navigationData.item.minimo) ? 'text-amber-600' : 'text-green-600'} /><div><p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest mb-1">Estado</p><p className="text-xl font-bold uppercase">{parseFloat(navigationData.item.stock) <= 0 ? 'Agotado' : parseFloat(navigationData.item.stock) <= parseFloat(navigationData.item.minimo) ? 'Crítico' : 'Óptimo'}</p></div></div>
                                    </div>
                                </div>
                                <div className="bg-white rounded-[40px] border border-[#E0E0E0] overflow-hidden">
                                    <div className="p-6 md:p-8 border-b border-[#F1F3F4] flex items-center gap-3"><Icon name="history" className="text-blue-600" size={24} /><h4 className="text-xl font-bold">Historial Local</h4></div>
                                    <div className="overflow-x-auto"><table className="w-full text-left"><thead className="bg-[#F8F9FA] text-[10px] font-bold uppercase text-[#5F6368] tracking-widest"><tr><th className="px-6 py-5">Fecha/Usr</th><th className="px-6 py-5">Tipo</th><th className="px-6 py-5 text-right">Variación</th><th className="px-6 py-5 text-right">Saldo</th></tr></thead>
                                        <tbody className="divide-y divide-[#F1F3F4]">{navigationData.movements.slice().reverse().slice(0, 10).map((mov, i) => (
                                            <tr key={i}><td className="px-6 py-5"><p className="text-sm font-bold">{new Date(mov.timestamp).toLocaleDateString()}</p><p className="text-[10px] uppercase font-bold text-[#5F6368]">{mov.usuario}</p></td><td className="px-6 py-5"><span className={`px-2.5 py-1 rounded-lg text-[9px] font-black ${mov.tipo === 'IN' ? 'bg-green-100 text-green-700' : mov.tipo === 'OUT' ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'}`}>{mov.tipo}</span></td><td className={`px-6 py-5 text-right text-sm font-bold ${parseFloat(mov.diferencia) < 0 ? 'text-red-600' : 'text-green-600'}`}>{parseFloat(mov.diferencia) > 0 ? '+' : ''}{mov.diferencia}</td><td className="px-6 py-5 text-right text-sm font-black text-[#202124]">{mov.stock_nuevo}</td></tr>
                                        ))}</tbody>
                                    </table></div>
                                </div>
                            </div>
                        )}

                        {/* VISTA HISTORIAL */}
                        {view === 'history' && (
                            <div className="bg-white rounded-[40px] border border-[#E0E0E0] overflow-hidden shadow-sm fade-in-up mt-4">
                                <div className="p-6 md:p-8 border-b border-[#F1F3F4] flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div className="flex items-center gap-3">
                                        <Icon name="history" className="text-[#1a73e8]" size={28} fill />
                                        <h3 className="text-2xl font-bold tracking-tight text-[#202124]">Historial Global</h3>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => setShowFilters(!showFilters)} className={`action-button px-4 py-2.5 rounded-2xl flex items-center gap-2 text-sm font-bold transition-colors ${showFilters ? 'bg-blue-50 text-blue-600' : 'bg-[#F8F9FA] text-[#5F6368] hover:bg-[#E0E0E0]'}`}><Icon name="filter_list" size={20} /> Filtros</button>
                                        <button onClick={() => { fetchData(); triggerHaptic(); }} className="action-button p-2.5 bg-[#F8F9FA] text-[#5F6368] rounded-2xl"><Icon name="sync" size={20} spin={isSyncing} /></button>
                                    </div>
                                </div>

                                {showFilters && (
                                    <div className="p-6 md:p-8 bg-[#F8F9FA] border-b border-[#F1F3F4] grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 fade-in-up">
                                        <div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Usuario</label><select value={historyFilters.user} onChange={e => setHistoryFilters({...historyFilters, user: e.target.value})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-3 text-sm font-medium outline-none appearance-none"><option value="">Todos</option>{historyData.uniqueUsers.map(u => <option key={u} value={u}>{u}</option>)}</select></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Categoría</label><select value={historyFilters.category} onChange={e => setHistoryFilters({...historyFilters, category: e.target.value, subcategory: ''})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-3 text-sm font-medium outline-none appearance-none"><option value="">Todas</option>{historyData.uniqueCategories.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Subcategoría</label><select value={historyFilters.subcategory} onChange={e => setHistoryFilters({...historyFilters, subcategory: e.target.value})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-3 text-sm font-medium outline-none appearance-none"><option value="">Todas</option>{historyData.uniqueSubcategories.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Desde</label><input type="date" value={historyFilters.dateStart} onChange={e => setHistoryFilters({...historyFilters, dateStart: e.target.value})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-2.5 text-sm font-medium outline-none" /></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Hasta</label><input type="date" value={historyFilters.dateEnd} onChange={e => setHistoryFilters({...historyFilters, dateEnd: e.target.value})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-2.5 text-sm font-medium outline-none" /></div>
                                        <div className="sm:col-span-2 lg:col-span-3 flex justify-end"><button onClick={() => { setHistoryFilters({ user: '', dateStart: '', dateEnd: '', category: '', subcategory: '', sort: 'date_desc' }); triggerHaptic(); }} className="text-red-600 hover:bg-red-50 px-5 py-3 rounded-xl text-xs font-bold transition-all uppercase tracking-wider">Limpiar Filtros</button></div>
                                    </div>
                                )}

                                <div className="overflow-x-auto no-scrollbar">
                                    <table className="w-full text-left">
                                        <thead className="bg-[#F8F9FA] text-[#5F6368] text-xs font-bold uppercase tracking-widest border-b border-[#F1F3F4]">
                                            <tr>
                                                <th onClick={() => handleSort('date')} className="px-6 py-5 cursor-pointer hover:bg-blue-50 transition-colors group select-none"><div className={`flex items-center gap-1 ${historyFilters.sort.startsWith('date') ? 'text-blue-600' : ''}`}>Fecha / Usr {historyFilters.sort === 'date_desc' ? <Icon name="arrow_downward" size={16} /> : historyFilters.sort === 'date_asc' ? <Icon name="arrow_upward" size={16} /> : <Icon name="swap_vert" size={16} className="opacity-0 group-hover:opacity-50" />}</div></th>
                                                <th onClick={() => handleSort('tipo')} className="px-6 py-5 cursor-pointer hover:bg-blue-50 transition-colors group select-none"><div className={`flex items-center gap-1 ${historyFilters.sort.startsWith('tipo') ? 'text-blue-600' : ''}`}>Tipo {historyFilters.sort === 'tipo_desc' ? <Icon name="arrow_downward" size={16} /> : historyFilters.sort === 'tipo_asc' ? <Icon name="arrow_upward" size={16} /> : <Icon name="swap_vert" size={16} className="opacity-0 group-hover:opacity-50" />}</div></th>
                                                <th onClick={() => handleSort('mat')} className="px-6 py-5 cursor-pointer hover:bg-blue-50 transition-colors group select-none"><div className={`flex items-center gap-1 ${historyFilters.sort.startsWith('mat') ? 'text-blue-600' : ''}`}>Material {historyFilters.sort === 'mat_desc' ? <Icon name="arrow_downward" size={16} /> : historyFilters.sort === 'mat_asc' ? <Icon name="arrow_upward" size={16} /> : <Icon name="swap_vert" size={16} className="opacity-0 group-hover:opacity-50" />}</div></th>
                                                <th className="px-6 py-5 text-right">Variación / Saldo</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-[#F1F3F4]">
                                            {historyData.movs.slice(0, 200).map((m, i) => (
                                                <tr key={i} className="hover:bg-[#F8F9FA] transition-colors">
                                                    <td className="px-6 py-5"><p className="text-sm font-bold">{new Date(m.timestamp).toLocaleDateString()} <span className="text-xs font-medium text-[#5F6368]">{new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></p><p className="text-[10px] uppercase font-bold text-[#5F6368]">{m.usuario}</p></td>
                                                    <td className="px-6 py-5"><span className={`px-3 py-1.5 rounded-xl text-[10px] font-black inline-flex items-center gap-1 ${m.tipo === 'IN' ? 'bg-green-100 text-green-700' : m.tipo === 'OUT' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}><Icon name={m.tipo === 'IN' ? 'add_circle' : m.tipo === 'OUT' ? 'remove_circle' : 'tune'} size={14} fill />{m.tipo}</span></td>
                                                    <td className="px-6 py-5"><p className="text-sm font-bold tracking-tight text-[#202124]">{m.item_nombre}</p><p className="text-[9px] font-bold text-[#5F6368] uppercase tracking-widest">{m.categoria_real} / {m.subcategoria}</p></td>
                                                    <td className="px-6 py-5 text-right"><p className={`text-sm font-bold ${parseFloat(m.diferencia) < 0 ? 'text-red-600' : 'text-green-600'}`}>{parseFloat(m.diferencia) > 0 ? '+' : ''}{m.diferencia}</p><p className="text-[10px] font-black text-[#5F6368] bg-[#F1F3F4] px-2 py-0.5 rounded-lg inline-block">= {m.stock_nuevo}</p></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* VISTA REPORTES */}
                        {view === 'reports' && (
                            <div className="space-y-12 fade-in-up">
                                <div className="bg-white p-8 md:p-14 rounded-[40px] md:rounded-[48px] border border-[#E0E0E0] shadow-sm report-container">
                                    <div className="border-b-4 border-blue-600 pb-6 mb-10 flex flex-col md:flex-row md:justify-between md:items-end gap-4">
                                        <div className="flex items-center gap-4">
                                            <div className="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-md shrink-0"><span className="text-3xl font-black">K</span></div>
                                            <div><h1 className="text-4xl font-black text-[#202124] tracking-tighter uppercase">Stock Control</h1><h2 className="text-sm font-bold text-[#5F6368] uppercase tracking-widest">Reporte Consolidado Kawas</h2></div>
                                        </div>
                                        <div className="text-left md:text-right"><p className="text-sm font-bold text-[#202124]">FECHA: {new Date().toLocaleDateString()}</p><p className="text-xs font-medium text-[#5F6368] uppercase mt-1">Generado por: {user.nombre}</p></div>
                                    </div>

                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                                        <div className="p-6 bg-[#F8F9FA] rounded-[24px]"><p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest">Ítems Totales</p><p className="text-3xl font-black mt-2">{stats.totalItems}</p></div>
                                        <div className="p-6 bg-[#E8F0FE] rounded-[24px] text-blue-700"><p className="text-[10px] font-bold uppercase tracking-widest">Salud General</p><p className="text-3xl font-black mt-2">{Math.round(((stats.totalItems - stats.outOfStock) / stats.totalItems) * 100)}%</p></div>
                                        <div className="p-6 bg-amber-50 rounded-[24px] text-amber-700"><p className="text-[10px] font-bold uppercase tracking-widest">Críticos</p><p className="text-3xl font-black mt-2">{stats.criticalItems}</p></div>
                                        <div className="p-6 bg-red-50 rounded-[24px] text-red-700"><p className="text-[10px] font-bold uppercase tracking-widest">Agotados</p><p className="text-3xl font-black mt-2">{stats.outOfStock}</p></div>
                                    </div>

                                    <div className="mb-12">
                                        <h3 className="text-xl font-bold uppercase tracking-tight mb-6 flex items-center gap-2"><Icon name="pie_chart" fill className="text-blue-600" /> Métricas por Categoría</h3>
                                        <div className="overflow-x-auto"><table className="w-full text-left print-table"><thead className="bg-[#F8F9FA]"><tr><th className="px-5 py-4 text-[10px] font-bold uppercase text-[#5F6368]">Categoría</th><th className="px-5 py-4 text-[10px] font-bold text-center uppercase text-[#5F6368]">Ítems</th><th className="px-5 py-4 text-[10px] font-bold text-center uppercase text-[#5F6368]">Agotados</th><th className="px-5 py-4 text-[10px] font-bold text-right uppercase text-[#5F6368]">Salud</th></tr></thead>
                                            <tbody>{stats.categoryStats.map((cat, i) => {
                                                const health = Math.round(((cat.total - cat.outOfStock) / cat.total) * 100);
                                                return (<tr key={i} className="border-b"><td className="px-5 py-4 flex items-center gap-3"><Icon name={getItemIcon(cat.name)} size={18} /><span className="font-bold text-sm">{cat.name}</span></td><td className="px-5 py-4 text-center text-sm font-bold">{cat.total}</td><td className="px-5 py-4 text-center"><span className={`px-2 py-1 rounded-lg text-xs font-black ${cat.outOfStock > 0 ? 'bg-red-100 text-red-700' : 'text-gray-300'}`}>{cat.outOfStock || '-'}</span></td><td className="px-5 py-4 text-right font-black text-sm" style={{color: health < 50 ? '#DC2626' : health < 80 ? '#D97706' : '#16A34A'}}>{health}%</td></tr>);
                                            })}</tbody>
                                        </table></div>
                                    </div>

                                    <div className="no-print p-8 bg-blue-50 border border-blue-100 text-blue-700 rounded-3xl text-center font-medium flex flex-col items-center gap-2">
                                        <Icon name="picture_as_pdf" size={32} />
                                        <p>El desglose completo del inventario y materiales críticos se incluirá automáticamente al generar el PDF.</p>
                                        <button onClick={() => window.print()} className="mt-4 bg-blue-600 text-white px-8 py-3 rounded-full font-bold shadow-lg shadow-blue-200">Generar Reporte PDF</button>
                                    </div>

                                    <div className="hidden print:block space-y-12">
                                        <div className="page-break"><h3 className="text-xl font-bold uppercase mb-6 border-b-2 border-black pb-2">Materiales en Estado Crítico</h3><table className="w-full print-table"><thead><tr className="bg-gray-100"><th className="px-4 py-3">Material</th><th className="px-4 py-3 text-center">Stock</th><th className="px-4 py-3 text-center">Mínimo</th></tr></thead><tbody>{materialesCríticosYAGotados(stats).map((m, i) => (<tr key={i}><td className="px-4 py-3 font-bold">{m.nombre}</td><td className="px-4 py-3 text-center font-black">{m.stock}</td><td className="px-4 py-3 text-center font-bold text-gray-500">{m.minimo}</td></tr>))}</tbody></table></div>
                                        <div className="page-break"><h3 className="text-xl font-bold uppercase mb-6 border-b-2 border-black pb-2">Inventario Completo por Categoría</h3>{Object.keys(stats.groupedInventory).sort().map(cat => (<div key={cat} className="mb-8 avoid-break"><h4 className="bg-gray-100 p-2 font-black uppercase text-sm mb-2">{cat}</h4><table className="w-full print-table"><thead><tr><th className="px-3 py-2 text-left">Ítem</th><th className="px-3 py-2 text-center">Stock</th><th className="px-3 py-2 text-center">Unidad</th></tr></thead><tbody>{Object.keys(stats.groupedInventory[cat]).map(sub => stats.groupedInventory[cat][sub].map((m, i) => (<tr key={i}><td className="px-3 py-2 text-sm">{m.nombre}</td><td className="px-3 py-2 text-center font-bold">{m.stock}</td><td className="px-3 py-2 text-center text-xs text-gray-500 uppercase">{m.unidad}</td></tr>)))}</tbody></table></div>))}</div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* BARRA NAVEGACIÓN INFERIOR (MÓVIL) */}
                    <nav className="lg:hidden no-print fixed bottom-0 left-0 right-0 bg-white border-t border-[#E0E0E0] p-4 flex justify-around items-center z-40 rounded-t-[32px] shadow-2xl">
                        {navItems.map(item => (
                            <button key={item.id} onClick={() => { setView(item.id); resetNav(); triggerHaptic(); }} className={`flex flex-col items-center gap-1 transition-all ${view === item.id ? 'text-blue-600' : 'text-[#BDC1C6]'}`}>
                                <div className={`p-2 px-6 rounded-full transition-all ${view === item.id ? 'bg-blue-50' : ''}`}><Icon name={item.icon} size={24} fill={view === item.id} /></div>
                                <span className="text-[9px] font-black uppercase tracking-widest">{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* MODAL DE MOVIMIENTOS */}
                    {modalType && selectedMaterial && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-[#202124]/40 backdrop-blur-sm" onClick={() => !isSaving && setModalType(null)}></div>
                            <div className="bg-white w-full max-w-sm rounded-[40px] shadow-2xl z-10 overflow-hidden fade-in-up border border-[#E0E0E0]">
                                <div className={`p-8 text-white ${modalType === 'IN' ? 'bg-green-600' : modalType === 'OUT' ? 'bg-red-600' : 'bg-gray-800'}`}>
                                    <div className="flex justify-between items-start">
                                        <div><p className="text-[10px] font-black uppercase tracking-widest opacity-80">Registrar {modalType}</p><h3 className="text-2xl font-bold tracking-tight uppercase leading-tight">{selectedMaterial.nombre}</h3></div>
                                        <div className="p-3 bg-white/20 rounded-2xl"><Icon name={modalType === 'IN' ? 'add_circle' : modalType === 'OUT' ? 'remove_circle' : 'tune'} size={32} fill /></div>
                                    </div>
                                </div>
                                <form className="p-8 space-y-6" onSubmit={async (e) => {
                                    e.preventDefault(); setIsSaving(true); triggerHaptic();
                                    const params = { action: 'movimiento', usuario: user.nombre, tipo: modalType, materialId: selectedMaterial.id, cantidad: e.target.cantidad.value, nota: e.target.nota.value };
                                    try {
                                        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(params) });
                                        setModalType(null); setTimeout(fetchData, 1500);
                                    } catch (err) { setSyncError("Error al guardar"); } finally { setIsSaving(false); }
                                }}>
                                    <div className="space-y-1.5"><label className="text-xs font-black text-[#5F6368] uppercase ml-1">Cantidad ({selectedMaterial.unidad})</label><input required name="cantidad" type="number" step="0.01" className="w-full px-6 py-5 bg-[#F1F3F4] rounded-[24px] text-2xl font-black outline-none border-2 border-transparent focus:border-blue-200 transition-all" placeholder="0.00" autoFocus /></div>
                                    <div className="space-y-1.5"><label className="text-xs font-black text-[#5F6368] uppercase ml-1">Comentario / Nota</label><input name="nota" className="w-full px-6 py-4 bg-[#F1F3F4] rounded-[20px] text-sm font-medium outline-none border-2 border-transparent focus:border-blue-200 transition-all" placeholder="Opcional..." /></div>
                                    <div className="flex gap-4 pt-4">
                                        <button type="button" onClick={() => setModalType(null)} className="flex-1 py-4 font-bold text-[#5F6368] hover:bg-gray-100 rounded-[20px]">Cancelar</button>
                                        <button disabled={isSaving} className="flex-[2] py-4 bg-[#1a73e8] text-white rounded-[24px] font-bold shadow-xl shadow-blue-100 hover:bg-blue-700 active:scale-95 transition-all flex justify-center items-center">{isSaving ? <Icon name="sync" spin size={20} /> : 'Confirmar'}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Función auxiliar para reportes
        const materialesCríticosYAGotados = (stats) => {
            return [...stats.outOfStockList, ...stats.criticalList].sort((a,b) => parseFloat(a.stock) - parseFloat(b.stock));
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
