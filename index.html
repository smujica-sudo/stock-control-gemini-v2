<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawas Tostaduría - Control de Stock</title>
    
    <!-- ☕ FAVICON VECTORIAL -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a73e8'/%3E%3Ctext x='50' y='75' font-family='Arial, sans-serif' font-size='72' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
    
    <!-- ESCUDO GLOBAL ANTI-CRASH -->
    <script>
        window.addEventListener('error', function(event) {
            var root = document.getElementById('root');
            if(root) {
                root.innerHTML = '<div style="padding:30px; font-family:sans-serif; color:#d93025; background:#fce8e6; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;"><h2>⚠️ Error de Sistema</h2><p>Ocurrió un problema procesando los datos.</p><p style="font-size:11px; margin-top:10px; color:#5F6368;">' + event.message + '</p><button onclick="window.location.reload()" style="margin-top:25px; padding:12px 24px; background:#d93025; color:white; border:none; border-radius:24px; font-weight:bold; cursor:pointer;">Recargar Aplicación</button></div>';
            }
        });
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    
    <!-- Google Material Symbols (Rounded & Fill Support) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            margin: 0;
            overflow-x: hidden;
            color: #202124;
            -webkit-tap-highlight-color: transparent;
        }

        /* Tipografía de Íconos Google */
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            white-space: nowrap;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .gpu-accelerated { transform: translateZ(0); will-change: transform, opacity; }
        
        /* Interacciones Premium */
        .nav-card:active { transform: scale(0.96); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        .action-button:active { transform: scale(0.88); transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1); }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translate3d(0, 15px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }

        /* ESTILOS DE IMPRESIÓN INTELIGENTE */
        @media print {
            @page { margin: 10mm; size: auto; }
            body { background-color: white !important; }
            .no-print, aside, header, nav, .action-button, .search-bar, .sync-status { display: none !important; }
            main { margin: 0 !important; padding: 0 !important; }
            .report-container { box-shadow: none !important; border: none !important; border-radius: 0 !important; padding: 0 !important; }
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
            .print-table { width: 100% !important; border-collapse: collapse !important; margin-bottom: 20px; }
            .print-table th, .print-table td { border: 1px solid #E0E0E0 !important; padding: 10px !important; font-size: 11px !important; }
            .print-table thead { background-color: #F8F9FA !important; -webkit-print-color-adjust: exact; }
            .print-badge-red { background-color: #fce8e6 !important; color: #d93025 !important; border: 1px solid #d93025; font-weight: bold; }
            .print-badge-amber { background-color: #fef7e0 !important; color: #e37400 !important; border: 1px solid #e37400; font-weight: bold; }
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- Loader Inicial Estilizado -->
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#1a73e8;font-family:sans-serif;">
            <div style="width:48px;height:48px;border:4px solid #E8F0FE;border-top:4px solid #1a73e8;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            <p style="margin-top:24px;font-weight:700;font-size:1.1rem;letter-spacing:-0.5px;">Cargando Kawas Stock...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useDeferredValue, memo } = React;

        // --- CONFIGURACIÓN DE SEGURIDAD ---
        const MASTER_PIN = "9988"; // PIN de administrador que no aparece en la planilla

        // --- COMPONENTE ICONO MATERIAL SYMBOLS ("LEAN & SLEEK") ---
        const Icon = memo(({ name, size = 24, className = "", spin = false, fill = false }) => {
            return (
                <span 
                    className={`material-symbols-rounded ${className} ${spin ? 'animate-spin-custom' : ''} gpu-accelerated select-none`}
                    style={{ 
                        fontSize: size, 
                        fontVariationSettings: `'FILL' ${fill ? 1 : 0}, 'wght' 300, 'GRAD' 0, 'opsz' 24` 
                    }}
                >
                    {name}
                </span>
            );
        });

        // --- MOTOR DE INTELIGENCIA DE ÍCONOS (EL MÁS COMPLETO) ---
        const getItemIcon = (categoria = '', subcategoria = '', nombre = '') => {
            const text = `${categoria} ${subcategoria} ${nombre}`.toLowerCase();
            
            // Prioridad 1: Vasos y Consumibles Directos
            if (text.includes('vaso') || text.includes('copa') || text.includes('mug') || text.includes('taza') || text.includes('botella')) return 'local_drink';
            if (text.includes('tapa') || text.includes('bombilla') || text.includes('pajilla') || text.includes('fajilla') || text.includes('manga') || text.includes('revolvedor') || text.includes('servilleta') || text.includes('porta')) return 'takeout_dining';
            if (text.includes('bolsa') || text.includes('sacola')) return 'shopping_bag';
            if (text.includes('caja') || text.includes('carton') || text.includes('cartón') || text.includes('empaque') || text.includes('packaging')) return 'inventory_2';
            
            // Prioridad 2: Insumos de Tostaduría
            if (text.includes('café') || text.includes('cafe') || text.includes('grano') || text.includes('espresso') || text.includes('decaf') || text.includes('verde') || text.includes('tueste')) return 'coffee';
            if (text.includes('té') || text.includes('te ') || text.includes('matcha') || text.includes('chai') || text.includes('infusión') || text.includes('hoja')) return 'emoji_food_beverage';
            if (text.includes('leche') || text.includes('lacteo') || text.includes('lácteo') || text.includes('avena') || text.includes('almendra') || text.includes('soya') || text.includes('entera') || text.includes('descremada')) return 'water_drop';
            if (text.includes('sirope') || text.includes('jarabe') || text.includes('salsa') || text.includes('esencia') || text.includes('saborizante') || text.includes('vainilla') || text.includes('caramelo') || text.includes('avellana') || text.includes('puré')) return 'liquor';
            if (text.includes('hielo') || text.includes('cold') || text.includes('frio') || text.includes('frío') || text.includes('frappe')) return 'ac_unit';
            if (text.includes('azucar') || text.includes('azúcar') || text.includes('endulzante') || text.includes('stevia') || text.includes('cacao') || text.includes('canela') || text.includes('polvo')) return 'grain';
            
            // Prioridad 3: Alimentos y Pastelería
            if (text.includes('pasteleria') || text.includes('comida') || text.includes('alimento') || text.includes('galleta') || text.includes('pan') || text.includes('croissant') || text.includes('muffin') || text.includes('torta') || text.includes('postre') || text.includes('sandwich')) return 'bakery_dining';
            
            // Prioridad 4: Operaciones, Limpieza e Insumos Técnicos
            if (text.includes('limpieza') || text.includes('aseo') || text.includes('cloro') || text.includes('detergente') || text.includes('jabon') || text.includes('jabón') || text.includes('basura') || text.includes('esponja') || text.includes('sanitizante') || text.includes('paño')) return 'sanitizer';
            if (text.includes('merchandising') || text.includes('ropa') || text.includes('polera') || text.includes('jockey') || text.includes('delantal') || text.includes('tote')) return 'checkroom';
            if (text.includes('etiqueta') || text.includes('adhesivo') || text.includes('sticker')) return 'label';
            if (text.includes('papel') || text.includes('oficina') || text.includes('boleta') || text.includes('impresora') || text.includes('tinta') || text.includes('rollo') || text.includes('termico')) return 'receipt_long';
            if (text.includes('equipo') || text.includes('maquina') || text.includes('repuesto') || text.includes('filtro') || text.includes('herramienta') || text.includes('mantenimiento') || text.includes('tostadora')) return 'handyman';
            
            return 'package_2'; 
        };

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbye0BCOskWfd-jep9i605zmPGM0VLS3XYphKeHiYkKOSAWK8Jzwx0U7LnCLeVqJgjqohg/exec";

        const App = () => {
            // --- ESTADOS PRINCIPALES ---
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(null);
            const [pin, setPin] = useState('');
            const [data, setData] = useState({ materiales: [], movimientos: [], usuarios: [] });
            
            const [searchTerm, setSearchTerm] = useState('');
            const deferredSearchTerm = useDeferredValue(searchTerm); 
            
            const [isSyncing, setIsSyncing] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [syncError, setSyncError] = useState(null);
            
            const [modalType, setModalType] = useState(null); 
            const [selectedMaterial, setSelectedMaterial] = useState(null);
            const [navPath, setNavPath] = useState({ category: null, subcategory: null, itemId: null });

            const [historyFilters, setHistoryFilters] = useState({ user: '', dateStart: '', dateEnd: '', category: '', subcategory: '', sort: 'date_desc' });
            const [showFilters, setShowFilters] = useState(false);

            const triggerHaptic = useCallback(() => {
                if ('vibrate' in navigator) navigator.vibrate([15, 30, 15]);
            }, []);

            // --- SINCRONIZACIÓN Y RED ---
            const fetchData = useCallback(async () => {
                setIsSyncing(true); setSyncError(null);
                try {
                    const response = await fetch(SCRIPT_URL);
                    if (!response.ok) throw new Error("Servidor no responde");
                    const json = await response.json();
                    if (json && json.materiales) setData(json);
                } catch (e) {
                    setSyncError("Error de sincronización: " + e.message);
                } finally {
                    setIsSyncing(false);
                }
            }, []);

            useEffect(() => { if (user) fetchData(); }, [user, fetchData]);

            // --- MANEJADORES DE SESIÓN ---
            const handleLogout = useCallback(() => {
                setUser(null); setPin(''); setView('login'); triggerHaptic();
            }, [triggerHaptic]);

            const attemptLogin = useCallback((currentPin) => {
                const validUser = (data.usuarios || []).find(u => u.pin == currentPin) || 
                                 (currentPin === MASTER_PIN ? { nombre: "Admin Principal", rol: "Administrador" } : null);
                if (validUser) {
                    setUser(validUser); setView('dashboard'); triggerHaptic();
                } else if (currentPin.length === 4) {
                    setPin(''); triggerHaptic();
                }
            }, [data.usuarios, triggerHaptic]);

            useEffect(() => { if (pin.length === 4) attemptLogin(pin); }, [pin, attemptLogin]);

            const handleTransaction = async (e) => {
                e.preventDefault();
                const qty = parseFloat(e.target.cantidad.value);
                const nota = e.target.nota.value;
                const matId = selectedMaterial.id;
                setModalType(null); triggerHaptic(); setIsSaving(true);
                try {
                    await fetch(SCRIPT_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        body: JSON.stringify({ 
                            action: 'movimiento', 
                            usuario: user.nombre, 
                            tipo: modalType, 
                            materialId: matId, 
                            cantidad: qty, 
                            nota: nota 
                        }) 
                    });
                    // Recarga optimista diferida
                    setTimeout(fetchData, 1200);
                } catch (err) { 
                    console.error(err); 
                    setSyncError("Error al guardar transacción.");
                } finally { 
                    setIsSaving(false); 
                }
            };

            // --- LÓGICA DE ORDENAMIENTO INTERACTIVO (COLUMNAS) ---
            const handleSort = useCallback((column) => {
                let newSort = '';
                if (column === 'date') newSort = historyFilters.sort === 'date_desc' ? 'date_asc' : 'date_desc';
                else if (column === 'tipo') newSort = historyFilters.sort === 'tipo_asc' ? 'tipo_desc' : 'tipo_asc';
                else if (column === 'mat') newSort = historyFilters.sort === 'mat_asc' ? 'mat_desc' : 'mat_asc';
                
                setHistoryFilters(prev => ({ ...prev, sort: newSort }));
                triggerHaptic();
            }, [historyFilters.sort, triggerHaptic]);

            // --- LÓGICA DE NEGOCIO Y KPIs (useMemo) ---
            const stats = useMemo(() => {
                const materiales = data.materiales || [];
                const movimientos = data.movimientos || [];
                
                const totalItems = materiales.length;
                const criticalList = materiales.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0);
                const outOfStockList = materiales.filter(m => (parseFloat(m.stock) || 0) <= 0);

                const getDaysLeft = (materialId, currentStock) => {
                    const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                    const recentOuts = movimientos.filter(mov => mov.item_id == materialId && mov.tipo === 'OUT' && new Date(mov.timestamp) >= sevenDaysAgo);
                    const totalConsumed = recentOuts.reduce((acc, curr) => acc + Math.abs(parseFloat(curr.cantidad || 0)), 0);
                    return totalConsumed <= 0 ? '---' : Math.round(parseFloat(currentStock) / (totalConsumed / 7));
                };

                const groupedInventory = {};
                materiales.forEach(m => {
                    const cat = m.categoria || 'Sin Categoría'; const subcat = m.subcategoria || 'General';
                    if(!groupedInventory[cat]) groupedInventory[cat] = {};
                    if(!groupedInventory[cat][subcat]) groupedInventory[cat][subcat] = [];
                    groupedInventory[cat][subcat].push(m);
                });

                const categoryStats = [...new Set(materiales.map(m => m.categoria || 'Sin Categoría'))].map(cat => {
                    const items = materiales.filter(m => (m.categoria || 'Sin Categoría') === cat);
                    return {
                        name: cat, total: items.length,
                        critical: items.filter(m => (parseFloat(m.stock) || 0) <= (parseFloat(m.minimo) || 0) && (parseFloat(m.stock) || 0) > 0).length,
                        outOfStock: items.filter(m => (parseFloat(m.stock) || 0) <= 0).length
                    };
                }).sort((a, b) => b.total - a.total);

                return { 
                    totalItems, 
                    criticalItems: criticalList.length, 
                    criticalList, 
                    outOfStock: outOfStockList.length, 
                    outOfStockList, 
                    getDaysLeft, 
                    groupedInventory, 
                    categoryStats 
                };
            }, [data]);

            // Navegación Jerárquica e Inteligencia de Búsqueda
            const navigationData = useMemo(() => {
                const materiales = data.materiales || [];
                if (deferredSearchTerm) {
                    return { level: 'search', items: materiales.filter(m => (m.nombre || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()) || (m.categoria || "").toLowerCase().includes(deferredSearchTerm.toLowerCase()))};
                }
                if (!navPath.category) {
                    return { level: 'categories', items: [...new Set(materiales.map(m => m.categoria).filter(Boolean))].map(name => ({ name, count: materiales.filter(m => m.categoria === name).length, out: materiales.filter(m => m.categoria === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                }
                if (!navPath.subcategory) {
                    return { level: 'subcategories', items: [...new Set(materiales.filter(m => m.categoria === navPath.category).map(m => m.subcategoria || 'General'))].map(name => ({ name, count: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name).length, out: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === name && (parseFloat(m.stock) || 0) <= 0).length }))};
                }
                if (!navPath.itemId) {
                    return { level: 'items', items: materiales.filter(m => m.categoria === navPath.category && (m.subcategoria || 'General') === navPath.subcategory) };
                }
                return { level: 'detail', item: materiales.find(m => m.id == navPath.itemId), movements: (data.movimientos || []).filter(mov => mov.item_id == navPath.itemId) };
            }, [data.materiales, navPath, deferredSearchTerm]);

            // Lógica Analítica del Historial
            const historyData = useMemo(() => {
                let movs = [...(data.movimientos || [])];
                const matDict = {}; (data.materiales || []).forEach(m => { matDict[m.id] = m; });
                
                movs = movs.map(m => ({ 
                    ...m, 
                    subcategoria: matDict[m.item_id]?.subcategoria || 'General', 
                    categoria_real: matDict[m.item_id]?.categoria || m.categoria || 'Sin Categoría' 
                }));
                
                if (historyFilters.user) movs = movs.filter(m => m.usuario === historyFilters.user);
                if (historyFilters.category) movs = movs.filter(m => m.categoria_real === historyFilters.category);
                if (historyFilters.subcategory) movs = movs.filter(m => m.subcategoria === historyFilters.subcategory);
                if (historyFilters.dateStart) movs = movs.filter(m => new Date(m.timestamp) >= new Date(historyFilters.dateStart + "T00:00:00"));
                if (historyFilters.dateEnd) movs = movs.filter(m => new Date(m.timestamp) <= new Date(historyFilters.dateEnd + "T23:59:59"));

                movs.sort((a, b) => {
                    if (historyFilters.sort === 'date_desc') return new Date(b.timestamp) - new Date(a.timestamp);
                    if (historyFilters.sort === 'date_asc') return new Date(a.timestamp) - new Date(b.timestamp);
                    if (historyFilters.sort === 'mat_asc') return (a.item_nombre || '').localeCompare(b.item_nombre || '');
                    if (historyFilters.sort === 'mat_desc') return (b.item_nombre || '').localeCompare(a.item_nombre || '');
                    if (historyFilters.sort === 'tipo_asc') return (a.tipo || '').localeCompare(b.tipo || '');
                    if (historyFilters.sort === 'tipo_desc') return (b.tipo || '').localeCompare(a.tipo || '');
                    return 0;
                });

                // Integración robusta de usuarios totales y usuarios con movimientos históricos
                const uniqueUsers = [...new Set([
                    ...(data.usuarios || []).map(u => u.nombre),
                    ...(data.movimientos || []).map(m => m.usuario)
                ].filter(Boolean))].sort();
                
                const uniqueCategories = [...new Set((data.materiales || []).map(m => m.categoria).filter(Boolean))];
                let uniqueSubcategories = historyFilters.category 
                    ? [...new Set((data.materiales || []).filter(m => m.categoria === historyFilters.category).map(m => m.subcategoria || 'General'))] 
                    : [...new Set((data.materiales || []).map(m => m.subcategoria || 'General').filter(Boolean))];
                
                return { movs, uniqueUsers, uniqueCategories, uniqueSubcategories };
            }, [data.movimientos, data.materiales, data.usuarios, historyFilters]);

            const resetNav = useCallback(() => setNavPath({ category: null, subcategory: null, itemId: null }), []);

            const navItems = [
                { id: 'dashboard', label: 'Inicio', icon: 'space_dashboard' },
                { id: 'inventory', label: 'Buscador', icon: 'search' },
                { id: 'history', label: 'Historial', icon: 'history' },
                { id: 'reports', label: 'Reportes', icon: 'analytics' },
            ];

            // --- VISTA DE LOGIN ---
            if (view === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[#F8F9FA]">
                        <div className="w-full max-w-sm bg-white rounded-[40px] p-10 shadow-xl border border-[#E0E0E0] text-center gpu-accelerated fade-in-up">
                            <div className="w-20 h-20 mx-auto mb-8 flex items-center justify-center">
                                <img src="./logo.png" alt="K" className="w-full h-full object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                                <div style={{display: 'none'}} className="w-20 h-20 bg-[#1a73e8] rounded-3xl flex-col items-center justify-center text-white shadow-lg"><span className="text-5xl font-black font-sans leading-none">K</span></div>
                            </div>
                            <h1 className="text-3xl font-black tracking-tighter uppercase mb-2">Stock Control</h1>
                            <p className="text-[#5F6368] text-sm mb-10 font-medium tracking-wide">Kawas Tostaduría de Café</p>
                            <input 
                                type="password" 
                                inputMode="numeric" 
                                maxLength={4} 
                                placeholder="PIN" 
                                value={pin} 
                                onChange={e => setPin(e.target.value.replace(/\D/g,''))} 
                                className="w-full py-5 bg-[#F1F3F4] rounded-2xl text-center text-3xl tracking-[1em] font-bold outline-none focus:ring-4 focus:ring-blue-100 transition-all border-2 border-transparent focus:border-blue-200" 
                                autoFocus 
                            />
                            <div className="mt-8 h-4 text-xs font-bold text-blue-600">
                                {isSyncing ? (
                                    <div className="flex items-center justify-center gap-2 animate-pulse"><Icon name="sync" size={16} spin /> Sincronizando seguridad...</div>
                                ) : syncError ? (
                                    <span className="text-red-500">Error de conexión con la base de datos</span>
                                ) : null}
                            </div>
                        </div>
                    </div>
                );
            }

            // --- INTERFAZ PRINCIPAL ---
            return (
                <div className="min-h-screen bg-[#F8F9FA] text-[#202124] font-sans flex flex-col lg:flex-row">
                    
                    {/* BARRA LATERAL (Desktop) */}
                    <aside className="no-print hidden lg:flex flex-col w-64 bg-white border-r border-[#E0E0E0] fixed h-full z-20">
                        <div className="p-8">
                            <div className="flex items-center gap-3">
                                <img src="./logo.png" alt="K" className="w-10 h-10 object-contain" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                                <div style={{display: 'none'}} className="w-10 h-10 bg-[#1a73e8] rounded-xl flex items-center justify-center text-white shadow-md shadow-blue-200"><span className="text-2xl font-black leading-none">K</span></div>
                                <span className="font-black text-xl tracking-tighter uppercase leading-tight text-[#202124]">Stock<br/>Control</span>
                            </div>
                        </div>
                        <nav className="flex-1 px-4 space-y-2">
                            {navItems.map(item => (
                                <button

                                                    {stats.outOfStockList.map(item => (
                                                        <span key={item.id} className="bg-white/10 border border-white/20 px-3 py-1.5 rounded-lg text-xs font-bold backdrop-blur-sm">

                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                        {view === 'inventory' && (
                            <div className="space-y-6 fade-in-up pb-6">

                                    {navPath.subcategory && <><Icon name="chevron_right" size={18} className="text-[#BDC1C6] shrink-0" /><button onClick={() => { setNavPath({...navPath, itemId:null}); triggerHaptic(); }} className="px-5 py-2.5 bg-[#1a73e8] text-white rounded-full text-xs font-bold uppercase whitespace-nowrap shadow-md flex items-center gap-1.5 shadow-blue-100"><Icon name="folder_open" size={16} fill /> {navPath.subcategory}</button></>}
                                </div>

                                <div className="grid grid-cols-1 gap-4">
                                    {/* Nivel: Categorías */}

                                            <div className="flex items-center gap-4"><div className="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center transition-transform group-hover:scale-105"><Icon name={getItemIcon(cat.name)} size={28} fill /></div><div className="text-left"><h4 className="text-lg font-bold text-[#202124]">{cat.name}</h4><p className="text-xs font-medium text-[#5F6368]">{cat.count} tipos de productos • {cat.out > 0 ? <span className="text-red-600 font-bold">{cat.out} agotados</span> : 'Todo disponible'}</p></div></div>

                                            <Icon name="chevron_right" className="text-[#BDC1C6] group-hover:text-blue-600 transition-colors" />

                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="space-y-6 fade-in-up">

                                            </div>
                                        </div>
                                        <div className="flex gap-3 w-full md:w-auto mt-4 md:mt-0">
                                            <button onClick={() => { setSelectedMaterial(navigationData.item); setModalType('IN'); triggerHaptic(); }} className="action-button flex-1 md:flex-none flex flex-col items-center justify-center gap-2 p-5 bg-blue-50 text-blue-600 rounded-[28px] hover:bg-blue-600 hover:text-white transition-all min-w-[100px]"><Icon name="add_circle" size={28} fill /><span className="text-[10px] font-black uppercase">Ingresar</span></button>
                                            <button disabled={parseFloat(navigationData.item.stock) <= 0} onClick={() => { setSelectedMaterial(navigationData.item); setModalType('OUT'); triggerHaptic(); }} className={`action-button flex-1 md:flex-none flex flex-col items-center justify-center gap-2 p-5 rounded-[28px] transition-all min-w-[100px] ${parseFloat(navigationData.item.stock) <= 0 ? 'bg-[#F1F3F4] text-[#BDC1C6]' : 'bg-red-50 text-red-600 hover:bg-red-600 hover:text-white'}`}><Icon name="remove_circle" size={28} fill /><span className="text-[10px] font-black uppercase">Consumir</span></button>
                                            <button onClick={() => { setSelectedMaterial(navigationData.item); setModalType('ADJUST'); triggerHaptic(); }} className="action-button flex-1 md:flex-none flex flex-col items-center justify-center gap-2 p-5 bg-[#F1F3F4] text-[#5F6368] rounded-[28px] hover:bg-[#5F6368] hover:text-white transition-all min-w-[100px]"><Icon name="tune" size={28} fill /><span className="text-[10px] font-black uppercase">Ajustar</span></button>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 mt-10 border-t border-[#F1F3F4] pt-10">
                                        <div className="bg-[#F8F9FA] p-6 md:p-8 rounded-[32px]"><p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest mb-2 ml-1">Stock Actual</p><div className={`flex items-baseline gap-1.5 ${parseFloat(navigationData.item.stock) <= 0 ? 'text-red-600' : 'text-blue-600'}`}><span className="text-4xl md:text-5xl font-black tracking-tight">{parseFloat(navigationData.item.stock).toLocaleString()}</span><span className="text-sm md:text-base font-bold text-[#5F6368] lowercase">{navigationData.item.unidad}</span></div></div>

                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-[40px] border border-[#E0E0E0] overflow-hidden">

                                    <div className="overflow-x-auto no-scrollbar"><table className="w-full text-left"><thead className="bg-[#F8F9FA] text-[10px] font-bold uppercase text-[#5F6368] tracking-widest"><tr><th className="px-6 md:px-8 py-5">Fecha / Usuario</th><th className="px-6 md:px-8 py-5">Tipo</th><th className="px-6 md:px-8 py-5 text-right">Variación</th><th className="px-6 md:px-8 py-5 text-right">Saldo</th></tr></thead>
                                        <tbody className="divide-y divide-[#F1F3F4]">{navigationData.movements.slice().reverse().slice(0, 15).map((mov, i) => (
                                            <tr key={i} className="hover:bg-[#F8F9FA] transition-colors"><td className="px-6 md:px-8 py-5"><p className="text-sm font-bold text-[#202124] whitespace-nowrap">{new Date(mov.timestamp).toLocaleDateString()} <span className="text-xs font-medium text-[#5F6368]">{new Date(mov.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></p><p className="text-[10px] uppercase font-bold text-[#5F6368] mt-0.5">{mov.usuario}</p></td><td className="px-6 md:px-8 py-5"><span className={`px-2.5 py-1.5 rounded-xl text-[10px] font-black inline-flex items-center gap-1 ${mov.tipo === 'IN' ? 'bg-green-100 text-green-700' : mov.tipo === 'OUT' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}><Icon name={mov.tipo === 'IN' ? 'add_circle' : mov.tipo === 'OUT' ? 'remove_circle' : 'tune'} size={14} fill /> {mov.tipo}</span></td><td className={`px-6 md:px-8 py-5 text-right text-sm font-bold ${parseFloat(mov.diferencia) < 0 ? 'text-red-600' : 'text-green-600'}`}>{parseFloat(mov.diferencia) > 0 ? '+' : ''}{mov.diferencia}</td><td className="px-6 md:px-8 py-5 text-right text-sm font-black text-[#202124]">{mov.stock_nuevo}</td></tr>
                                        ))}</tbody>
                                    </table></div>
                                </div>
                            </div>
                        )}

                        {/* 4. HISTORIAL GLOBAL (CON ORDENAMIENTO EN CABECERA) */}
                        {view === 'history' && (
                            <div className="bg-white rounded-[40px] border border-[#E0E0E0] overflow-hidden shadow-sm fade-in-up mt-4">
                                <div className="p-6 md:p-8 border-b border-[#F1F3F4] flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div className="flex items-center gap-3"><Icon name="history" className="text-[#1a73e8]" size={28} fill /><h3 className="text-2xl font-bold tracking-tight text-[#202124]">Historial Global</h3></div>
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => setShowFilters(!showFilters)} className={`action-button px-4 py-2.5 rounded-2xl flex items-center gap-2 text-sm font-bold transition-colors ${showFilters ? 'bg-blue-50 text-[#1a73e8]' : 'bg-[#F8F9FA] text-[#5F6368]'}`}><Icon name="filter_list" size={20} /> Filtros</button>
                                        <button onClick={() => fetchData()} className="action-button p-2.5 bg-[#F8F9FA] text-[#5F6368] rounded-2xl hover:bg-[#E0E0E0] transition-colors"><Icon name="sync" size={20} spin={isSyncing} /></button>
                                    </div>
                                </div>

                                {/* Panel de Filtros Desplegable */}
                                {showFilters && (
                                    <div className="p-6 md:p-8 bg-[#F8F9FA] border-b border-[#F1F3F4] grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 fade-in-up">
                                        <div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Usuario</label><select value={historyFilters.user} onChange={e => setHistoryFilters({...historyFilters, user: e.target.value})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-3 text-sm font-medium outline-none appearance-none cursor-pointer"><option value="">Todos los usuarios</option>{historyData.uniqueUsers.map(u => <option key={u} value={u}>{u}</option>)}</select></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Categoría</label><select value={historyFilters.category} onChange={e => setHistoryFilters({...historyFilters, category: e.target.value, subcategory: ''})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-3 text-sm font-medium outline-none appearance-none cursor-pointer"><option value="">Todas las categorías</option>{historyData.uniqueCategories.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Subcategoría</label><select value={historyFilters.subcategory} onChange={e => setHistoryFilters({...historyFilters, subcategory: e.target.value})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-3 text-sm font-medium outline-none appearance-none cursor-pointer"><option value="">Todas las subcategorías</option>{historyData.uniqueSubcategories.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Desde</label><input type="date" value={historyFilters.dateStart} onChange={e => setHistoryFilters({...historyFilters, dateStart: e.target.value})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-2.5 text-sm font-medium outline-none cursor-pointer" /></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Hasta</label><input type="date" value={historyFilters.dateEnd} onChange={e => setHistoryFilters({...historyFilters, dateEnd: e.target.value})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-2.5 text-sm font-medium outline-none cursor-pointer" /></div>
                                        <div className="space-y-1.5"><label className="text-[10px] font-black uppercase text-[#5F6368] tracking-widest ml-1">Ordenar por</label><select value={historyFilters.sort} onChange={e => setHistoryFilters({...historyFilters, sort: e.target.value})} className="w-full bg-white border border-[#E0E0E0] rounded-xl px-4 py-3 text-sm font-medium outline-none appearance-none cursor-pointer"><option value="date_desc">🕒 Fecha: Recientes primero</option><option value="date_asc">🕒 Fecha: Antiguos primero</option><option value="mat_asc">📦 Material: A - Z</option><option value="mat_desc">📦 Material: Z - A</option><option value="tipo_asc">🔄 Tipo: A - Z</option></select></div>
                                        <div className="sm:col-span-2 lg:col-span-3 flex justify-end items-end"><button onClick={() => { setHistoryFilters({ user: '', dateStart: '', dateEnd: '', category: '', subcategory: '', sort: 'date_desc' }); triggerHaptic(); }} className="text-red-600 hover:bg-red-50 px-5 py-3 rounded-xl text-xs font-bold transition-all uppercase tracking-wider">Limpiar Filtros</button></div>
                                    </div>
                                )}

                                <div className="overflow-x-auto no-scrollbar"><table className="w-full text-left"><thead className="bg-[#F8F9FA] text-[#5F6368] text-xs font-bold uppercase tracking-widest border-b border-[#F1F3F4]">
                                    <tr>
                                        <th onClick={() => handleSort('date')} className="px-6 md:px-8 py-5 cursor-pointer hover:bg-blue-50 transition-colors group select-none"><div className={`flex items-center gap-1 ${historyFilters.sort.startsWith('date') ? 'text-blue-600' : ''}`}>Fecha / Usr {historyFilters.sort === 'date_desc' ? <Icon name="arrow_downward" size={16} /> : historyFilters.sort === 'date_asc' ? <Icon name="arrow_upward" size={16} /> : <Icon name="swap_vert" size={16} className="opacity-0 group-hover:opacity-50" />}</div></th>
                                        <th onClick={() => handleSort('tipo')} className="px-6 md:px-8 py-5 cursor-pointer hover:bg-blue-50 transition-colors group select-none"><div className={`flex items-center gap-1 ${historyFilters.sort.startsWith('tipo') ? 'text-blue-600' : ''}`}>Tipo {historyFilters.sort === 'tipo_desc' ? <Icon name="arrow_downward" size={16} /> : historyFilters.sort === 'tipo_asc' ? <Icon name="arrow_upward" size={16} /> : <Icon name="swap_vert" size={16} className="opacity-0 group-hover:opacity-50" />}</div></th>
                                        <th onClick={() => handleSort('mat')} className="px-6 md:px-8 py-5 cursor-pointer hover:bg-blue-50 transition-colors group select-none"><div className={`flex items-center gap-1 ${historyFilters.sort.startsWith('mat') ? 'text-blue-600' : ''}`}>Material {historyFilters.sort === 'mat_desc' ? <Icon name="arrow_downward" size={16} /> : historyFilters.sort === 'mat_asc' ? <Icon name="arrow_upward" size={16} /> : <Icon name="swap_vert" size={16} className="opacity-0 group-hover:opacity-50" />}</div></th>
                                        <th className="px-6 md:px-8 py-5 text-right">Variación / Saldo</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-[#F1F3F4]">{historyData.movs.slice(0, 200).map((m, i) => (
                                    <tr key={i} className="hover:bg-[#F8F9FA] transition-colors"><td className="px-6 md:px-8 py-5"><p className="text-sm font-bold text-[#202124] whitespace-nowrap">{new Date(m.timestamp).toLocaleDateString()} <span className="text-xs font-medium text-[#5F6368]">{new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></p><p className="text-[10px] uppercase font-bold text-[#5F6368] mt-0.5">{m.usuario}</p></td><td className="px-6 md:px-8 py-5"><span className={`px-3 py-1.5 rounded-xl text-[10px] font-black inline-flex items-center gap-1 ${m.tipo === 'IN' ? 'bg-green-100 text-green-700' : m.tipo === 'OUT' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}><Icon name={m.tipo === 'IN' ? 'add_circle' : m.tipo === 'OUT' ? 'remove_circle' : 'tune'} size={14} /> {m.tipo}</span></td><td className="px-6 md:px-8 py-5"><p className="text-sm font-bold text-[#202124]">{m.item_nombre}</p><p className="text-[10px] font-bold text-[#5F6368] uppercase tracking-widest">{m.categoria_real} / {m.subcategoria}</p></td><td className="px-6 md:px-8 py-5 text-right"><p className={`text-sm font-bold ${parseFloat(m.diferencia) < 0 ? 'text-red-600' : 'text-green-600'}`}>{parseFloat(m.diferencia) > 0 ? '+' : ''}{m.diferencia}</p><p className="text-[10px] font-black text-[#5F6368] bg-[#F1F3F4] px-2 py-0.5 rounded-lg inline-block">= {m.stock_nuevo}</p></td></tr>
                                ))}</tbody></table></div>
                            </div>
                        )}

                        {/* 5. REPORTES INTELIGENTES (UI LIMPIA / PDF COMPLETO) */}
                        {view === 'reports' && (
                            <div className="space-y-12 fade-in-up">
                                <div className="no-print flex flex-col md:flex-row md:items-center justify-between gap-4 mt-4">
                                    <div><h2 className="text-3xl font-bold tracking-tight text-[#202124]">Reportes</h2><p className="text-[#5F6368] font-medium mt-1">Exportación de datos de inventario y KPI's.</p></div>
                                    <div className="flex gap-4">
                                        <button onClick={() => window.open('https://docs.google.com/spreadsheets/d/1oZiefz32aCVb0iBGnfQ5drzZKvk94HVCbWcgZleIKlg/edit', '_blank')} className="action-button flex justify-center items-center gap-2 px-8 py-4 bg-white border border-[#E0E0E0] text-[#1a73e8] rounded-full font-bold shadow-sm hover:bg-[#F8F9FA] text-base"><Icon name="open_in_new" size={20} /> Ver Planilla</button>
                                        <button onClick={() => { triggerHaptic(); window.print(); }} className="action-button flex justify-center items-center gap-2 px-8 py-4 bg-[#1a73e8] text-white rounded-full font-bold shadow-xl shadow-blue-200 hover:bg-[#1557b0] text-base"><Icon name="print" size={20} /> Imprimir PDF</button>
                                    </div>
                                </div>

                                <div className="bg-white p-8 md:p-14 rounded-[40px] md:rounded-[48px] border border-[#E0E0E0] shadow-sm report-container text-[#202124]">
                                    {/* Cabecera del Reporte */}
                                    <div className="border-b-4 border-blue-600 pb-6 mb-10 flex flex-col md:flex-row md:justify-between md:items-end gap-4">
                                        <div className="flex items-center gap-4">
                                            <div className="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-md shrink-0"><span className="text-3xl font-black">K</span></div>
                                            <div><h1 className="text-4xl md:text-5xl font-black text-[#202124] tracking-tighter uppercase leading-none mb-1">Stock Control</h1><h2 className="text-sm font-bold text-[#5F6368] uppercase tracking-widest">Reporte Consolidado Kawas Tostaduría</h2></div>
                                        </div>
                                        <div className="text-left md:text-right"><p className="text-sm font-bold text-[#202124]">FECHA: {new Date().toLocaleDateString()}</p><p className="text-xs font-medium text-[#5F6368] uppercase mt-1">Generado por: {user.nombre}</p></div>
                                    </div>

                                    {/* Resumen KPI */}
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-12">
                                        <div className="p-6 bg-[#F8F9FA] border border-[#F1F3F4] rounded-[24px]"><p className="text-xs font-bold text-[#5F6368] uppercase tracking-widest">Ítems Totales</p><p className="text-3xl font-black mt-2 text-[#202124]">{stats.totalItems}</p></div>
                                        <div className="p-6 bg-[#E8F0FE] border border-blue-100 rounded-[24px] text-blue-700"><p className="text-xs font-bold uppercase tracking-widest">Salud General</p><p className="text-3xl font-black mt-2">{Math.round(((stats.totalItems - stats.outOfStock) / stats.totalItems) * 100 || 0)}%</p></div>
                                        <div className="p-6 bg-amber-50 border border-amber-100 rounded-[24px] text-amber-700"><p className="text-xs font-bold uppercase tracking-widest">Críticos</p><p className="text-3xl font-black mt-2">{stats.criticalItems}</p></div>
                                        <div className="p-6 bg-red-50 border border-red-100 rounded-[24px] text-red-700"><p className="text-xs font-bold uppercase tracking-widest">Agotados</p><p className="text-3xl font-black mt-2">{stats.outOfStock}</p></div>
                                    </div>

                                    {/* Métricas por Categoría (VISIBLE EN UI Y PRINT) */}
                                    <div className="mb-12 avoid-break">
                                        <div className="flex items-center gap-3 mb-6"><Icon name="pie_chart" className="text-[#202124]" fill /><h3 className="text-xl md:text-2xl font-bold uppercase tracking-tight text-[#202124]">Métricas por Categoría</h3></div>
                                        <div className="overflow-x-auto"><table className="w-full text-left print-table"><thead className="bg-[#F8F9FA]"><tr><th className="px-5 py-4 text-xs font-bold text-[#5F6368] uppercase tracking-widest border-b border-[#E0E0E0]">Categoría</th><th className="px-5 py-4 text-xs font-bold text-center uppercase text-[#5F6368] border-b border-[#E0E0E0]">Ítems</th><th className="px-5 py-4 text-xs font-bold text-center uppercase text-[#5F6368] border-b border-[#E0E0E0]">Agotados</th><th className="px-5 py-4 text-xs font-bold text-right uppercase text-[#5F6368] border-b border-[#E0E0E0]">Salud</th></tr></thead>
                                            <tbody>{stats.categoryStats.map((cat, i) => {
                                                const health = Math.round(((cat.total - cat.outOfStock) / cat.total) * 100) || 0;
                                                return (<tr key={i} className="border-b"><td className="px-5 py-4 flex items-center gap-3"><Icon name={getItemIcon(cat.name)} size={20} /><span className="font-bold text-sm">{cat.name}</span></td><td className="px-5 py-4 text-center text-sm font-bold text-[#5F6368]">{cat.total}</td><td className="px-5 py-4 text-center"><span className={`px-2.5 py-1 rounded-lg text-xs font-black ${cat.outOfStock > 0 ? 'bg-red-100 text-red-700' : 'text-gray-300'}`}>{cat.outOfStock || '-'}</span></td><td className={`px-5 py-4 text-right font-black text-sm ${health < 50 ? 'text-red-600' : health < 80 ? 'text-amber-600' : 'text-green-600'}`}>{health}%</td></tr>);
                                            })}</tbody>
                                        </table></div>
                                    </div>

                                    {/* Nota Visual UI */}
                                    <div className="no-print p-10 bg-blue-50 border border-blue-100 text-blue-700 rounded-[32px] text-center font-medium flex flex-col items-center gap-3">
                                        <Icon name="picture_as_pdf" size={40} />
                                        <p className="text-lg">El inventario detallado y materiales críticos se adjuntarán automáticamente en este documento al generar el PDF.</p>
                                    </div>

                                    {/* SECCIONES PARA IMPRESIÓN (OCULTAS EN UI) */}
                                    <div className="hidden print:block space-y-12">
                                        <div className="page-break mt-10"><h3 className="text-xl font-bold uppercase mb-6 border-b-2 border-black pb-2">Materiales en Estado Crítico</h3><table className="w-full print-table"><thead><tr className="bg-gray-100"><th className="px-4 py-3">Material</th><th className="px-4 py-3 text-center">Stock</th><th className="px-4 py-3 text-center">Mínimo</th><th className="px-4 py-3 text-center">Estado</th></tr></thead><tbody>{[...stats.outOfStockList, ...stats.criticalList].map((m, i) => (<tr key={i}><td className="px-4 py-3 font-bold">{m.nombre}</td><td className="px-4 py-3 text-center font-black">{m.stock}</td><td className="px-4 py-3 text-center text-gray-500 font-bold">{m.minimo}</td><td className="px-4 py-3 text-center text-[10px] font-black uppercase">{parseFloat(m.stock) <= 0 ? <span className="print-badge-red px-2 py-1 rounded">Agotado</span> : <span className="print-badge-amber px-2 py-1 rounded">Crítico</span>}</td></tr>))}</tbody></table></div>
                                        <div className="page-break"><h3 className="text-xl font-bold uppercase mb-6 border-b-2 border-black pb-2">Inventario Completo</h3>{Object.keys(stats.groupedInventory).sort().map(cat => (<div key={cat} className="mb-10 avoid-break"><h4 className="bg-blue-600 text-white p-3 font-black uppercase text-xs mb-4 rounded-xl">{cat}</h4><table className="w-full print-table"><thead><tr><th className="px-3 py-2 text-left">Ítem</th><th className="px-3 py-2 text-center">Stock</th><th className="px-3 py-2 text-center">Unidad</th></tr></thead><tbody>{Object.keys(stats.groupedInventory[cat]).map(sub => stats.groupedInventory[cat][sub].map((m, i) => (<tr key={i}><td className="px-3 py-2 text-sm">{m.nombre}</td><td className="px-3 py-2 text-center font-bold">{m.stock}</td><td className="px-3 py-2 text-center text-xs text-gray-400 uppercase">{m.unidad}</td></tr>)))}</tbody></table></div>))}</div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* BARRA NAVEGACIÓN INFERIOR (Móvil) */}
                    <nav className="lg:hidden no-print fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#E0E0E0] p-4 pb-8 flex justify-around items-center z-40 rounded-t-[32px] shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                        {navItems.map(item => (
                            <button key={item.id} onClick={() => { setView(item.id); resetNav(); triggerHaptic(); }} className={`flex flex-col items-center gap-1.5 transition-all flex-1 active:scale-90 ${view === item.id ? 'text-[#1a73e8]' : 'text-[#BDC1C6]'}`}>
                                <div className={`p-2 px-6 rounded-[20px] transition-all ${view === item.id ? 'bg-[#E8F0FE]' : ''}`}><Icon name={item.icon} size={24} fill={view === item.id} /></div>
                                <span className="text-[9px] font-black uppercase tracking-widest">{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* MODAL UNIVERSAL DE TRANSACCIONES */}
                    {modalType && selectedMaterial && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-[#202124]/40 backdrop-blur-sm animate-in fade-in" onClick={() => !isSaving && setModalType(null)}></div>
                            <div className="bg-white w-full max-w-sm rounded-[40px] shadow-2xl z-10 overflow-hidden fade-in-up border border-[#E0E0E0]">
                                <div className={`p-8 text-white ${modalType === 'IN' ? 'bg-green-600' : modalType === 'OUT' ? 'bg-red-600' : 'bg-gray-800'}`}>
                                    <div className="flex justify-between items-start">
                                        <div><p className="text-[10px] font-black uppercase tracking-widest opacity-80 mb-1">Registrar {modalType}</p><h3 className="text-2xl font-bold tracking-tight uppercase leading-tight">{selectedMaterial.nombre}</h3></div>
                                        <div className="p-3 bg-white/20 rounded-2xl"><Icon name={modalType === 'IN' ? 'add_circle' : modalType === 'OUT' ? 'remove_circle' : 'tune'} size={32} fill /></div>
                                    </div>
                                </div>
                                <form className="p-8 space-y-6" onSubmit={handleTransaction}>
                                    <div className="space-y-1.5"><label className="text-xs font-black text-[#5F6368] uppercase ml-1">Cantidad ({selectedMaterial.unidad})</label><input required name="cantidad" type="number" step="0.01" className="w-full px-6 py-5 bg-[#F1F3F4] rounded-[24px] text-2xl font-black outline-none border-2 border-transparent focus:border-blue-200 transition-all text-[#202124]" placeholder="0.00" autoFocus /></div>
                                    <div className="space-y-1.5"><label className="text-xs font-black text-[#5F6368] uppercase ml-1">Comentario / Nota</label><input name="nota" className="w-full px-6 py-4 bg-[#F1F3F4] rounded-[20px] text-sm font-medium outline-none border-2 border-transparent focus:border-blue-200 transition-all text-[#202124]" placeholder="Opcional..." /></div>
                                    <div className="flex gap-4 pt-4">
                                        <button type="button" onClick={() => setModalType(null)} className="action-button flex-1 py-4 font-bold text-[#5F6368] hover:bg-gray-100 rounded-[20px]">Cancelar</button>
                                        <button disabled={isSaving} className="action-button flex-[2] py-4 bg-[#1a73e8] text-white rounded-[24px] font-bold shadow-xl shadow-blue-100 hover:bg-blue-700 active:scale-95 transition-all flex justify-center items-center">{isSaving ? <Icon name="sync" spin size={20} /> : 'Confirmar'}</button>
                                    </div>
                                </form>
                                {syncError && <div className="px-8 pb-4 text-[10px] font-bold text-red-500 text-center">{syncError}</div>}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
