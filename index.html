<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <title>Kawas Inventory Control</title>
  <style>
    :root{
      --bg:#030712;--panel:rgba(255,255,255,.05);--border:rgba(255,255,255,.10);
      --text:#f8fafc;--muted:rgba(248,250,252,.62);--muted2:rgba(248,250,252,.42);
      --cyan:#67e8f9;--gold:#d4a44a;--green:#4ABA7A;--orange:#E89B3E;--red:#E05252;
      --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
    body{background:
      radial-gradient(circle at 12% 10%, rgba(34,211,238,.14), transparent 24rem),
      radial-gradient(circle at 88% 14%, rgba(217,70,239,.10), transparent 24rem),
      radial-gradient(circle at 40% 100%, rgba(59,130,246,.10), transparent 30rem),
      var(--bg)}
    .app{height:100%;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
    .screen{position:absolute;inset:0;display:flex;flex-direction:column}
    .glass{background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(18px);border-radius:24px}
    .topbar{padding:calc(14px + var(--safe-top)) 16px 10px;display:flex;align-items:center;gap:10px}
    .brand{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid rgba(103,232,249,.18);background:rgba(34,211,238,.10);color:#cffafe;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
    .brand-dot{width:8px;height:8px;border-radius:999px;background:var(--cyan)}
    .kawas-logo-wrap{display:flex;justify-content:center;align-items:center}
    .kawas-logo-login{width:min(100%,160px);height:auto;max-height:86px;object-fit:contain;display:block;filter:drop-shadow(0 10px 28px rgba(0,0,0,.30))}
    .kawas-logo-dash{width:min(100%,200px);height:auto;max-height:52px;object-fit:contain;display:block;opacity:.96}
    .brand-stack{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

    .top-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);display:flex;align-items:center;justify-content:center}
    .title{font-size:18px;font-weight:700}.subtitle{font-size:12px;color:var(--muted2);margin-top:3px}
    .scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(96px + var(--safe-bottom))}
    .login-center{height:100%;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
    .login-card{width:100%;padding:26px}.hero{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:18px 0 10px}
    .helper{font-size:14px;color:var(--muted);line-height:1.65}
    .input,.textarea{width:100%;border-radius:18px;border:1px solid var(--border);background:rgba(0,0,0,.22);color:var(--text);min-height:50px;padding:0 16px;outline:none}
    .input::placeholder,.textarea::placeholder{color:rgba(248,250,252,.24)} .textarea{min-height:110px;padding:14px 16px;resize:none}
    .pin-input{font-size:30px;font-weight:800;letter-spacing:10px;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .btn{min-height:50px;border:none;border-radius:18px;padding:0 18px;background:#fff;color:#000;font-weight:700}
    .btn:disabled{opacity:.55}.btn-primary{background:var(--cyan);color:#001018}.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border)}
    .error,.warn{padding:14px 16px;border-radius:18px;font-size:13px;line-height:1.5;margin-bottom:12px}
    .error{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.20);color:#fecdd3}.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.18);color:#fde68a}
    .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .summary-card{padding:14px;border-radius:18px;background:rgba(20,25,34,.84);border:1px solid var(--border);text-align:center;transition:transform .14s ease,border-color .14s ease,background .14s ease}.summary-card[data-kpi-filter]{cursor:pointer}.summary-card[data-kpi-filter]:active{transform:scale(.98)}
    .summary-number{font-size:24px;font-weight:800}.summary-name{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.12em;margin-top:3px}
    .section-label{font-size:11px;color:var(--muted2);letter-spacing:.20em;text-transform:uppercase;margin:14px 0 10px;font-weight:700}
    .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .cat-card,.subcat-card,.product-card,.hist-card,.report-card{background:var(--panel);border:1px solid var(--border);border-radius:20px}
    .cat-card{padding:15px 14px;position:relative;overflow:hidden;min-height:118px}
    .cat-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
    .cat-title{font-size:14px;font-weight:700}.cat-meta{font-size:10px;color:var(--muted2);margin-top:4px}.cat-strip{position:absolute;left:0;right:0;bottom:0;height:3px;opacity:.72}
    .badge-dot{position:absolute;top:10px;right:10px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
    .subcat-card,.product-card,.hist-card,.report-card{padding:14px;margin-bottom:8px}
    .subcat-row,.product-row,.hist-row{display:flex;align-items:center;gap:10px}
    .subcat-title,.product-name{font-size:14px;font-weight:650;line-height:1.3}
    .subcat-meta,.product-unit{font-size:10px;color:var(--muted2);margin-top:2px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .status-chip{font-size:10px;font-weight:800;padding:5px 8px;border-radius:8px;min-width:52px;text-align:center}
    .bar{margin-top:9px;background:rgba(255,255,255,.08);border-radius:999px;height:6px;overflow:hidden}.bar>span{display:block;height:100%;border-radius:999px}
    .detail-stock{padding:28px 18px;text-align:center;margin-top:12px;border-radius:24px;background:var(--panel);border:1px solid var(--border)}
    .detail-stock-num{font-size:54px;font-weight:850;line-height:1}.detail-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted2)}
    .projection-card{margin-top:12px;padding:16px;border-radius:18px;background:rgba(20,25,34,.86);border:1px solid rgba(255,255,255,.08)}
    .projection-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.metric-box{padding:12px 8px;border-radius:14px;background:rgba(0,0,0,.26);border:1px solid var(--border);text-align:center}
    .metric-val{font-size:18px;font-weight:800}.metric-cap{font-size:9px;color:var(--muted2);margin-top:3px;text-transform:uppercase;letter-spacing:.08em}
    .action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
    .action-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 8px;border:none;border-radius:18px;font-weight:700}
    .adj-panel{margin-top:16px;padding:20px 16px;border-radius:22px;background:var(--panel);border:1px solid var(--border)} .adj-actions{display:flex;gap:8px;margin-top:12px}
    .hist-icon{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
    .bottom-nav{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(10px + var(--safe-bottom));border-top:1px solid var(--border);background:rgba(3,7,18,.94);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
    .nav-btn{border:none;background:none;color:#667085;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;position:relative}.nav-btn.active{color:var(--gold)} .nav-label{font-size:10px;font-weight:600}
    .nav-ping{position:absolute;top:3px;right:calc(50% - 16px);width:8px;height:8px;border-radius:999px;background:var(--red)}
    .search-input-wrap{padding:8px 0}.search-box{position:relative}.clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;border-radius:999px;background:rgba(255,255,255,.08);color:var(--text)}
    .group-header{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.16em;margin:14px 0 8px;padding:0 4px;font-weight:700}
    .empty{padding:48px 0;text-align:center;color:#52525b;font-size:13px}
    .report-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border:none;border-radius:999px;background:linear-gradient(135deg,#d4a44a,#b8860b);color:#111827;font-size:15px;font-weight:800}

    .report-filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:end}
    .report-filter{flex:1 1 160px;min-width:140px}
    .report-filter label{display:block;font-size:11px;color:var(--muted2);letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;font-weight:700}
    .report-filter .input{min-height:46px}
    .report-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .report-print-header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:16px}
    .report-print-logo{width:170px;max-width:42vw;height:auto;display:block}

    .report-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
    .report-stamp{font-size:11px;color:var(--muted2);text-align:right;line-height:1.5}
    .report-grid{display:grid;grid-template-columns:1fr;gap:10px}
    .report-two-col{display:grid;grid-template-columns:1fr;gap:10px}
    .report-hero{padding:18px;border-radius:24px;background:linear-gradient(180deg,rgba(26,32,44,.92),rgba(11,18,30,.96));border:1px solid rgba(255,255,255,.08);margin-bottom:10px}
    .report-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .report-hero-title{font-size:18px;font-weight:850;letter-spacing:-.02em}
    .report-hero-sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}
    .report-badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .report-badge{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:11px;color:var(--text)}
    .report-section{padding:16px;border-radius:20px;background:rgba(20,25,34,.86);border:1px solid var(--border);margin-bottom:10px}
    .report-actions-strip{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
    .report-alert-grid{display:grid;grid-template-columns:1fr;gap:8px}
    .report-alert-card{padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
    .report-alert-card .name{font-size:13px;font-weight:800;line-height:1.3}
    .report-alert-card .meta{font-size:11px;color:var(--muted2);margin-top:4px;line-height:1.45}
    .report-alert-card .foot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px}
    .report-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800}
    .report-insight-list{display:grid;grid-template-columns:1fr;gap:8px}
    .report-insight{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
    .report-insight .k{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
    .report-insight .v{font-size:14px;font-weight:750;line-height:1.45}
    .report-section-title{font-size:13px;font-weight:800;letter-spacing:.04em;margin-bottom:10px}
    .report-section-sub{font-size:11px;color:var(--muted2);margin-top:-4px;margin-bottom:10px;line-height:1.5}
    .report-kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .report-kpi{padding:12px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--border)}
    .report-kpi .num{font-size:24px;font-weight:850;line-height:1}
    .report-kpi .cap{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
    .report-priority-grid{display:grid;grid-template-columns:1fr;gap:10px}
    .report-priority-card{padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
    .report-priority-card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
    .report-priority-card .ttl{font-size:12px;font-weight:800;letter-spacing:.04em}
    .report-priority-card .big{font-size:28px;font-weight:900;line-height:1}
    .report-priority-card .small{font-size:11px;color:var(--muted2);margin-top:6px;line-height:1.5}
    .report-list{display:flex;flex-direction:column;gap:8px}
    .report-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
    .report-row-main{flex:1;min-width:0}
    .report-row-title{font-size:13px;font-weight:700;line-height:1.3}
    .report-row-meta{font-size:10px;color:var(--muted2);margin-top:3px;line-height:1.4}
    .report-row-side{text-align:right;flex-shrink:0}
    .report-row-val{font-size:18px;font-weight:850}
    .report-row-cap{font-size:10px;color:var(--muted2);margin-top:3px}
    .report-mini-table{display:grid;gap:8px}
    .report-mini-head,.report-mini-item{display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr;gap:8px;align-items:center}
    .report-mini-head{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;padding:0 6px}
    .report-mini-item{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font-size:12px}
    .report-split-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .report-note{font-size:11px;color:var(--muted2);line-height:1.5;margin-top:10px}
    .report-empty{padding:18px 8px;text-align:center;color:#6b7280;font-size:12px}
    
    .report-note{font-size:12px;color:var(--muted2);line-height:1.6;margin-top:10px}
    .report-empty{padding:20px 10px;text-align:center;color:#6b7280;font-size:12px}
    .report-export{background:#fff;color:#111827;border-radius:18px;padding:28px 30px;border:1px solid #ece7df;box-shadow:0 10px 30px rgba(15,23,42,.04);max-width:940px;margin:0 auto}
    .report-export *{box-sizing:border-box}
    .report-screen-view{margin-bottom:14px}
    .report-screen-head{padding:16px 8px 12px;max-width:940px;margin:0 auto}
    .report-screen-title{font-size:20px;font-weight:750;letter-spacing:-.02em;color:var(--text)}
    .report-screen-sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
    .report-filters-lean{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .report-filter-lean label{display:block;font-size:11px;color:var(--muted2);letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;font-weight:700}
    .report-actions-lean{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .report-export-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,.7fr);gap:18px;align-items:end;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid #ece7df}
    .report-brand-block{display:flex;flex-direction:column;gap:10px;min-width:0}
    .report-print-logo{width:132px;max-width:30vw;height:auto;display:block}
    .report-export-title{font-size:28px;font-weight:700;letter-spacing:-.03em;color:#172033;line-height:1.05;max-width:420px}
    .report-export-sub{font-size:13px;color:#6b7280;line-height:1.55;max-width:520px}
    .report-export-meta{font-size:12px;color:#6b7280;text-align:right;line-height:1.65;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
    .report-kpi-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-bottom:20px;border-top:1px solid #ece7df;border-bottom:1px solid #ece7df}
    .report-kpi-lite{background:transparent;border:none;border-right:1px solid #ece7df;border-radius:0;padding:14px 12px;text-align:left;min-width:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start}
    .report-kpi-lite .big{font-size:clamp(18px,1.55vw,28px);font-weight:700;line-height:1.02;letter-spacing:-.03em;color:#172033;white-space:nowrap;overflow:hidden;text-overflow:clip}
    .report-kpi-lite .lbl{font-size:10px;color:#7a7f87;margin-top:6px;line-height:1.2;text-transform:uppercase;letter-spacing:.08em;max-width:10ch}
    .report-kpi-lite:last-child{border-right:none}
    .report-kpi-lite.crit .big{color:#b93822}
    .report-kpi-lite.low .big{color:#a06a1a}
    .report-kpi-lite.ok .big{color:#1f7a46}
    .report-kpi-lite.total .big{font-size:clamp(16px,1.35vw,24px);letter-spacing:-.04em}
    .report-kpi-lite.compact .big{font-size:clamp(17px,1.45vw,26px)}
    .report-section-line{height:1px;background:#c8a35a;border-radius:999px;margin:0 0 14px}
    .report-export-section{margin-bottom:28px}
    .report-section-title-export{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#5b6472;margin:0 0 12px}
    .report-section-title-export.critical{color:#b93822}
    .report-summary-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:24px}
    .report-summary-card{background:#fcfbf8;border:1px solid #ece7df;border-radius:14px;padding:18px}
    .report-summary-card h4{margin:0 0 12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7a7f87}
    .report-summary-big{font-size:28px;font-weight:850;letter-spacing:-.03em;color:#0f172a}
    .report-summary-text{font-size:15px;line-height:1.8;color:#334155;max-width:34ch}
    .report-chip-row{display:flex;flex-wrap:wrap;gap:8px}
    .report-chip{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:650;background:#fff;border:1px solid #ece7df;color:#4b5563;max-width:100%}
    .report-table-wrap{overflow:auto;border:1px solid #ece7df;border-radius:12px;background:#fff}
    .report-table{width:100%;border-collapse:collapse;background:#fff}
    .report-table th{background:#233246;color:#fff;font-size:10px;font-weight:750;text-align:left;padding:10px 10px;border-bottom:1px solid #dbe2ea;letter-spacing:.06em;text-transform:uppercase}
    .report-table td{padding:10px 10px;font-size:12px;color:#1f2937;border-bottom:1px solid #f1ede7;vertical-align:top;line-height:1.4}
    .report-table tr:last-child td{border-bottom:none}
    .report-table .num{text-align:right;white-space:nowrap}
    .report-table td:first-child{font-weight:550}
    .report-category-title{font-size:26px;font-weight:700;line-height:1.08;margin:24px 0 10px;color:#1f2937;letter-spacing:-.03em}
    .report-subgroup-title{font-size:13px;font-weight:700;color:#8a5a12;margin:14px 0 8px}
    .report-status-ok{color:#15803d;font-weight:800}
    .report-status-low{color:#a16207;font-weight:800}
    .report-status-critical{color:#c2410c;font-weight:800}
    .report-status-out{color:#b91c1c;font-weight:800}
    .print-only{display:none}
    @media (max-width:900px){
      .report-export{padding:22px 20px}
      .report-kpi-strip{grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
      .report-summary-grid{grid-template-columns:1fr}
      .report-export-top{grid-template-columns:1fr}
      .report-export-meta{text-align:left;align-items:flex-start}
      .report-kpi-lite:nth-child(3){border-right:none}
    }
    @media (max-width:640px){
      .report-filters-lean{grid-template-columns:1fr}
      .report-actions-lean{flex-direction:column}
      .report-print-logo{width:118px;max-width:48vw}
      .report-export{padding:18px 16px;border-radius:16px}
      .report-export-title{font-size:22px}
      .report-export-sub{font-size:12px}
      .report-kpi-strip{grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
      .report-kpi-lite{padding:12px 10px}
      .report-kpi-lite .big{font-size:22px}
      .report-kpi-lite .lbl{font-size:10px;max-width:100%}
      .report-category-title{font-size:22px}
      .report-summary-card{padding:14px}
      .report-summary-text{font-size:14px}
      .report-table th,.report-table td{font-size:11px;padding:8px 7px}
    }
    @media print{
      html,body{overflow:visible;background:#fff;color:#111827}
      body{background:#fff}
      .app{max-width:none;height:auto;overflow:visible}
      .screen{position:static;display:block}

      .report-table td{color:#111827 !important}
      .report-status-ok{color:#15803d !important}
      .report-status-low{color:#a16207 !important}
      .report-status-critical{color:#c2410c !important}
      .report-status-out{color:#b91c1c !important}
      .report-export-sub,.report-export-meta,.report-note{color:#4b5563 !important}
      @page{size:A4 portrait;margin:12mm}
    }

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function clean(v){return v==null?'':String(v).trim();}
function norm(v){return clean(v).toLowerCase();}

function getQuickFilterMeta(key){
  const map = {
    all: { label: 'Todos los ítems', empty: 'No hay ítems para mostrar.' },
    low: { label: 'Ítems bajo mínimo', empty: 'No hay ítems bajo mínimo.' },
    critical: { label: 'Ítems críticos', empty: 'No hay ítems críticos.' },
    out: { label: 'Ítems agotados', empty: 'No hay ítems agotados.' }
  };
  return map[key] || null;
}
function matchesQuickFilter(item, key){
  const s = statusKey(item);
  if(!key || key === 'all') return true;
  return s === key;
}
function getQuickFilteredInventory(){
  return (state.inventory || []).filter(i => matchesQuickFilter(i, state.quickFilter));
}
function scheduleRender(){
  if(window.__renderQueued) return;
  window.__renderQueued = true;
  requestAnimationFrame(()=>{
    window.__renderQueued = false;
    render();
  });
}
function toast(msg, type='ok'){
  state.toast = msg;
  state.toastType = type;
  scheduleRender();
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{
    state.toast = null;
    scheduleRender();
  }, 2200);
}

function cacheKeyForUser(){ return 'kawas_stock_fastcache_v3_' + (state.user ? clean(state.user.nombre) : 'anon'); }
function saveCache(){
  try{
    localStorage.setItem(cacheKeyForUser(), JSON.stringify({
      inventory: state.inventory || [], history: state.history || [], historyLoaded: !!state.historyLoaded, savedAt: Date.now()
    }));
  }catch(e){}
}
function loadCache(){
  try{
    const raw = localStorage.getItem(cacheKeyForUser());
    if(!raw) return false;
    const cached = JSON.parse(raw);
    if(!cached || !Array.isArray(cached.inventory) || !cached.inventory.length) return false;
    state.inventory = cached.inventory || [];
    state.history = Array.isArray(cached.history) ? cached.history : [];
    state.historyLoaded = !!cached.historyLoaded && state.history.length > 0;
    state.bootedFromCache = true;
    return true;
  }catch(e){ return false; }
}
function preloadLastSessionCache(){
  try{
    const keys = Object.keys(localStorage).filter(k => k.indexOf('kawas_stock_fastcache_v3_') === 0);
    if(!keys.length) return false;
    let latest = null;
    keys.forEach(k => {
      try{
        const data = JSON.parse(localStorage.getItem(k) || '{}');
        if(!latest || Number(data.savedAt || 0) > Number(latest.savedAt || 0)) latest = data;
      }catch(e){}
    });
    if(!latest || !Array.isArray(latest.inventory) || !latest.inventory.length) return false;
    state.inventory = latest.inventory || [];
    state.history = Array.isArray(latest.history) ? latest.history : [];
    state.historyLoaded = !!latest.historyLoaded && state.history.length > 0;
    state.bootedFromCache = true;
    return true;
  }catch(e){ return false; }
}

function requestUrl(action, params){
  const url = new URL(APPS_SCRIPT_URL);
  url.searchParams.set('action', action);
  if (params) Object.entries(params).forEach(([k,v]) => { if(v !== undefined && v !== null && v !== '') url.searchParams.set(k, v); });
  return url.toString();
}
async function request(action, options = {}){
  const { method = 'GET', body, params } = options;
  if(method === 'GET'){
    const res = await fetch(requestUrl(action, params), { method:'GET', redirect:'follow' });
    const text = await res.text();
    let json; try{ json = JSON.parse(text); } catch(e){ throw new Error('Respuesta inválida del backend'); }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    if(!json.success) throw new Error(json.error || 'Error del backend');
    return json.data;
  }
  const res = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify({ action, ...body }), redirect:'follow' });
  const text = await res.text();
  let json; try{ json = JSON.parse(text); } catch(e){ throw new Error('Respuesta inválida del backend'); }
  if(!res.ok) throw new Error('HTTP ' + res.status);
  if(!json.success) throw new Error(json.error || 'Error del backend');
  return json.data;
}

const api = {
  health: ()=>request('health'),
  stock: ()=>request('stock'),
  history: (filters={})=>request('historial',{params:filters}),
  login: pin => request('login',{method:'POST',body:{pin}}),
  adjust: payload => request('adjust-stock',{method:'POST',body:payload}),
  set: payload => request('set-stock',{method:'POST',body:payload})
};

async function ensureHistoryLoaded(force=false){
  if(state.historyLoaded && !force) return state.history;
  if(state.historyPromise) return state.historyPromise;

  state.historyPromise = (async ()=>{
    try{
      const history = await api.history({ limit: 100 });
      state.history = Array.isArray(history) ? history : [];
      state.historyLoaded = true;
      saveCache();
      return state.history;
    }catch(e){
      toast(e.message || 'No se pudo cargar historial', 'err');
      return state.history;
    }finally{
      state.historyPromise = null;
    }
  })();

  return state.historyPromise;
}

function queueHistoryWarmup(){
  clearTimeout(state.historyWarmupTimer);
  state.historyWarmupTimer = setTimeout(async ()=>{
    if(!state.historyLoaded){
      await ensureHistoryLoaded(false);
      scheduleRender();
    }
  }, 120);
}

function getCategoryMeta(name){ return CAT_META[name] || { icon:'📋', color:'#60a5fa' }; }
function statusKey(item){ const stock = Number(item.stock || 0), min = Number(item.minimo || 0); if(stock <= 0) return 'out'; if(min > 0 && stock <= min * 0.5) return 'critical'; if(min > 0 && stock <= min) return 'low'; return 'ok'; }
const STATUS = {
  out:{label:'Agotado', color:'#E05252', bg:'rgba(224,82,82,.12)'}, critical:{label:'Crítico', color:'#E89B3E', bg:'rgba(232,155,62,.10)'}, low:{label:'Bajo', color:'#D4A44A', bg:'rgba(212,164,74,.10)'}, ok:{label:'OK', color:'#4ABA7A', bg:'rgba(74,186,122,.08)'}
};
function progressPct(item){ const min = Number(item.minimo || 0), stock = Number(item.stock || 0); if(min <= 0) return 100; return Math.min(100, Math.round((stock / min) * 100)); }
function barColor(pct){ if(pct > 100) return '#4ABA7A'; if(pct > 50) return '#D4A44A'; return '#E05252'; }
function alerts(){ return state.inventory.filter(i => statusKey(i) !== 'ok').sort((a,b)=>({out:0,critical:1,low:2,ok:3}[statusKey(a)] - ({out:0,critical:1,low:2,ok:3}[statusKey(b)]))); }
function categoryMap(){ const map = {}; state.inventory.forEach(item => { const c = clean(item.categoria) || 'Sin categoría'; if(!map[c]) map[c] = []; map[c].push(item); }); return map; }
function subcategoryMap(category){ const map = {}; state.inventory.filter(i => clean(i.categoria) === category).forEach(item => { const sc = clean(item.subcategoria || item.subcat) || 'General'; if(!map[sc]) map[sc] = []; map[sc].push(item); }); return map; }
function getItemHistory(itemId){ return state.history.filter(h => clean(h.item_id) === clean(itemId) || clean(h.id) === clean(itemId)); }

function replaceInventoryItem(updatedItem){ state.inventory = (state.inventory || []).map(item => clean(item.id) === clean(updatedItem.id) ? updatedItem : item); }
function prependHistoryEntry(historyEntry){ if(!historyEntry) return; state.history = Array.isArray(state.history) ? state.history : []; state.history.unshift(historyEntry); state.history = state.history.slice(0,100); state.historyLoaded = true; }

function buildOptimisticHistoryEntry(item, mode, prevStock, nextStock, reason){
  const tipo = mode === 'set' ? 'ajuste' : (mode === 'add' ? 'entrada' : 'salida');
  return {
    timestamp: new Date().toISOString(),
    item_id: clean(item.id),
    item_nombre: clean(item.nombre),
    usuario: clean(state.user?.nombre) || 'Operador',
    tipo,
    stock_anterior: Number(prevStock || 0),
    stock_nuevo: Number(nextStock || 0),
    cantidad: Number(nextStock || 0) - Number(prevStock || 0),
    nota: clean(reason || '')
  };
}
function applyOptimisticStockChange(item, mode, amount, reason){
  const prevItem = JSON.parse(JSON.stringify(item));
  const prevStock = Number(item.stock || 0);
  const nextStock = mode === 'set'
    ? Number(amount)
    : mode === 'add'
      ? prevStock + Number(amount)
      : Math.max(0, prevStock - Number(amount));

  const optimisticItem = { ...item, stock: nextStock };
  replaceInventoryItem(optimisticItem);
  state.selectedItem = optimisticItem;
  state.selectedItemId = optimisticItem.id;
  const optimisticHistoryEntry = buildOptimisticHistoryEntry(optimisticItem, mode, prevStock, nextStock, reason);
  prependHistoryEntry(optimisticHistoryEntry);
  saveCache();
  return { prevItem, optimisticHistoryEntry };
}
function rollbackOptimisticStockChange(prevItem){
  if(!prevItem) return;
  replaceInventoryItem(prevItem);
  state.selectedItem = prevItem;
  state.selectedItemId = prevItem.id;
  if(Array.isArray(state.history) && state.history.length){

}

function calcProjection(item){
  const stock = Number(item.stock || 0), min = Number(item.minimo || 0);
  if(stock <= 0) return { icon:'🔴', title:'Sin stock', subtitle:'No hay unidades disponibles', days:'0', daily:'-', outDate:'-', color:'#E05252', daysNum:0 };
  const moves = getItemHistory(item.id), consumptions = [];
  moves.forEach(m => { const oldS = Number(m.stock_anterior ?? 0), newS = Number(m.stock_nuevo ?? 0); if(newS < oldS) consumptions.push({ amount: oldS - newS, ts: clean(m.timestamp) }); });
  function parseTS(ts){ const d = new Date(ts); return isNaN(d.getTime()) ? null : d; }
  if(consumptions.length < 1){
    if(min > 0){
      const estDaily = Math.max(1, Math.round(min / 14));
      const estDays = Math.round(stock / estDaily);
      const future = new Date(); future.setDate(future.getDate() + estDays);
      const outDate = String(future.getDate()).padStart(2,'0') + '/' + String(future.getMonth()+1).padStart(2,'0');
      const color = estDays <= 7 ? '#E05252' : estDays <= 21 ? '#D4A44A' : estDays <= 45 ? '#4A9BD9' : '#4ABA7A';
      return { icon: estDays <=7 ? '🔴' : estDays <=21 ? '🟡' : estDays <=45 ? '🔵' : '🟢', title: estDays <=7 ? 'Agotamiento inminente' : estDays <=21 ? 'Stock limitado' : estDays <=45 ? 'Stock moderado' : 'Stock holgado', subtitle:'Estimado desde stock mínimo', days:String(estDays), daily:'~'+estDaily, outDate, color, daysNum:estDays };
    }
    return null;
  }
  const totalConsumed = consumptions.reduce((acc, c) => acc + c.amount, 0);
  const dates = consumptions.map(c => parseTS(c.ts)).filter(Boolean).sort((a,b)=>a-b);
  let spanDays = Math.max(1, consumptions.length * 3);
  if(dates.length >= 2) spanDays = Math.max(1, Math.round((dates[dates.length-1] - dates[0]) / 86400000));
  else if(dates.length === 1) spanDays = Math.max(1, Math.round((new Date() - dates[0]) / 86400000));
  const dailyUse = Math.max(.1, totalConsumed / spanDays);
  const daysLeft = Math.round(stock / dailyUse);
  const future = new Date(); future.setDate(future.getDate() + daysLeft);
  const outDate = String(future.getDate()).padStart(2,'0') + '/' + String(future.getMonth()+1).padStart(2,'0');
  const color = daysLeft <= 7 ? '#E05252' : daysLeft <= 21 ? '#D4A44A' : daysLeft <= 45 ? '#4A9BD9' : '#4ABA7A';
  const icon = daysLeft <= 7 ? '🔴' : daysLeft <= 21 ? '🟡' : daysLeft <= 45 ? '🔵' : '🟢';
  const title = daysLeft <= 7 ? 'Agotamiento inminente' : daysLeft <= 14 ? 'Pedir pronto' : daysLeft <= 30 ? 'Stock limitado' : daysLeft <= 60 ? 'Stock moderado' : 'Stock holgado';
  return { icon, title, subtitle:'Basado en consumo histórico', days:String(daysLeft), daily: dailyUse < 1 ? dailyUse.toFixed(1) : Math.round(dailyUse).toString(), outDate, color, daysNum:daysLeft };
}

  ensureReportRangeDefaults();
  const inventory = Array.isArray(state.inventory) ? state.inventory.slice() : [];
  const history = getReportHistoryInRange();
  const urgent = inventory.filter(i => ['out','critical'].includes(statusKey(i)));
  const low = inventory.filter(i => statusKey(i) === 'low');
  const healthy = inventory.filter(i => statusKey(i) === 'ok');
  const categoryStats = Object.entries(categoryMap()).map(([cat, items]) => ({
    categoria: cat,
    items: items.length,
    urgent: items.filter(i => ['out','critical'].includes(statusKey(i))).length,
    low: items.filter(i => statusKey(i) === 'low').length,
    stock: items.reduce((acc,i)=>acc + Number(i.stock || 0), 0)
  })).sort((a,b)=> (b.urgent - a.urgent) || (b.low - a.low) || a.categoria.localeCompare(b.categoria,'es'));
  const purchaseList = inventory.map(item => {
    const key = statusKey(item);
    const projection = calcProjection(item);
    const severity = key === 'out' ? 0 : key === 'critical' ? 1 : key === 'low' ? 2 : 3;
    return { item, key, severity, projection };
  }).filter(x => x.key !== 'ok').sort((a,b)=> (a.severity - b.severity) || ((a.projection?.daysNum ?? 99999) - (b.projection?.daysNum ?? 99999)) || clean(a.item.nombre).localeCompare(clean(b.item.nombre),'es')).slice(0,12);
  const movementByType = ['add','subtract','set'].map(type => ({
    type,
    label: movementLabel(type),
    count: history.filter(h => norm(h.tipo) === type).length,
    units: history.filter(h => norm(h.tipo) === type).reduce((acc,h)=> acc + Math.abs(Number(h.cantidad || 0)), 0)
  }));
  const movementByUser = Object.entries(history.reduce((acc,h)=>{ const key = clean(h.usuario) || 'Sin usuario'; acc[key] = (acc[key] || 0) + 1; return acc; }, {})).map(([usuario,count]) => ({usuario,count})).sort((a,b)=> b.count - a.count).slice(0,8);
  const mostActiveItems = Object.entries(history.reduce((acc,h)=>{ const key = clean(h.item_nombre) || 'Sin nombre'; if(!acc[key]) acc[key] = { item:key, count:0, qty:0 }; acc[key].count += 1; acc[key].qty += Math.abs(Number(h.cantidad || 0)); return acc; }, {})).map(([,row]) => row).sort((a,b)=> (b.count - a.count) || (b.qty - a.qty)).slice(0,8);
  const recentHistory = history.slice().sort((a,b)=> new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime()).slice(0,10);
  return {
    inventory, history, urgent, low, healthy, categoryStats, purchaseList,
    movementByType, movementByUser, mostActiveItems, recentHistory,
    generatedAt: new Date().toLocaleString('es-CL'),
    generatedBy: clean(state.user?.nombre) || 'Operador',
    rangeLabel: `${formatDateOnly(state.reportRangeStart)} al ${formatDateOnly(state.reportRangeEnd)}`
  };
}

function reportStatusClass(key){
  return key === 'ok' ? 'report-status-ok' : key === 'low' ? 'report-status-low' : key === 'critical' ? 'report-status-critical' : 'report-status-out';
}
function escHtml(v){ return esc(v); }
function buildPrintProjection(item){
  const projection = calcProjection(item);
  if(!projection) return { usePerDay:'-', days:'-', outDate:'-' };
  return { usePerDay: projection.dailyLabel || '-', days: projection.days ?? '-', outDate: projection.outDate || '-' };
}
function groupInventoryForPrint(items){
  const byCat = {};
  (items || []).forEach(item=>{
    const cat = clean(item.categoria) || 'Sin categoría';
    const sub = clean(item.subcategoria) || '';
    if(!byCat[cat]) byCat[cat] = {};
    if(!byCat[cat][sub]) byCat[cat][sub] = [];
    byCat[cat][sub].push(item);
  });
  return Object.entries(byCat).sort((a,b)=>a[0].localeCompare(b[0],'es')).map(([cat, subs])=>({
    categoria:cat,
    subgrupos:Object.entries(subs).sort((a,b)=>(a[0]||'').localeCompare((b[0]||''),'es')).map(([sub, arr])=>({
      subgrupo: sub,
      items: arr.sort((a,b)=>(clean(a.nombre)).localeCompare(clean(b.nombre),'es'))
    }))
  }));
}

function bindLogin(){
  const pinInput = document.getElementById('pin');
  const loginBtn = document.getElementById('login-btn');
  const errorWrap = document.getElementById('login-error');
  if(!pinInput || !loginBtn || !errorWrap) return;

  let submitting = false;

  const submitLogin = async ()=>{
    if(submitting) return;
    const pin = clean(pinInput.value).replace(/\D/g,'');
    const maxLenAttr = Number(pinInput.getAttribute('maxlength') || 0);
    const requiredLen = maxLenAttr > 0 ? maxLenAttr : 4;
    if(pin.length < requiredLen) return;

    submitting = true;
    loginBtn.disabled = true;
    errorWrap.innerHTML = '';
    try{
      const user = await api.login(pin);
      state.user = { ...user, pin };
      state.page = 'home';
      state.quickFilter = '';
      state.didLoginFocus = false;
      saveCache();
      render();
      toast('Bienvenido');
      setTimeout(()=>{ loadData({ silent: true, preserveSelected: true }).catch(()=>{}); }, 0);
    }catch(e){
      errorWrap.innerHTML = `<div class="error">${esc(e.message || 'No se pudo iniciar sesión')}</div>`;
      pinInput.focus();
      if(pinInput.select) pinInput.select();
    }finally{
      submitting = false;
      const btn = document.getElementById('login-btn');
      if(btn) btn.disabled = false;
    }
  };

  loginBtn.onclick = submitLogin;

  pinInput.addEventListener('input', ()=>{
    pinInput.value = clean(pinInput.value).replace(/\D/g,'');
    const maxLenAttr = Number(pinInput.getAttribute('maxlength') || 0);
    const requiredLen = maxLenAttr > 0 ? maxLenAttr : 4;
    if(pinInput.value.length >= requiredLen){
      submitLogin();
    }
  });

  pinInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      e.preventDefault();
      submitLogin();
    }
  });
}


async function loadData(options = {}){
  const { forceHistory = false, silent = false } = options;
  if(state.syncPromise) return state.syncPromise;

  state.syncPromise = (async ()=>{
    try{
      state.syncing = true;
      if(!silent) scheduleRender();
      const stock = await api.stock();
      state.inventory = Array.isArray(stock) ? stock : [];
      saveCache();
      scheduleRender();
      if(forceHistory) await ensureHistoryLoaded(true);
      else queueHistoryWarmup();
    }catch(e){
      toast(e.message || 'No se pudieron cargar los datos', 'err');
    }finally{
      state.syncing = false;
      state.bootedFromCache = false;
      state.syncPromise = null;
      scheduleRender();
    }
  })();

  return state.syncPromise;
}

async function saveAdjustment() {
  if (state.saving) return;
  if (!state.user) {
    toast('Sesión inválida.', 'err');
    return;
  }

  const currentItem =
    state.selectedItem ||
    state.inventory.find(item => clean(item.id) === clean(state.selectedItemId || ''));

  if (!currentItem || !currentItem.id) {
    toast('No se encontró el producto seleccionado. Vuelve a abrir el ítem.', 'err');
    return;
  }

  const reason = clean(state.adjustNote);
  const amountRaw = clean(state.adjustValue);
  const amount = Number(amountRaw);

  if (amountRaw === '' || Number.isNaN(amount)) {
    toast('Ingresa una cantidad válida.', 'err');
    return;
  }

  if (!reason) {
    toast('Debes ingresar un motivo.', 'warn');
    return;
  }

  if (amount < 0) {
    toast('La cantidad no puede ser negativa.', 'err');
    return;
  }

  const mode = state.adjustMode;
  const optimistic = applyOptimisticStockChange(currentItem, mode, amount, reason);

  state.adjustMode = null;
  state.adjustValue = '';
  state.adjustNote = '';
  state.saving = true;
  render();
  toast('Actualizando stock...', 'ok');

  try {
    const response = mode === 'set'
      ? await api.set({
          productId: currentItem.id,
          newStock: amount,
          reason,
          userName: state.user.nombre,
          userPin: state.user.pin
        })
      : await api.adjust({
          productId: currentItem.id,
          type: mode,
          amount,
          reason,
          userName: state.user.nombre,
          userPin: state.user.pin
        });

    if (!response || !response.item) {
      throw new Error('El backend no devolvió el ítem actualizado.');
    }

    replaceInventoryItem(response.item);

    if (Array.isArray(state.history) && state.history.length) {
      state.history.shift();
    }
    prependHistoryEntry(response.historyEntry || buildOptimisticHistoryEntry(response.item, mode, optimistic.prevItem.stock, response.item.stock, reason));

    state.selectedItem = response.item;
    state.selectedItemId = response.item.id;

    saveCache();
    toast('Ajuste guardado correctamente');
  } catch (error) {
    rollbackOptimisticStockChange(optimistic.prevItem);
    toast(error.message || 'No se pudo guardar el ajuste.', 'err');
  } finally {
    state.saving = false;
    scheduleRender();
  }
}

  const adjN = document.getElementById('adj-n'); if(adjN) adjN.oninput = ()=>{ state.adjustNote = adjN.value; };
  const adjOk = document.getElementById('adj-ok'); if(adjOk) adjOk.onclick = saveAdjustment;
  const reportStart = document.getElementById('report-start');
  const reportEnd = document.getElementById('report-end');
  const applyRange = document.getElementById('apply-report-range');
  const last30 = document.getElementById('last30-report-range');
  if(applyRange) applyRange.onclick = ()=>{
    const start = reportStart ? clean(reportStart.value) : '';
    const end = reportEnd ? clean(reportEnd.value) : '';
    if(start && end && new Date(start) > new Date(end)){ toast('El rango de fechas no es válido.', 'warn'); return; }
    state.reportRangeStart = start;
    state.reportRangeEnd = end;
    scheduleRender();
  };
  if(last30) last30.onclick = ()=>{
    const d = new Date();
    state.reportRangeEnd = toDateInputValue(d);
    d.setDate(d.getDate()-29);
    state.reportRangeStart = toDateInputValue(d);
    scheduleRender();
  };
  const pdf = document.getElementById('gen-pdf'); if(pdf) pdf.onclick = generatePDF;
}

let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive:true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX, dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
  if(dx > 80 && dy < 80){
    if(state.selectedItem){ state.selectedItem = null; state.selectedItemId = null; state.adjustMode = null; state.adjustValue = ''; state.adjustNote = ''; render(); return; }
    if(state.selectedSubcategory){ const multi = Object.keys(subcategoryMap(state.selectedCategory)).length > 1; if(multi) state.selectedSubcategory = null; else { state.selectedCategory = null; state.selectedSubcategory = null; } render(); return; }
    if(state.selectedCategory){ state.selectedCategory = null; render(); }
  }
}, { passive:true });

async function boot(){
  preloadLastSessionCache();
  render();
}
boot();
</script>
</body>
</html>
